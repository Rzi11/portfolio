function aiModalHTML() { return state.modal === 'assist' ? assistModalHTML() : ''; }

Object.assign(actions, {
  'assist-open'(kind) { openAssist(kind); },
  'assist-close'() { stopRecording(); state.assist = null; state.modal = null; render(); },
  'assist-tab'(tab) { readTextArea(); stopRecording(); state.assist.tab = tab; render(); },
  async 'assist-rec'() {
    const a = state.assist;
    if (a.recording) { stopRecording(); readTextArea(); render(); return; }
    readTextArea(); a.error = null;
    if (SpeechRec) {
      recognition = new SpeechRec(); recognition.lang = 'fr-FR'; recognition.continuous = true; recognition.interimResults = true;
      const base = a.text ? `${a.text.trim()} ` : '';
      recognition.onresult = (ev) => {
        let finalText = '', interim = '';
        for (let i = 0; i < ev.results.length; i++) { const r = ev.results[i]; if (r.isFinal) finalText += r[0].transcript; else interim += r[0].transcript; }
        a.text = base + finalText;
        const el = document.getElementById('assist-text'); if (el) el.value = a.text + (interim ? ` ${interim}` : '');
      };
      recognition.onerror = (ev) => { a.error = ev.error === 'not-allowed' || ev.error === 'service-not-allowed' ? 'Le micro est bloqué. Autorise-le dans le navigateur (dans l’aperçu Claude, le micro n’est pas disponible : ouvre Crewline depuis ton site).' : `Dictée interrompue (${ev.error}).`; a.recording = false; render(); };
      recognition.onend = () => { if (a.recording) { a.recording = false; render(); } };
      try { recognition.start(); a.recording = true; } catch (e) { a.error = blockedHint(e); }
      render(); return;
    }
    // Sans reconnaissance vocale : on enregistre l’audio et l’IA l’écoute
    try {
      const stream = await navigator.mediaDevices.getUserMedia({ audio: true });
      const chunks = []; recorder = new MediaRecorder(stream);
      recorder.ondataavailable = (e) => chunks.push(e.data);
      recorder.onstop = async () => {
        stream.getTracks().forEach((t) => t.stop());
        const blob = new Blob(chunks, { type: recorder.mimeType || 'audio/webm' });
        const base64 = await new Promise((res) => { const r = new FileReader(); r.onload = () => res(String(r.result).split(',')[1]); r.readAsDataURL(blob); });
        runAssist({ media: { mime: blob.type.split(';')[0], base64 } });
      };
      recorder.start(); a.recording = true;
    } catch (e) { a.error = 'Le micro est indisponible ou bloqué dans cette page.'; }
    render();
  },
  'assist-run'() {
    const a = state.assist; readTextArea(); stopRecording();
    if (a.tab === 'photo') { if (!a.image) { a.error = 'Choisis d’abord une image.'; render(); return; } runAssist({ media: a.image }); return; }
    if (!a.text.trim()) { a.error = 'Dicte ou colle d’abord quelque chose.'; render(); return; }
    runAssist({ text: a.text });
  },
  'assist-apply'() {
    const a = state.assist;
    const res = applyChanges(state.model, a.patch, a.selected, a.suggest);
    state.model = res.model; state.assist = null; state.modal = null;
    changed();
    toast(`${res.added} ajout${res.added > 1 ? 's' : ''}, ${res.updated} mise${res.updated > 1 ? 's' : ''} à jour`);
  },
  'ai-save'() {
    const provider = document.getElementById('ai-provider').value;
    const next = { ...state.ai, provider, key: document.getElementById('ai-key').value.trim() };
    const model = document.getElementById('ai-model').value.trim();
    if (provider === state.ai.provider) { if (provider === 'gemini') next.model = model || AI_DEFAULTS.model; else next.textModel = model || AI_DEFAULTS.textModel; }
    const ep = document.getElementById('ai-endpoint'); if (ep) next.endpoint = ep.value.trim() || AI_DEFAULTS.endpoint;
    state.ai = next; store.set(AI_KEY, next); render(); toast('Réglages de l’IA enregistrés dans ce navigateur');
  },
  async 'ai-test'() {
    const out = document.getElementById('ai-test-result');
    if (!state.ai.key) { out.textContent = 'Enregistre d’abord une clé.'; return; }
    out.textContent = 'Test en cours…';
    try {
      const p = await aiExtract(state.ai, state.model, 'team', { text: 'Test : Zoé, préparation, de 8h à 12h.' });
      out.textContent = p.workers.length ? `Connexion réussie : l’IA a bien lu « ${p.workers[0].name} ».` : 'Connexion réussie, mais la réponse était vide.';
    } catch (e) { out.textContent = blockedHint(e); }
  },
  'ai-forget'() { state.ai = { ...AI_DEFAULTS }; store.set(AI_KEY, state.ai); render(); toast('Clé oubliée'); },
});

// ---------------------------------------------------------------------------
// Sites et continuité des journées
// Un site (« Villa B », « Hub Saint-Priest »…) garde son entrepôt, son équipe et ses vagues
// habituelles. « Journée suivante » archive la journée dans le suivi et repart du même layout.
// ---------------------------------------------------------------------------
const SITES_KEY = 'crewline.sites';
const sitesList = () => store.get(SITES_KEY, []);
const dayShort = (iso) => (iso ? new Date(`${iso}T12:00:00`).toLocaleDateString('fr-FR', { weekday: 'short', day: 'numeric', month: 'short' }) : '');
function nextWorkdayAfter(iso) {
  const d = iso ? new Date(`${iso}T12:00:00`) : new Date();
  do { d.setDate(d.getDate() + 1); } while ([0, 6].includes(d.getDay()));
  return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
}
// Jours du suivi qui concernent le site ouvert (l’historique d’exemple vaut pour tous)
function siteDays() {
  const id = state.model.site?.id ?? null;
  return state.history.days.filter((d) => !d.site || d.site === id);
}
function saveSiteCurrent() {
  const site = state.model.site; if (!site) return;
  const list = sitesList();
  const i = list.findIndex((x) => x.id === site.id);
  const entry = { id: site.id, name: site.name, updatedAt: new Date().toISOString(), model: state.model };
  if (i >= 0) list[i] = entry; else list.push(entry);
  store.set(SITES_KEY, list);
}
// Dates de fin de mission écrites « demain » dans les exemples → vraie date
function resolveRelativeDates(model) {
  model.date ??= todayISO();
  for (const w of model.workers) { if (w.missionEnd === 'demain') w.missionEnd = nextWorkdayAfter(model.date); if (w.missionEnd === 'aujourdhui') w.missionEnd = model.date; }
  return model;
}
const isInterim = (w) => w.contract === 'interim';
function missionBadge(w, date) {
  if (!isInterim(w)) return '';
  const end = w.missionEnd;
  const soon = end && date && end <= nextWorkdayAfter(date);

Object.assign(actions, {
  open(value) {
    if (!value) return;
    const [kind, k] = value.split(':');
    try {
      if (kind === 'new') state.model = resolveRelativeDates(createModel('empty'));
      else if (kind === 'preset') state.model = resolveRelativeDates(createModel(k));
      else if (kind === 'site') { const s = sitesList().find((x) => x.id === k); state.model = resolveRelativeDates(normalizeModel(s.model)); }
      else { const lib = store.get(LIB_KEY, []); state.model = resolveRelativeDates(normalizeModel(lib[+k].model)); }
    } catch (e) { toast(`Ouverture impossible : ${e.message}`); return; }
    state.selected = 'best'; state.editing = null;
    changed();
    if (kind === 'new') { go('warehouse'); toast('Journée vierge : commence par décrire tes postes'); }
    else toast(`« ${state.model.site?.name ?? state.model.name} » ouvert`);
  },
  save() { if (!state.model.site) { state.modal = 'site-create'; render(); } else { saveSiteCurrent(); toast(`« ${state.model.site.name} » est enregistré (c’est aussi automatique)`); } },
  'site-create'() { state.modal = 'site-create'; render(); },
  'site-do-create'() {
    const name = document.getElementById('sc-name').value.trim();
    if (!name) { toast('Donne un nom au site.'); return; }
    const date = document.getElementById('sc-date').value || todayISO();
    state.model.site = state.model.site?.name === name ? state.model.site : { id: `site-${Date.now().toString(36)}`, name };
    state.model.date = date; state.model.name = name;
    state.modal = null; changed(); toast(`Site « ${name} » enregistré : il sera retrouvé dans « Ouvrir »`);
  },
  'next-day'() { state.modal = 'next-day'; render(); },
  'next-day-do'() {
    const m = state.model;
    const next = document.getElementById('nd-date').value || nextWorkdayAfter(m.date);
    const remove = new Set([...document.querySelectorAll('[data-nd]')].filter((x) => x.checked).map((x) => x.dataset.nd));
    const keepWaves = document.getElementById('nd-keep-waves').checked;
    const keepEvents = document.getElementById('nd-keep-events').checked;
    // 1. Archiver la journée en cours (résultat du plan sélectionné, sinon sans changement)
    const s = scenario();
    let result = null, planName = '';
    try {
      if (state.analysis?.result) { const sel = selectedPlan(s); result = sel.result; planName = sel.name; }
      else { result = simulate(s, []); planName = 'Ne rien changer'; }
    } catch { /* journée incomplète : archivée sans résultat */ }
    let day;
    try { day = dayFromModel(m, s, result, { date: m.date, planName }); }
    catch { day = { date: m.date, weekday: weekdayOf(m.date), startHour: m.settings.startHour, horizon: m.settings.horizon, stages: [], staff: {}, volumes: {}, orders: 0, late: null, due: null, events: [], rates: [], plan: '', note: '' }; }
    day.site = m.site?.id ?? null; day.siteName = m.site?.name ?? ''; day.snapshot = JSON.parse(JSON.stringify(m));
    saveHistory(addDay(state.history, day));
    // 2. Nouvelle journée : même layout
    const n = JSON.parse(JSON.stringify(m));
    n.date = next; n.manualMoves = [];
    n.workers = n.workers.filter((w) => !remove.has(w.id));
    if (!keepEvents) n.events = [];
    n.events = n.events.filter((e) => e.type !== 'absence' || n.workers.some((w) => w.id === e.workerId));
    if (!keepWaves) n.batches = [];
    state.model = n; state.selected = 'best'; state.modal = null;
    changed();
    go('day');
    toast(`Journée du ${dayShort(m.date)} archivée${remove.size ? `, ${remove.size} intérimaire${remove.size > 1 ? 's' : ''} retiré${remove.size > 1 ? 's' : ''}` : ''}. Nouvelle journée : ${dayShort(next).replace(/\.$/, '')}.`);
  },
  'hist-reopen'(date) {
    const d = siteDays().find((x) => x.date === date);
    if (!d?.snapshot) return;
    state.model = normalizeModel(d.snapshot); state.selected = 'best'; state.editing = null;
    changed(); go('diagnostic'); toast(`Journée du ${dayShort(date)} rouverte`);
  },
});

// Flux = groupes de postes reliés entre eux (composantes connexes du graphe)
function stageFlows(stages) {
  const parent = new Map(stages.map((s) => [s.id, s.id]));
  const find = (x) => { while (parent.get(x) !== x) { parent.set(x, parent.get(parent.get(x))); x = parent.get(x); } return x; };
  for (const s of stages) for (const p of s.after ?? []) if (parent.has(p)) parent.set(find(s.id), find(p));
  const depth = stageDepths(stages);
  const groups = new Map();
  for (const s of stages) { const r = find(s.id); if (!groups.has(r)) groups.set(r, []); groups.get(r).push(s); }
  return [...groups.values()].map((g) => g.sort((a, b) => depth[a.id] - depth[b.id] || stages.indexOf(a) - stages.indexOf(b)));
}

// ---------- Parcours d’une vague ----------
function routeStages(route) {
  const m = state.model;
  const depth = stageDepths(m.stages);
  const list = route ? m.stages.filter((s) => route.includes(s.id)) : [...m.stages];
  return list.sort((a, b) => depth[a.id] - depth[b.id] || m.stages.indexOf(a) - m.stages.indexOf(b));
}
function routeSummaryHTML(path, route) {
  const m = state.model;
  const list = routeStages(route);
  const chip = (s) => `<span class="route-step"><span class="swatch" style="background:${stageColor(m.stages.indexOf(s))}"></span>${esc(s.name)}</span>`;
  const shown = list.length > 6 ? [...list.slice(0, 3).map(chip), `<span class="muted">… ${list.length - 5} de plus …</span>`, ...list.slice(-2).map(chip)] : list.map(chip);
  return `<div class="route-line"><span class="muted small">${route ? `Parcours (${list.length} poste${list.length > 1 ? 's' : ''})` : `Tous les postes (${list.length})`} :</span>${shown.join('<span class="arrow" aria-hidden="true">→</span>')}<button class="btn small ghost" data-action="route-edit" data-arg="${path}">Modifier le parcours</button></div>`;
}

function routeModalHTML() {
  if (state.modal !== 'route' || !state.routeEdit) return '';
  const m = state.model; const obj = getPath(m, state.routeEdit);
  if (!obj) return '';
  const route = obj.route;
  const on = (id) => !route || route.includes(id);
  const others = [...m.batches.map((b, i) => ({ path: `batches.${i}`, name: b.name, route: b.route })), ...m.events.map((e, i) => ({ path: `events.${i}`, name: 'Pic imprévu', route: e.route, type: e.type })).filter((x) => x.type === 'peak')].filter((x) => x.path !== state.routeEdit);
  const distinct = []; const seen = new Set();
  for (const o of others) { const k = JSON.stringify(o.route ?? null); if (seen.has(k)) continue; seen.add(k); distinct.push(o); }
  const sel = new Set(m.stages.filter((s) => on(s.id)).map((s) => s.id));
  const graph = flowGraph(m.stages, { selected: sel, pick: 'route-node', label: 'Clique sur les postes pour composer le parcours' });
  const list = [...m.stages].sort((x, y) => x.name.localeCompare(y.name, 'fr')).map((s) => `<label class="route-check"><input type="checkbox" data-action-change="route-toggle" data-s="${esc(s.id)}" ${on(s.id) ? 'checked' : ''}><span class="swatch" style="background:${stageColor(m.stages.indexOf(s))}"></span>${esc(s.name)}</label>`).join('');
  const groups = `${graph}<details class="route-group"><summary>Ou cocher dans la liste (${m.stages.length} postes, par ordre alphabétique)</summary><div class="route-checks" style="margin-top:8px">${list}</div></details>`;
  const preview = routeStages(route).map((s) => esc(s.name)).join(' → ');
  return `<div class="modal-back"><div class="modal" role="dialog" aria-modal="true" aria-labelledby="mt" style="width:min(860px,100%)">
    <h2 id="mt">Parcours de « ${esc(obj.name ?? 'Pic imprévu')} »</h2>
    <p class="muted">Clique sur les postes du schéma pour les ajouter au parcours ou les retirer. Les postes cochés sont en couleur ; tu peux zoomer et te déplacer dans le schéma.</p>
    ${distinct.length ? `<div class="field" style="max-width:520px"><label for="route-copy">Même parcours qu’une autre vague</label><select id="route-copy" data-action-change="route-copy"><option value="">Choisir…</option>${distinct.map((o) => `<option value="${esc(o.path)}">${esc(o.name)} · ${routeStages(o.route).length} postes</option>`).join('')}</select></div>` : ''}
    ${groups}
    <div class="notice small"><b>Parcours :</b> ${preview || '<span class="muted">aucun poste</span>'}</div>
    <div class="row"><button class="btn small ghost" data-action="route-all">Tous les postes</button><button class="btn primary" data-action="close-modal">Terminé</button></div>

}

  const f = state.ganttFilter;
  if (f === 'moved') return moves.some((x) => x.workerId === w.id) || (state.editing && state.editing.workerId === w.id);
  if (f === 'interim') return w.contract === 'interim';
  if (f.startsWith('st:')) return w.stage === f.slice(3) || moves.some((x) => x.workerId === w.id && x.to === f.slice(3));
  return true;
}

Object.assign(actions, {
  'route-edit'(path) { state.routeEdit = path; state.modal = 'route'; render(); },
  'route-node'(id) {
    const m = state.model; const obj = getPath(m, state.routeEdit); const all = m.stages.map((s) => s.id);
    let r = obj.route ? [...obj.route] : [...all];
    r = r.includes(id) ? r.filter((x) => x !== id) : [...r, id];
    if (!r.length) { toast('Une vague doit passer par au moins un poste.'); return; }
    obj.route = all.every((x) => r.includes(x)) ? null : all.filter((x) => r.includes(x));
    // garder le zoom du schéma pendant l’édition
    const wrap = document.querySelector('.modal .flowwrap'); const vb = wrap?.querySelector('svg')?.getAttribute('viewBox');
    changed();
    if (vb) document.querySelector('.modal .flowwrap svg')?.setAttribute('viewBox', vb);
  },
  'route-all'() { getPath(state.model, state.routeEdit).route = null; changed(); },
  'route-flow'(gi) {
    const m = state.model; const obj = getPath(m, state.routeEdit); const g = stageFlows(m.stages)[+gi];
    const all = m.stages.map((s) => s.id); let r = obj.route ? [...obj.route] : [...all];
    const allOn = g.every((s) => r.includes(s.id));
    r = allOn ? r.filter((id) => !g.some((s) => s.id === id)) : [...new Set([...r, ...g.map((s) => s.id)])];
    if (!r.length) { toast('Une vague doit passer par au moins un poste.'); return; }
    obj.route = all.every((x) => r.includes(x)) ? null : all.filter((x) => r.includes(x));
    changed();
  },
  'dep-menu'(i) { state.depMenu = +i; render(); document.getElementById(`dep-add-${i}`)?.focus(); },
  'dep-remove'(arg) { const [i, id] = arg.split('|'); const st = state.model.stages[+i]; st.after = (st.after ?? []).filter((x) => x !== id); changed(); },
  'stage-open'(i) { state.openStage = state.openStage === +i ? null : +i; state.depMenu = null; render(); },
  'break-add'(i) {
    const w = state.model.workers[+i]; w.breaks ??= [];
    const last = w.breaks[w.breaks.length - 1];
    const start = Math.min(w.end - 15, last ? last.start + last.duration + 120 : w.start + 120);
    w.breaks.push({ start: Math.max(w.start, start), duration: 15 }); changed();
  },
  'break-remove'(arg) { const [i, k] = arg.split('|').map(Number); state.model.workers[i].breaks.splice(k, 1); changed(); },
});

// Changements propres à ces composants
document.addEventListener('change', (ev) => {
  const el = ev.target; const a = el.dataset?.actionChange; if (!a) return;
  const m = state.model;
  if (a === 'route-toggle') {
    const obj = getPath(m, state.routeEdit); const all = m.stages.map((s) => s.id);
    let r = obj.route ? [...obj.route] : [...all];
    r = el.checked ? [...new Set([...r, el.dataset.s])] : r.filter((x) => x !== el.dataset.s);
    if (!r.length) { toast('Une vague doit passer par au moins un poste.'); render(); return; }
    obj.route = all.every((x) => r.includes(x)) ? null : all.filter((x) => r.includes(x));
    changed();
  } else if (a === 'route-copy') {
    if (!el.value) return; const src = getPath(m, el.value);
    getPath(m, state.routeEdit).route = src.route ? [...src.route] : null; changed();
  } else if (a === 'dep-add') {
    const i = +el.dataset.i; const st = m.stages[i]; const id = el.value; if (!id) return;
    const next = [...(st.after ?? []), id];
    if (findCycle(m.stages.map((x, j) => (j === i ? { ...x, after: next } : x)))) { toast('Impossible : cela créerait une boucle entre les postes.'); state.depMenu = null; render(); return; }
    st.after = next; state.depMenu = null; changed();
  } else if (a === 'gantt-filter') { state.ganttFilter = el.value; render(); }
});

// Clavier : Entrée ou Espace sur un poste cliquable du schéma
document.addEventListener('keydown', (ev) => {
  const g = ev.target.closest?.('svg [role="button"][data-action]');
  if (g && (ev.key === 'Enter' || ev.key === ' ')) { ev.preventDefault(); actions[g.dataset.action]?.(g.dataset.arg); }
});

// ---------- Démarrage ----------
loadInitial();
const hashStep = (location.hash || '').slice(1);
if (STEPS.some((s) => s.id === hashStep)) state.step = hashStep;
render();

</script>
</body></html>
