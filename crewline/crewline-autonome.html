<!doctype html>
<html lang="fr"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Crewline</title>
<meta name="claude:viewport-fit-sides" content="cover">
<meta name="description" content="Simulateur de réaffectation des équipes d’entrepôt">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=IBM+Plex+Mono:wght@400;500;600&display=swap">
<style>
/* Concept : un tableau de bord de chef d'équipe — fond béton, encre graphite,
   jaune sécurité pour l'action, une couleur par poste (comme des lignes). */
:root {
  --bg: #F2F0EA;          /* béton */
  --surface: #FFFFFF;
  --surface-2: #F8F7F3;
  --ink: #16181B;         /* graphite */
  --muted: #5F5C55;
  --line: #DEDACF;
  --line-strong: #16181B;
  --accent: #F5C400;      /* jaune sécurité */
  --accent-ink: #16181B;
  --accent-soft: #FFF3C4;
  --ok: #2E7D4F;
  --ok-soft: #E3F1E8;
  --warn: #B86E00;
  --warn-soft: #FFE9C2;
  --bad: #C7361B;
  --bad-soft: #FBE1DA;
  --s1: #1F6FB8; --s2: #E8590C; --s3: #0B7A6B; --s4: #7B4FD6; --s5: #C2185B; --s6: #5D7A00; --s7: #00838F; --s8: #8D6E63;
  --hatch: #CFCAC0;
  --seg-ink: #FFFFFF;
  --interim: #8E44AD;
  --shadow: 0 1px 0 rgba(22,24,27,.06), 0 6px 20px -12px rgba(22,24,27,.25);
  --font-display: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-body: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
  --font-data: 'IBM Plex Mono', ui-monospace, 'SFMono-Regular', Menlo, monospace;
  --radius: 10px;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #131517; --surface: #1C1F23; --surface-2: #22262B; --ink: #F2F0EA; --muted: #A8A49B; --line: #33373D; --line-strong: #F2F0EA;
    --accent: #F5C400; --accent-ink: #16181B; --accent-soft: #3A3210;
    --ok: #5BC48A; --ok-soft: #173325; --warn: #F2A93B; --warn-soft: #3A2A0E; --bad: #FF7A5C; --bad-soft: #3E1D16;
    --s1: #5AA2E6; --s2: #FF8A4C; --s3: #3CC3AE; --s4: #A88BF0; --s5: #F06292; --s6: #A4C639; --s7: #4DD0E1; --s8: #BCAAA4;
    --hatch: #3D4249; --seg-ink: #131517; --interim: #D7A6F0; --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #131517; --surface: #1C1F23; --surface-2: #22262B; --ink: #F2F0EA; --muted: #A8A49B; --line: #33373D; --line-strong: #F2F0EA;
  --accent: #F5C400; --accent-ink: #16181B; --accent-soft: #3A3210;
  --ok: #5BC48A; --ok-soft: #173325; --warn: #F2A93B; --warn-soft: #3A2A0E; --bad: #FF7A5C; --bad-soft: #3E1D16;
  --s1: #5AA2E6; --s2: #FF8A4C; --s3: #3CC3AE; --s4: #A88BF0; --s5: #F06292; --s6: #A4C639; --s7: #4DD0E1; --s8: #BCAAA4;
  --hatch: #3D4249; --seg-ink: #131517; --interim: #D7A6F0; --shadow: 0 1px 0 rgba(0,0,0,.4), 0 8px 24px -14px rgba(0,0,0,.7);
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { background: var(--bg); color: var(--ink); }
body { font-family: var(--font-body); font-size: 15px; line-height: 1.5; -webkit-font-smoothing: antialiased; }
body::before { content: ""; position: fixed; inset: 0 0 auto; height: env(safe-area-inset-top, 0px); z-index: 10; background: var(--surface); }
h1, h2, h3 { font-family: var(--font-display); text-wrap: balance; margin: 0; letter-spacing: -0.02em; }
h1 { font-size: clamp(26px, 3.2vw, 36px); font-weight: 900; line-height: 1.1; }
h2 { font-size: 22px; font-weight: 800; line-height: 1.2; }
h3 { font-size: 16px; font-weight: 800; }
p { margin: 0; }
.num, .mono { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }
.eyebrow { font-family: var(--font-data); font-size: 12px; letter-spacing: .12em; text-transform: uppercase; color: var(--muted); }
:focus-visible { outline: 3px solid var(--accent); outline-offset: 2px; }
a { color: var(--ink); text-decoration-color: var(--accent); text-decoration-thickness: 2px; text-underline-offset: 3px; }

/* ---------- En-tête ---------- */
.topbar { position: sticky; top: env(safe-area-inset-top, 0px); z-index: 5; background: var(--surface); border-bottom: 2px solid var(--line-strong); }
.topbar-inner { max-width: 1320px; margin: 0 auto; padding-block: 10px 0; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-wrap: wrap; gap: 8px 18px; align-items: center; justify-content: space-between; }
.brand { display: flex; align-items: center; gap: 10px; font-family: var(--font-display); font-weight: 900; font-size: 21px; letter-spacing: -0.03em; }
.brand svg { flex: none; }
.steps { order: 3; flex: 1 0 100%; display: flex; gap: 2px; flex-wrap: nowrap; overflow-x: auto; scrollbar-width: none; margin-inline: -4px; padding: 6px 4px 8px; }
.steps::-webkit-scrollbar { display: none; }
.step { appearance: none; border: 0; background: transparent; color: var(--muted); font: 700 14px/1 var(--font-body); padding: 9px 12px; border-radius: 8px; cursor: pointer; display: inline-flex; gap: 8px; align-items: center; min-height: 40px; white-space: nowrap; flex: none; }
.step .n { font-family: var(--font-data); font-size: 12px; border: 1.5px solid currentColor; border-radius: 50%; width: 22px; height: 22px; display: inline-grid; place-items: center; }
.step:hover { color: var(--ink); background: var(--surface-2); }
.step[aria-current="page"] { background: var(--accent); color: var(--accent-ink); }
.steps .group { font-family: var(--font-data); font-size: 11px; letter-spacing: .1em; text-transform: uppercase; color: var(--muted); align-self: center; padding: 0 4px 0 14px; white-space: nowrap; flex: none; }
.steps .group:first-child { padding-left: 4px; }
.step .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }
.toolbar { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.toolbar select { width: auto; max-width: 190px; min-height: 36px; padding: 6px 8px; font-size: 14px; }

/* ---------- Résumé du site ---------- */
.summary { order: 4; flex: 1 0 100%; display: flex; flex-wrap: wrap; gap: 4px 6px; padding: 0 0 10px; border-top: 1px solid var(--line); padding-top: 8px; }
.sum-item { appearance: none; border: 0; background: transparent; color: var(--muted); font: 500 13px/1.2 var(--font-body); padding: 4px 8px; border-radius: 6px; cursor: pointer; white-space: nowrap; }
.sum-item b { color: var(--ink); font-family: var(--font-data); font-weight: 600; }
.sum-item:hover { background: var(--surface-2); }
.sum-item.static { cursor: default; font-family: var(--font-data); }
.sum-item.static:hover { background: transparent; }

/* ---------- Parcours, dépendances, filtres ---------- */
.route-line { display: flex; flex-wrap: wrap; align-items: center; gap: 6px; font-size: 13px; padding: 2px 0 6px; }
.route-step { display: inline-flex; align-items: center; gap: 5px; font-weight: 600; white-space: nowrap; }
.route-line .arrow { color: var(--muted); }
.route-group { border: 1px solid var(--line); border-radius: 8px; padding: 10px 12px; display: flex; flex-direction: column; gap: 8px; }
.route-checks { display: flex; flex-wrap: wrap; gap: 6px 14px; }
.route-check { display: inline-flex; align-items: center; gap: 6px; color: var(--ink); font-size: 14px; font-weight: 600; margin: 0; cursor: pointer; }
.filters { display: flex; flex-wrap: wrap; gap: 10px 14px; align-items: flex-end; }
.filters .field { flex: 0 1 220px; }
.breaks { display: flex; flex-direction: column; gap: 4px; align-items: flex-start; }
.breaks input[type="time"] { width: 118px; }

/* ---------- Boutons, champs ---------- */
.btn { appearance: none; border: 1.5px solid var(--line-strong); background: var(--surface); color: var(--ink); font: 700 14px/1 var(--font-body); padding: 10px 14px; border-radius: 8px; cursor: pointer; min-height: 40px; display: inline-flex; gap: 8px; align-items: center; justify-content: center; white-space: nowrap; }
.btn:hover { background: var(--surface-2); }
.btn.primary { background: var(--accent); color: var(--accent-ink); border-color: var(--accent-ink); }
.btn.primary:hover { filter: brightness(1.05); }
.btn.dark { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--surface-2); }
.btn.small { min-height: 32px; padding: 6px 10px; font-size: 13px; }
.btn.icon { padding: 6px; min-width: 36px; min-height: 36px; }
.btn.danger { color: var(--bad); border-color: var(--line); }
.btn[disabled] { opacity: .5; cursor: not-allowed; }
label { font-size: 13px; font-weight: 600; color: var(--muted); display: block; margin-bottom: 4px; }
input, select, textarea { font: 500 15px/1.3 var(--font-body); color: var(--ink); background: var(--surface); border: 1.5px solid var(--line); border-radius: 7px; padding: 8px 10px; min-height: 40px; width: 100%; }
input[type="number"], input[type="time"] { font-family: var(--font-data); font-variant-numeric: tabular-nums; }
input[type="checkbox"] { width: 20px; height: 20px; min-height: 0; accent-color: var(--ink); }
input:hover, select:hover { border-color: var(--muted); }
input:focus, select:focus, textarea:focus { border-color: var(--ink); outline: none; box-shadow: 0 0 0 3px var(--accent-soft); }
textarea { font-family: var(--font-data); font-size: 13px; min-height: 140px; }
.field { min-width: 0; }
.fields { display: grid; gap: 12px; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
.hint { font-size: 12.5px; color: var(--muted); margin-top: 4px; }

/* ---------- Mise en page ---------- */
main { max-width: 1320px; margin: 0 auto; padding-block: 24px 64px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); display: flex; flex-direction: column; gap: 20px; }
.page-head { display: flex; flex-wrap: wrap; gap: 14px 24px; align-items: flex-end; justify-content: space-between; }
.page-head > div { min-width: 0; flex: 1 1 420px; display: flex; flex-direction: column; gap: 6px; }
.page-head p { color: var(--muted); max-width: 68ch; }
.panel { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 20px; display: flex; flex-direction: column; gap: 14px; min-width: 0; }
.panel.strong { border: 2px solid var(--line-strong); }
.panel-head { display: flex; flex-wrap: wrap; gap: 10px; justify-content: space-between; align-items: center; }
.grid-2 { display: grid; gap: 20px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 440px), 1fr)); }
.row { display: flex; gap: 10px; flex-wrap: wrap; align-items: center; }
.scroll-x { overflow-x: auto; -webkit-overflow-scrolling: touch; }
.notice { padding: 12px 14px; border-radius: 8px; background: var(--surface-2); border: 1px solid var(--line); font-size: 14px; }
.notice.warn { background: var(--warn-soft); border-color: transparent; }
.notice.bad { background: var(--bad-soft); border-color: transparent; }
.notice.ok { background: var(--ok-soft); border-color: transparent; }
.toast { position: fixed; bottom: calc(16px + env(safe-area-inset-bottom, 0px)); left: 50%; transform: translateX(-50%); background: var(--ink); color: var(--bg); padding: 12px 18px; border-radius: 8px; font-weight: 600; z-index: 20; max-width: calc(100% - 32px); }
.chip { display: inline-flex; align-items: center; gap: 6px; font-size: 12.5px; font-weight: 700; padding: 3px 9px; border-radius: 999px; background: var(--surface-2); border: 1px solid var(--line); white-space: nowrap; }
.chip.input { background: var(--surface); }
.chip.assumed { background: var(--warn-soft); border-color: transparent; }
.chip.interim { background: var(--surface); border: 1.5px dashed var(--interim); color: var(--interim); }
.chip.site { background: var(--ink); color: var(--bg); border-color: var(--ink); font-size: 13px; padding: 6px 10px; }
tr.is-interim .name input { border-style: dashed; border-color: var(--interim); }
.g-name.interim { color: var(--interim); }
.flowwrap.empty { padding: 40px 20px; text-align: center; cursor: default; }
.team-table .contract select { min-width: 110px; }
.team-table .contract input { width: 140px; }
.chip.computed { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.swatch { width: 12px; height: 12px; border-radius: 50%; flex: none; display: inline-block; }

/* ---------- Ligne des postes (entrepôt / diagnostic) ---------- */
.flow { display: flex; flex-wrap: wrap; gap: 0; align-items: stretch; }
.flow-stage { flex: 1 1 260px; min-width: 0; display: flex; flex-direction: column; gap: 10px; position: relative; padding: 16px; border: 1.5px solid var(--line); border-radius: var(--radius); background: var(--surface); }
.flow-link { flex: 0 0 28px; align-self: center; height: 6px; border-radius: 3px; }
.station { display: flex; align-items: center; gap: 10px; }
.station .ring { width: 26px; height: 26px; border-radius: 50%; border: 6px solid; background: var(--surface); flex: none; }
.station input { font-weight: 800; font-size: 17px; font-family: var(--font-display); }
.metro { display: flex; align-items: flex-start; overflow-x: auto; padding: 6px 2px 2px; }
.metro-stop { flex: 0 0 auto; width: 170px; display: flex; flex-direction: column; align-items: center; gap: 6px; text-align: center; }
.metro-stop .ring { width: 38px; height: 38px; border-radius: 50%; border: 8px solid; background: var(--surface); }
.metro-stop.hot .ring { background: var(--accent); border-color: var(--ink) !important; }
.metro-seg { flex: 1 0 40px; height: 8px; border-radius: 4px; margin-top: 15px; }
.metro-stop .tag { font-family: var(--font-data); font-size: 13px; padding: 2px 8px; border-radius: 4px; }
.metro-stop.hot .tag { background: var(--ink); color: var(--accent); font-weight: 600; }

.flowwrap { position: relative; background: var(--surface-2); border-radius: 8px; overflow: hidden; touch-action: none; cursor: grab; }
.flowwrap.dragging { cursor: grabbing; }
.flowgraph { display: block; width: 100%; height: auto; max-height: 460px; min-height: 200px; }
.flow-tools { position: absolute; top: 8px; right: 8px; display: flex; gap: 4px; }
.flow-tools .btn { min-height: 34px; min-width: 34px; padding: 4px 8px; background: var(--surface); }
.flow-hint { position: absolute; left: 10px; bottom: 8px; font-size: 12px; color: var(--muted); pointer-events: none; }
.flowgraph .g-label { font: 800 15px var(--font-display); fill: var(--ink); }
.flowgraph .g-tag { font: 500 12.5px var(--font-data); fill: var(--muted); }
.flowgraph .pick { cursor: pointer; }
.flowgraph .pick.off { opacity: .45; }
.flowgraph .pick:hover { opacity: 1; }
.flowgraph .pick:focus-visible { outline: none; }
.flowgraph .pick:focus-visible circle:nth-of-type(2) { stroke: var(--accent); stroke-width: 8; }
.modal .flowgraph { max-height: 52vh; }
.flowgraph .g-tag.hot { fill: var(--bad); font-weight: 600; }
.stage-grid { display: grid; gap: 14px; grid-template-columns: repeat(auto-fill, minmax(min(100%, 300px), 1fr)); }
.toggles { display: flex; flex-wrap: wrap; gap: 6px; }
.toggle { appearance: none; font: 600 13px/1 var(--font-body); color: var(--muted); background: var(--surface); border: 1.5px dashed var(--line); border-radius: 999px; padding: 7px 11px; cursor: pointer; display: inline-flex; gap: 6px; align-items: center; min-height: 32px; }
.toggle[aria-pressed="true"] { color: var(--ink); border-style: solid; border-color: var(--ink); background: var(--surface-2); }
.toggle .swatch { width: 10px; height: 10px; }

/* ---------- Tableaux ---------- */
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th { text-align: left; font-size: 12px; font-weight: 700; color: var(--muted); letter-spacing: .02em; padding: 8px; border-bottom: 1.5px solid var(--line); white-space: nowrap; vertical-align: bottom; }
td { padding: 6px 8px; border-bottom: 1px solid var(--line); vertical-align: middle; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; }
.team-table input, .team-table select { min-height: 36px; padding: 6px 8px; }
.team-table input[type="number"] { width: 78px; }
.team-table input[type="time"] { width: 118px; }
.team-table .name { min-width: 130px; }
.team-table select { min-width: 140px; }
.skill { display: flex; align-items: center; gap: 6px; }
.skill input[type="number"][disabled] { opacity: .35; }
.skill-chips { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; min-width: 360px; }
.skill-chip { display: inline-flex; align-items: center; gap: 6px; border: 1px solid var(--line); border-radius: 999px; padding: 2px 4px 2px 10px; font-size: 13px; font-weight: 600; background: var(--surface-2); white-space: nowrap; }
.skill-chip input[type="number"] { width: 64px; min-height: 28px; padding: 2px 6px; font-size: 13px; }
.skill-chip .x { appearance: none; border: 0; background: transparent; color: var(--muted); font-size: 16px; cursor: pointer; width: 26px; height: 26px; border-radius: 50%; }
.skill-chip .x:hover { background: var(--bad-soft); color: var(--bad); }
.skill-chips select { width: auto; min-height: 30px; padding: 2px 8px; font-size: 13px; }
tr.is-selected td { background: var(--accent-soft); }

/* ---------- Diagnostic : carte de chaleur ---------- */
.heat { display: grid; gap: 4px; min-width: 560px; }
.heat .h-label { font-weight: 700; display: flex; align-items: center; gap: 8px; font-size: 14px; }
.heat .h-time { font-family: var(--font-data); font-size: 12px; color: var(--muted); }
.heat .cell { height: 42px; border-radius: 6px; display: grid; place-items: center; font-family: var(--font-data); font-size: 12.5px; font-weight: 600; }
.cell.l0 { background: var(--surface-2); color: var(--muted); }
.cell.l1 { background: var(--ok-soft); color: var(--ok); }
.cell.l2 { background: var(--warn-soft); color: var(--warn); }
.cell.l3 { background: var(--bad); color: #FFFFFF; }
.cell.stop { background: repeating-linear-gradient(-45deg, var(--surface-2) 0 6px, var(--hatch) 6px 12px); color: var(--ink); }
.legend { display: flex; flex-wrap: wrap; gap: 8px 16px; font-size: 13px; color: var(--muted); align-items: center; }
.legend i { display: inline-block; width: 14px; height: 14px; border-radius: 4px; vertical-align: -2px; margin-right: 6px; }

/* ---------- Plans ---------- */
.headline { display: flex; gap: 14px; align-items: flex-start; background: var(--ink); color: var(--bg); padding: 18px 20px; border-radius: var(--radius); }
.headline .bar { width: 8px; align-self: stretch; background: var(--accent); border-radius: 3px; flex: none; }
.headline p { font-size: 18px; line-height: 1.45; font-weight: 500; max-width: 80ch; }
.headline b { color: var(--accent); }
.headline ul { margin: 8px 0 0; padding-left: 18px; color: var(--bg); opacity: .85; font-size: 14.5px; display: flex; flex-direction: column; gap: 4px; }
.plans { display: grid; gap: 12px; grid-template-columns: repeat(auto-fit, minmax(min(100%, 220px), 1fr)); }
.plan { appearance: none; text-align: left; font: inherit; color: inherit; border: 2px solid var(--line); background: var(--surface); border-radius: var(--radius); padding: 16px; display: flex; flex-direction: column; gap: 6px; cursor: pointer; min-width: 0; }
.plan:hover { border-color: var(--muted); }
.plan[aria-pressed="true"] { border-color: var(--line-strong); background: var(--accent); color: var(--accent-ink); }
.plan[aria-pressed="true"] .muted { color: var(--accent-ink); opacity: .8; }
.plan .big { font-family: var(--font-data); font-size: 34px; font-weight: 600; line-height: 1.05; }
.plan .what { font-size: 13.5px; min-height: 2.8em; }
.plan .kind { font-weight: 800; font-size: 14px; }
.plan.mine { border-style: dashed; }
.kpis { display: grid; gap: 10px; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); }
.kpi { background: var(--surface-2); border-radius: 8px; padding: 12px; display: flex; flex-direction: column; gap: 2px; }
.kpi .v { font-family: var(--font-data); font-size: 22px; font-weight: 600; font-variant-numeric: tabular-nums; }
.kpi .l { font-size: 12.5px; color: var(--muted); font-weight: 600; }
.delta-good { color: var(--ok); }
.delta-bad { color: var(--bad); }

/* ---------- Planning (Gantt) ---------- */
.gantt { position: relative; min-width: 680px; user-select: none; -webkit-user-select: none; }
.g-axis, .g-row { display: grid; grid-template-columns: 150px 1fr; align-items: center; }
.g-axis .ticks { position: relative; height: 22px; }
.g-axis .tick { position: absolute; top: 0; font-family: var(--font-data); font-size: 12px; color: var(--muted); transform: translateX(-50%); }
.g-row { min-height: 40px; border-top: 1px solid var(--line); }
.g-name { font-weight: 700; font-size: 14px; padding-right: 10px; display: flex; flex-direction: column; line-height: 1.2; overflow: hidden; }
.g-name small { font-weight: 500; color: var(--muted); font-size: 12px; }
.g-track { position: relative; height: 28px; margin-block: 6px; background: var(--surface-2); border-radius: 5px; touch-action: none; }
.g-track.editable { cursor: crosshair; }

<script type="module">
// Crewline — moteur v3.1
// Simulation à la minute, recherche de renforts, diagnostic capacité/charge,
// explication des plans et test de robustesse. Aucune dépendance externe.

export const ENGINE_VERSION = '3.1.0';
export const MODEL_VERSION = 3;

const clone = (x) => JSON.parse(JSON.stringify(x));
const isInt = (x, min, max) => Number.isInteger(x) && x >= min && x <= max;
const EPS = 1e-9;

export const unitLabel = (stage) => (stage.unitName?.trim() || (stage.unit === 'line' ? 'lignes' : 'commandes'));
export const rateLabel = (stage) => `${unitLabel(stage)}/h`;

export function clock(startHour, minute) {
  const total = startHour * 60 + Math.round(minute);
  const h = Math.floor(total / 60) % 24;
  const m = ((total % 60) + 60) % 60;
  return `${String(h).padStart(2, '0')}:${String(m).padStart(2, '0')}`;
}

// ---------------------------------------------------------------------------
// Exemples
// ---------------------------------------------------------------------------

function hash01(str) {
  let h = 2166136261;
  for (let i = 0; i < str.length; i++) { h ^= str.charCodeAt(i); h = Math.imul(h, 16777619); }
  return ((h >>> 0) % 10000) / 10000;
}

export const PRESETS = {
  normal: 'Journée normale',

export function megaModel(scale = 1.6) {

export function createModel(preset = 'absence') {

    { id: 'picking', name: 'Préparation', unit: 'line', rate: 112, maxWorkers: 8, maxRate: 0, after: [] },

  ];
  if (flows) {
    stages.push({ id: 'reception', name: 'Réception', unit: 'line', rate: 90, maxWorkers: 3, maxRate: 0, after: [] });
    stages.push({ id: 'putaway', name: 'Rangement', unit: 'line', rate: 60, maxWorkers: 4, maxRate: 0, after: ['reception'] });
  }

  const extra = { 1: ['packing'], 3: ['packing'], 4: ['dispatch'], 6: ['picking'], 8: ['picking'], 10: ['packing'], 11: ['packing'] };
  if (flows) {
    plan.push('reception', 'putaway', 'putaway');

  }
  const workers = plan.map((stage, i) => {
    const id = `P${String(i + 1).padStart(2, '0')}`;

    const rates = {};
    for (const st of stages) {
      if (!skills.includes(st.id)) continue;
      // Poste principal : 0,92 à 1,12 × la référence. Poste secondaire : 0,78 à 0,92 ×.
      const f = st.id === stage ? 0.92 + 0.2 * hash01(id + st.id) : 0.78 + 0.14 * hash01(id + st.id);
      rates[st.id] = Math.round(st.rate * f * 10) / 10;

  if (preset === 'machine') events.push({ type: 'machine', stage: 'packing', at: 90, duration: 30 });
  const clientRoute = flows ? ['picking', 'packing', 'dispatch'] : null;
  const batches = [0, 1, 2].map((i) => ({ id: `V${i + 1}`, name: flows ? `Clients ${i + 1}` : `Vague ${i + 1}`, count: 150, arrival: i * 60, spread: 20, deadline: i * 60 + 80, route: clientRoute }));
  if (flows) batches.push({ id: 'F1', name: 'Livraisons fournisseurs', count: 60, arrival: 30, spread: 90, deadline: 225, route: ['reception', 'putaway'] });
  return {
    version: MODEL_VERSION,
    name: PRESETS[preset] ?? 'Mon entrepôt',
    stages,

    batches,

    manualMoves: [],
    settings: {

      priority: 'deadline', lineProfile: 'benchmark', linesPerOrder: 3, seed: 15102026,
      decisionMinute: null, maxMoves: 3, maxEvaluations: 300,

// Accepte un modèle v2 (ancienne application) ou v3.
export function normalizeModel(raw) {
  if (!raw || typeof raw !== 'object') throw new Error('Fichier de configuration illisible.');
  const src = raw.model && raw.format ? raw.model : raw;
  const m = clone(src);
  if (m.version === 2) {
    const st = m.settings ?? {};
    m.events = [];
    if (st.event === 'absence') m.events.push({ type: 'absence', workerId: st.absentWorker, at: st.eventMinute, until: null });
    if (st.event === 'peak') m.events.push({ type: 'peak', at: st.eventMinute, count: st.peakCount, spread: 0, deadline: st.peakDeadline });
    if (st.event === 'machine') m.events.push({ type: 'machine', stage: st.machineStage, at: st.eventMinute, duration: st.machineDuration });
    for (const w of m.workers ?? []) {
      w.breaks = w.breakDuration > 0 ? [{ start: w.breakStart, duration: w.breakDuration }] : [];
      delete w.breakStart; delete w.breakDuration;
    }
    m.settings = {
      horizon: st.horizon, startHour: st.startHour, transitionMinutes: st.transitionMinutes, transferMinutes: st.transferMinutes,
      priority: st.priority, lineProfile: st.lineProfile, linesPerOrder: st.linesPerOrder, seed: st.seed,
      decisionMinute: Number.isInteger(st.decisionMinute) ? st.decisionMinute : null,
      maxMoves: Math.min(3, st.maxMoves ?? 3), maxEvaluations: 300,
    };
    for (const b of m.batches ?? []) b.name ??= b.id;
    m.version = MODEL_VERSION;
  }
  if (m.version !== MODEL_VERSION) throw new Error('Version de configuration non prise en charge.');
  m.events ??= [];
  m.manualMoves ??= [];
  for (const w of m.workers ?? []) { w.contract ??= 'interne'; }
  // Anciennes configurations : postes successifs, toutes les commandes passent partout.
  (m.stages ?? []).forEach((st, i) => { if (!Array.isArray(st.after)) st.after = i ? [m.stages[i - 1].id] : []; });
  for (const b of m.batches ?? []) if (b.route === undefined) b.route = null;
  for (const e of m.events) if (e.type === 'peak' && e.route === undefined) e.route = null;
  return m;
}

// Retourne un cycle (liste d’identifiants) ou null.
export function findCycle(stages) {
  const ids = new Set(stages.map((s) => s.id));
  const after = new Map(stages.map((s) => [s.id, (s.after ?? []).filter((x) => ids.has(x))]));
  const state = new Map(); const stack = [];
  const visit = (id) => {
    state.set(id, 1); stack.push(id);
    for (const p of after.get(id)) {
      if (state.get(p) === 1) return [...stack.slice(stack.indexOf(p)), p];
      if (!state.get(p)) { const c = visit(p); if (c) return c; }
    }
    state.set(id, 2); stack.pop(); return null;
  };
  for (const s of stages) if (!state.get(s.id)) { const c = visit(s.id); if (c) return c; }
  return null;
}

// Profondeur de chaque poste (plus long chemin depuis un poste de départ), pour l’affichage.
export function stageDepths(stages) {
  const by = new Map(stages.map((s) => [s.id, s]));
  const memo = new Map();
  const depth = (id, seen = new Set()) => {
    if (memo.has(id)) return memo.get(id);
    if (seen.has(id)) return 0;
    seen.add(id);
    const preds = (by.get(id)?.after ?? []).filter((x) => by.has(x));
    const d = preds.length ? 1 + Math.max(...preds.map((p) => depth(p, seen))) : 0;
    memo.set(id, d); return d;
  };
  return Object.fromEntries(stages.map((s) => [s.id, depth(s.id)]));
}

// Pour un parcours (sous-ensemble de postes), prédécesseurs et successeurs directs dans ce parcours.
// Un poste hors parcours est « traversé » : ses propres prédécesseurs comptent à sa place.
export function routeInfo(stages, route) {
  const idx = new Map(stages.map((s, i) => [s.id, i]));
  const inRoute = new Set((route && route.length ? route : stages.map((s) => s.id)).filter((id) => idx.has(id)));
  const by = new Map(stages.map((s) => [s.id, s]));
  const prereqs = new Map(); const succs = new Map();
  for (const id of inRoute) { prereqs.set(idx.get(id), []); succs.set(idx.get(id), []); }
  for (const id of inRoute) {
    const found = new Set(); const seen = new Set();
    const walk = (x) => { for (const p of by.get(x).after ?? []) { if (!by.has(p) || seen.has(p)) continue; seen.add(p); if (inRoute.has(p)) found.add(p); else walk(p); } };
    walk(id);
    for (const p of found) { prereqs.get(idx.get(id)).push(idx.get(p)); succs.get(idx.get(p)).push(idx.get(id)); }
  }
  const list = [...inRoute].map((id) => idx.get(id));
  // Nombre d’étapes restantes après chaque poste (pour laisser du temps aux postes suivants).
  const down = new Map();
  const depthDown = (i) => { if (down.has(i)) return down.get(i); const n = succs.get(i).length ? 1 + Math.max(...succs.get(i).map(depthDown)) : 0; down.set(i, n); return n; };
  list.forEach(depthDown);
  return { stages: list, prereqs, succs, roots: list.filter((i) => !prereqs.get(i).length), down };
}

const LINE_DISTRIBUTION = [...Array(100).fill(2), ...Array(50).fill(3), ...Array(20).fill(4), ...Array(5).fill(5), ...Array(2).fill(6)];

export function scenarioFromModel(model) {
  const m = clone(model);
  const st = m.settings;
  let seed = st.seed >>> 0;
  const rand = () => { seed = (1664525 * seed + 1013904223) >>> 0; return seed / 4294967296; };
  const lines = () => (st.lineProfile === 'fixed' ? st.linesPerOrder : LINE_DISTRIBUTION[Math.floor(rand() * LINE_DISTRIBUTION.length)]);
  const orders = [];
  for (const b of m.batches ?? []) {
    for (let i = 0; i < b.count; i++) orders.push({ id: `${b.id}-${i + 1}`, batch: b.id, route: b.route ?? null, lines: lines(), arrival: b.arrival + Math.floor(rand() * Math.max(1, b.spread)), deadline: b.deadline });
  }
  m.events.forEach((e, k) => {
    if (e.type !== 'peak') return;
    for (let i = 0; i < e.count; i++) orders.push({ id: `PIC${k + 1}-${i + 1}`, batch: `PIC${k + 1}`, route: e.route ?? null, lines: lines(), arrival: e.at + Math.floor(rand() * Math.max(1, e.spread ?? 0)), deadline: e.deadline });
  });
  return {
    version: MODEL_VERSION, engine: ENGINE_VERSION, name: m.name,
    stages: m.stages, workers: m.workers, orders, events: m.events,
    horizon: st.horizon, startHour: st.startHour, transitionMinutes: st.transitionMinutes, transferMinutes: st.transferMinutes,
    priority: st.priority, decisionMinute: st.decisionMinute, maxMoves: st.maxMoves, maxEvaluations: st.maxEvaluations, seed: st.seed,
  };
}
