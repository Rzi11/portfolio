  return `
  ${pageHead('Étape 1 · Entrepôt', 'Comment le travail circule entre tes postes ?', 'Pour chaque poste, indique les postes qui doivent être finis avant qu’il puisse commencer. Tu peux faire des flux en ligne, des branches en parallèle qui se rejoignent, ou des flux séparés (clients, fournisseurs…).', `<button class="btn primary" data-action="stage-add" ${m.stages.length >= 30 ? 'disabled' : ''}>+ Ajouter un poste</button>`)}
  ${issuesBox((x) => x.field.startsWith('stage'))}
  <section class="panel strong">
    <div class="panel-head"><h2>Ton flux</h2><span class="small muted">Se met à jour quand tu modifies les postes ci-dessous</span></div>
    ${cycle ? '<div class="notice bad">Il y a une boucle : un poste attend un poste qui l’attend lui-même. Retire une des dépendances.</div>' : flowGraph(m.stages, { tags })}
  </section>
  ${cards}
  <div class="notice small">Changer la cadence type d’un poste ajuste en proportion la cadence de chaque personne sur ce poste. Les cadences individuelles restent modifiables dans « Équipe ». Le plafond machine limite le débit du poste quel que soit le nombre de personnes (0 = pas de limite).</div>
  <section class="panel">
    <div class="panel-head"><h2>Horaires et délais</h2></div>

      <div class="field"><label for="set-start">Début de la période</label><select id="set-start" data-kind="int" data-path="settings.startHour">${hours}</select></div>
      <div class="field"><label for="set-end">Fin de la période</label><input id="set-end" type="time" data-kind="horizon" value="${T(st.horizon)}"></div>
      <div class="field"><label for="set-trans">Changement de poste (min)</label><input id="set-trans" type="number" min="0" max="60" data-kind="int" data-path="settings.transitionMinutes" value="${st.transitionMinutes}"><p class="hint">Temps perdu pour aller d’un poste à l’autre.</p></div>
      <div class="field"><label for="set-transfer">Délai entre deux postes (min)</label><input id="set-transfer" type="number" min="0" max="60" data-kind="int" data-path="settings.transferMinutes" value="${st.transferMinutes}"><p class="hint">Temps pour qu’une commande arrive au poste suivant.</p></div>
    </div>
  </section>`;
}

    }).join('')}${state.skillMenu === i ? `<select id="sk-add-${i}" data-action-change="skill-add" data-w="${i}" aria-label="Ajouter une compétence à ${esc(w.name)}"><option value="">Choisir un poste…</option>${m.stages.filter((x) => !w.skills.includes(x.id)).map((x) => `<option value="${esc(x.id)}">${esc(x.name)}</option>`).join('')}</select>` : `<button class="btn small ghost" data-action="skill-menu" data-arg="${i}" aria-label="Ajouter une compétence à ${esc(w.name)}">+ poste</button>`}</div></td>` : m.stages.map((st) => {

      return `<td><div class="skill">

        <input type="number" id="rt-${i}-${esc(st.id)}" min="1" step="1" data-kind="num" data-path="workers.${i}.rates.${esc(st.id)}" value="${has ? Math.round(w.rates[st.id] ?? st.rate) : ''}" ${has ? '' : 'disabled'} aria-label="Cadence de ${esc(w.name)} en ${esc(st.name)}">

      <td class="name"><input id="w-name-${i}" data-path="workers.${i}.name" value="${esc(w.name)}" aria-label="Nom"><div class="row" style="gap:4px;margin-top:4px">${missionBadge(w, m.date)}</div></td>
      <td class="contract"><select id="w-contract-${i}" data-path="workers.${i}.contract" aria-label="Contrat de ${esc(w.name)}"><option value="interne" ${!isInterim(w) ? 'selected' : ''}>Interne</option><option value="interim" ${isInterim(w) ? 'selected' : ''}>Intérim</option></select>
        ${isInterim(w) ? `<input id="w-agency-${i}" data-path="workers.${i}.agency" value="${esc(w.agency ?? '')}" placeholder="Agence" aria-label="Agence d’intérim" style="margin-top:4px"><label for="w-end-mission-${i}" class="small" style="margin:4px 0 0">Fin de mission</label><input id="w-end-mission-${i}" type="date" data-kind="date" data-path="workers.${i}.missionEnd" value="${esc(w.missionEnd ?? '')}">` : ''}</td>

      <td><input id="w-end-${i}" type="time" data-kind="time" data-path="workers.${i}.end" value="${T(w.end)}" aria-label="Départ"></td>

  <section class="panel">
    <div class="panel-head"><h2>${m.workers.length} personnes${m.workers.some(isInterim) ? ` <span class="muted" style="font-weight:600;font-size:16px">dont ${m.workers.filter(isInterim).length} intérimaires</span>` : ''}</h2>

      <tbody>${rows}</tbody>

function dayStrip() {
  const m = state.model; const H = m.settings.horizon;
  const pct = (x) => (100 * Math.max(0, Math.min(H, x))) / H;
  const colorOf = (route) => { const first = route?.[0] ?? m.stages.find((s) => !(s.after ?? []).length)?.id; return stageColor(Math.max(0, m.stages.findIndex((s) => s.id === first))); };
  const lanes = [
    ...m.batches.map((b) => ({ name: b.name, count: b.count, arrival: b.arrival, spread: b.spread, deadline: b.deadline, route: b.route })),
    ...m.events.filter((e) => e.type === 'peak').map((e) => ({ name: 'Pic imprévu', count: e.count, arrival: e.at, spread: e.spread ?? 0, deadline: e.deadline, route: e.route, peak: true })),
  ];
  const rows = lanes.map((l) => {
    const a = pct(l.arrival), e = pct(l.arrival + Math.max(l.spread, 2)), d = pct(l.deadline);
    const via = l.route ? l.route.map(stageName).join(' → ') : 'tous les postes';
    return `<div class="d-row"><div class="d-name"><b>${esc(l.name)}</b><small title="${esc(via)}">${fmtN(l.count)} commandes · ${esc(via)}</small></div>
      <div class="d-track">
        <div class="d-arrive" style="left:${a}%;width:${Math.max(e - a, 0.6)}%;background:${colorOf(l.route)}" title="Arrivée de ${T(l.arrival)} à ${T(l.arrival + l.spread)}"></div>
        <div class="d-work" style="left:${e}%;width:${Math.max(d - e, 0)}%;border-color:${colorOf(l.route)}" title="À traiter jusqu’à ${T(l.deadline)}"></div>
        <div class="d-due" style="left:${d}%"><span>${T(l.deadline)}</span></div>
      </div></div>`;
  }).join('');
  const evs = m.events.filter((e) => e.type !== 'peak').map((e) => {
    const label = e.type === 'absence' ? `Absence ${workerName(e.workerId)}` : `Panne ${stageName(e.stage)}`;
    return `<div class="d-ev" style="left:${pct(e.at)}%"><span>${esc(label)} · ${T(e.at)}</span></div>`;
  }).join('');
  const ticks = []; for (let t = 0; t <= H; t += 60) ticks.push(`<span class="tick" style="left:${pct(t)}%;${t === 0 ? 'transform:none' : H - t < 30 ? 'transform:translateX(-100%)' : ''}">${T(t)}</span>`);
  return `<div class="scroll-x"><div class="dayplan" role="img" aria-label="Arrivées des vagues de commandes, heures limites et imprévus">
    <div class="d-row d-axis"><div></div><div class="d-track ticks">${ticks.join('')}</div></div>
    ${rows}
    ${evs ? `<div class="d-row"><div class="d-name"><b>Imprévus</b></div><div class="d-track">${evs}</div></div>` : ''}
  </div></div>
  <div class="legend"><span><i style="background:var(--s1)"></i>Les commandes arrivent</span><span><i style="background:transparent;border:2px dashed var(--s1)"></i>À traiter</span><span><i style="background:var(--ink);width:3px"></i>Heure limite</span><span><i style="background:var(--bad);width:3px"></i>Imprévu</span></div>`;
}

function dayView() {
  const m = state.model; const st = m.settings;
  const total = m.batches.reduce((n, b) => n + b.count, 0) + m.events.filter((e) => e.type === 'peak').reduce((n, e) => n + e.count, 0);
  const waves = m.batches.map((b, i) => `<tr>
    <td><input id="b-name-${i}" data-path="batches.${i}.name" value="${esc(b.name)}" aria-label="Nom de la vague"></td>
    <td><input id="b-count-${i}" type="number" min="0" max="15000" data-kind="int" data-path="batches.${i}.count" value="${b.count}" aria-label="Nombre de commandes" style="width:90px"></td>
    <td><input id="b-arr-${i}" type="time" data-kind="time" data-path="batches.${i}.arrival" value="${T(b.arrival)}" aria-label="Arrivée"></td>
    <td><input id="b-spread-${i}" type="number" min="0" max="480" data-kind="int" data-path="batches.${i}.spread" value="${b.spread}" aria-label="Étalement en minutes" style="width:80px"></td>
    <td><input id="b-due-${i}" type="time" data-kind="time" data-path="batches.${i}.deadline" value="${T(b.deadline)}" aria-label="Échéance"></td>
    <td><button class="btn small danger" data-action="batch-delete" data-arg="${i}" ${m.batches.length < 2 ? 'disabled' : ''}>Retirer</button></td></tr>
    <tr><td colspan="6" style="padding-top:0">${routeSummaryHTML(`batches.${i}`, b.route)}</td></tr>`).join('');
  const workerOpts = (sel) => m.workers.map((w) => `<option value="${esc(w.id)}" ${w.id === sel ? 'selected' : ''}>${esc(w.name)}</option>`).join('');
  const stageOpts = (sel) => m.stages.map((s) => `<option value="${esc(s.id)}" ${s.id === sel ? 'selected' : ''}>${esc(s.name)}</option>`).join('');
  const events = m.events.map((e, i) => {
    const common = `<div class="field"><label for="e-at-${i}">À partir de</label><input id="e-at-${i}" type="time" data-kind="time" data-path="events.${i}.at" value="${T(e.at)}"></div>`;
    let body = '';
    if (e.type === 'absence') body = `<div class="type"><span class="swatch" style="background:var(--bad)"></span>Absence</div>
      <div class="field"><label for="e-w-${i}">Personne</label><select id="e-w-${i}" data-path="events.${i}.workerId">${workerOptionsByStage(e.workerId)}</select></div>${common}
      <div class="field"><label for="e-until-${i}">Retour (vide = pas de retour)</label><input id="e-until-${i}" type="time" data-kind="nullable-time" data-path="events.${i}.until" value="${e.until == null ? '' : T(e.until)}"></div>`;
    if (e.type === 'peak') body = `<div class="type"><span class="swatch" style="background:var(--s2)"></span>Pic de commandes</div>${common}
      <div class="field"><label for="e-c-${i}">Commandes en plus</label><input id="e-c-${i}" type="number" min="1" data-kind="int" data-path="events.${i}.count" value="${e.count}"></div>
      <div class="field"><label for="e-sp-${i}">Étalées sur (min)</label><input id="e-sp-${i}" type="number" min="0" data-kind="int" data-path="events.${i}.spread" value="${e.spread ?? 0}"></div>
      <div class="field"><label for="e-d-${i}">Échéance</label><input id="e-d-${i}" type="time" data-kind="time" data-path="events.${i}.deadline" value="${T(e.deadline)}"></div>
      <div style="grid-column:1/-1">${routeSummaryHTML(`events.${i}`, e.route)}</div>`;
    if (e.type === 'machine') body = `<div class="type"><span class="swatch" style="background:var(--warn)"></span>Panne / arrêt de poste</div>
      <div class="field"><label for="e-s-${i}">Poste arrêté</label><select id="e-s-${i}" data-path="events.${i}.stage">${stageOpts(e.stage)}</select></div>${common}
      <div class="field"><label for="e-du-${i}">Durée (min)</label><input id="e-du-${i}" type="number" min="1" data-kind="int" data-path="events.${i}.duration" value="${e.duration}"></div>`;
    return `<div class="event-row">${body}<div><button class="btn small danger" data-action="event-delete" data-arg="${i}">Retirer</button></div></div>`;
  }).join('');
  return `
  ${pageHead('Étape 3 · Journée', 'Quel travail arrive, et pour quand ?', `${fmtN(total)} commandes au total. Une <b>vague</b> est un lot de commandes qui arrive ensemble et doit être fini avant une heure limite. Ajoute aussi les imprévus à tester.`, '<button class="btn" data-action="assist-open" data-arg="day">Remplir par la voix ou une photo</button>')}
  ${issuesBox((x) => ['batches', 'events'].includes(x.field))}
  ${storyHTML()}
  <section class="panel">
    <div class="fields" style="grid-template-columns:minmax(0,420px)"><div class="field"><label for="day-name">Nom de cette journée</label><input id="day-name" data-path="name" value="${esc(m.name)}"></div></div>
    ${dayStrip()}
  </section>
  <div class="grid-2" style="grid-template-columns:minmax(0,1fr)">
    <section class="panel">
      <div class="panel-head"><h2>${m.batches.length} vague${m.batches.length > 1 ? 's' : ''} de commandes <span class="muted" style="font-weight:600;font-size:16px">· ${fmtN(m.batches.reduce((n, b) => n + b.count, 0))} commandes</span></h2><button class="btn small" data-action="batch-add">+ Ajouter une vague</button></div>
      <div class="scroll-x"><table><thead><tr><th>Nom</th><th>Commandes</th><th>Arrivée</th><th>Étalement (min)</th><th>À finir avant</th><th></th></tr></thead><tbody>${waves}</tbody></table></div>
      <div class="fields" style="grid-template-columns:repeat(auto-fill,minmax(240px,1fr))">
        <div class="field"><label for="set-profile">Taille des commandes</label><select id="set-profile" data-path="settings.lineProfile"><option value="benchmark" ${st.lineProfile === 'benchmark' ? 'selected' : ''}>Variable (2 à 6 lignes)</option><option value="fixed" ${st.lineProfile === 'fixed' ? 'selected' : ''}>Fixe</option></select></div>
        ${st.lineProfile === 'fixed' ? `<div class="field"><label for="set-lines">Lignes par commande</label><input id="set-lines" type="number" min="1" max="100" data-kind="int" data-path="settings.linesPerOrder" value="${st.linesPerOrder}"></div>` : ''}
        <div class="field"><label for="set-prio">Ordre de traitement</label><select id="set-prio" data-path="settings.priority"><option value="deadline" ${st.priority === 'deadline' ? 'selected' : ''}>Échéance la plus proche</option><option value="fifo" ${st.priority === 'fifo' ? 'selected' : ''}>Premier arrivé</option></select></div>
      </div>
      <p class="hint">Taille variable : 2 lignes le plus souvent, parfois jusqu’à 6, selon une répartition inspirée d’un jeu de données public de Zalando.</p>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>${m.events.length ? `${m.events.length} imprévu${m.events.length > 1 ? 's' : ''}` : 'Imprévus'}</h2><div class="row"><button class="btn small" data-action="event-add" data-arg="absence">+ Absence</button><button class="btn small" data-action="event-add" data-arg="peak">+ Pic</button><button class="btn small" data-action="event-add" data-arg="machine">+ Panne</button></div></div>
      ${events || '<p class="muted">Aucun imprévu : tu simules une journée normale. Ajoute une absence, un pic ou une panne pour voir son effet.</p>'}
      <p class="hint">Les imprévus se cumulent. L’outil cherche des renforts à l’heure de chaque imprévu.</p>
    </section>
  </div>`;
}

function storyHTML() {
  const st = state.model.story;
  if (!Array.isArray(st) || !st.length) return '';
  return `<details class="panel story" open><summary>Le scénario de cet exemple</summary><ul>${st.map((x) => `<li>${esc(x)}</li>`).join('')}</ul></details>`;
}

// Écrans de résultats : diagnostic, plans, planning visuel

function loadClass(c) {
  if (c.stopped) return 'stop';
  if (!Number.isFinite(c.load)) return c.critical ? 'l3' : 'l2';
  if (c.load <= 0.001 && c.people < 0.01) return c.critical ? 'l2' : 'l0';
  if (c.critical) return c.load > 0.9 ? 'l3' : 'l2';
  if (c.load >= 0.9) return 'l2';
  return 'l1';
}

function diagnosticView() {
  const issues = currentIssues();
  if (issues.length) {
    return `${pageHead('Étape 4 · Diagnostic', 'Il manque des informations', 'Corrige les points ci-dessous pour lancer le diagnostic.')}${issuesBox(() => true)}`;
  }
  const s = scenario();
  const d = diagnose(s);
  const ex = explainDiagnosis(s, d);
  const cols = d.cells[0].length;
  const tags = {}; const hot = new Set();
  s.stages.forEach((st, i) => {
    const peak = Math.max(...d.cells[i].map((c) => c.load));
    const stopped = d.cells[i].some((c) => c.stopped);
    if (d.alerts.some((a) => a.stage === st.id)) hot.add(st.id);
    tags[st.id] = `${s.workers.filter((w) => w.stage === st.id).length} pers. · ${Number.isFinite(peak) ? `${fmtN(peak * 100)} %` : stopped ? 'arrêt' : 'plus personne'}`;
  });
  const header = `<div></div>${d.cells[0].map((c) => `<div class="h-time">${T(c.start)}</div>`).join('')}`;
  const rows = s.stages.map((st, i) => `<div class="h-label"><span class="swatch" style="background:${stageColor(i)}"></span>${esc(st.name)}</div>${d.cells[i].map((c) => `<div class="cell ${loadClass(c)}" title="${esc(st.name)} ${T(c.start)}–${T(c.end)} : charge ≈ ${fmtN(c.demandPerHour)} ${rateLabel(st)}, capacité ${fmtN(c.capacityPerHour)} ${rateLabel(st)}, ${fmtN(c.people, 1)} pers.">${c.stopped ? 'arrêt' : !Number.isFinite(c.load) ? 'personne' : c.people < 0.01 && c.load < 0.001 ? '·' : `${fmtN(c.load * 100)}%`}</div>`).join('')}`).join('');
  const coverage = d.coverage.map((c, i) => {
    const r = d.reinforcements[i].candidates;
    return `<tr><td><span class="row" style="gap:8px;flex-wrap:nowrap"><span class="swatch" style="background:${stageColor(i)}"></span>${esc(c.stageName)}</span></td><td class="num">${c.assigned}</td><td class="num">${c.skilled}</td><td>${r.length ? r.map((id) => { const w = s.workers.find((x) => x.id === id); return `${esc(w.name)}${isInterim(w) ? ' <span class="chip interim">int.</span>' : ''}`; }).join(', ') : '<span class="muted">aucun</span>'}</td></tr>`;
  }).join('');
  const peopleCount = s.workers.length;
  const verdict = d.alerts.length ? 'bad' : 'ok';
  return `
  ${pageHead('Étape 4 · Diagnostic', esc(ex.headline), '', `<button class="btn primary" data-action="go" data-arg="plans">${d.alerts.length ? 'Trouver des renforts →' : 'Voir les plans →'}</button>`)}
  <div class="row">
    <span class="chip">${fmtN(s.orders.length)} commandes</span>
    <span class="chip">${fmtN(d.due)} à finir dans la période</span>
    <span class="chip">${peopleCount} personnes</span>
    <span class="chip">${s.events.length ? `${s.events.length} imprévu${s.events.length > 1 ? 's' : ''}` : 'aucun imprévu'}</span>
    <span class="chip ${verdict === 'ok' ? '' : 'assumed'}">Cadences ${esc(state.model.settings.ratesSource ?? 'estimées')}</span>
  </div>
  ${ex.lines.length ? `<div class="notice ${verdict === 'ok' ? 'ok' : 'warn'}">${ex.lines.map(esc).join('<br>')}</div>` : ''}
  ${forecastBanner()}
  ${storyHTML()}
  <section class="panel strong">
    <div class="panel-head"><h2>Le flux</h2><span class="small muted">Pourcentage le plus élevé de la journée, avec l’équipe prévue</span></div>
    ${flowGraph(s.stages, { tags, hot })}
  </section>
  <section class="panel">
    <div class="panel-head"><h2>Charge par poste et par créneau</h2><div class="legend"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Ça passe</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>Tendu, rattrapable avant ou après</span><span><i style="background:var(--bad)"></i>Pas assez de monde : retards</span></div></div>
    <div class="scroll-x"><div class="heat" style="grid-template-columns:150px repeat(${cols},minmax(52px,1fr))">${header}${rows}</div></div>
    <p class="hint">Chaque case compare le travail du créneau (réparti entre l’arrivée des commandes et leur heure limite) à ce que les personnes présentes peuvent produire, pauses, absences et pannes comprises. En rouge : la période où, même en avançant ou en décalant le travail, la capacité ne suffit pas à tenir les heures limites. Survole une case pour le détail.</p>
  </section>
  <section class="panel">
    <div class="panel-head"><h2>Qui peut aider où ?</h2></div>
    <div class="scroll-x"><table><thead><tr><th>Poste</th><th class="num">Au départ</th><th class="num">Formées</th><th>Renforts possibles</th></tr></thead><tbody>${coverage}</tbody></table></div>
  </section>`;
}

// ---------- Plans ----------
async function runAnalysis() {
  if (state.busy) return;
  const s = scenario();
  if (validateScenario(s).length) return;
  const v = state.version;
  state.busy = 'Recherche des renforts…';
  render();
  let res;
  try {
    const t0 = Date.now();
    res = await recommendAsync(s, (n) => { state.busy = `${n} plans simulés minute par minute · ${((Date.now() - t0) / 1000).toFixed(1).replace('.', ',')} s`; const el = document.getElementById('busy'); if (el) el.textContent = state.busy; });
  } catch (e) { state.busy = null; toast(e.message); render(); return; }
  state.busy = null;
  if (v !== state.version) { runAnalysis(); return; }
  state.analysis = { version: v, result: res, robust: new Map() };
  const ids = res.plans.map((p) => p.id);
  if (!(ids.includes(state.selected) || state.selected === 'mine')) state.selected = ids[ids.length - 1];
  render();
}

function mineResult(s) {
  const moves = state.model.manualMoves ?? [];
  const issues = buildSchedule(s, moves).issues;
  if (issues.length) return { issues, result: null };
  return { issues: [], result: simulate(s, moves) };
}

function selectedPlan(s) {
  const A = state.analysis.result;
  if (state.selected === 'mine') { const m = mineResult(s); return { id: 'mine', name: 'Mon plan', result: m.result, issues: m.issues }; }
  if (state.selected.startsWith('c:')) { const i = +state.selected.slice(2); return { id: state.selected, name: `Plan exploré n° ${i}`, result: A.candidates[i] }; }
  return A.plans.find((p) => p.id === state.selected) ?? A.plans[A.plans.length - 1];
}

function planCard(id, name, r, base, note) {
  const pressed = state.selected === id;
  const delta = r && base && r !== base ? r.late - base.late : 0;
  return `<button class="plan ${id === 'mine' ? 'mine' : ''}" data-action="select-plan" data-arg="${id}" aria-pressed="${pressed}">
    <span class="kind">${esc(name)}</span>
    <span class="big">${r ? fmtN(r.late) : '—'}</span>
    <span class="small muted">${r ? `commande${r.late > 1 ? 's' : ''} en retard${delta < 0 ? ` · ${fmtN(delta)}` : ''}` : 'plan à corriger'}</span>
    <span class="what">${note}</span>
  </button>`;
}

function robustFor(s, plan) {
  if (!plan.result?.moves.length) return null;
  const key = JSON.stringify(plan.result.moves);
  const cache = state.analysis.robust;
  if (!cache.has(key)) cache.set(key, robustness(s, plan.result.moves));
  return cache.get(key);
}

function ganttHTML(s, moves, editable) {
  const { grid } = buildSchedule(s, []);
  const sched = buildSchedule(s, moves).grid;
  const H = s.horizon;
  const pct = (x) => (100 * x) / H;
  const ticks = []; for (let t = 0; t <= H; t += 60) ticks.push(`<span class="tick" style="left:${pct(t)}%;${t === 0 ? 'transform:none' : H - t < 30 ? 'transform:translateX(-100%)' : ''}">${T(t)}</span>`);
  const events = s.events.filter((e) => e.type !== 'peak').map((e) => `<div class="g-now" style="left:${pct(e.at)}%" title="Imprévu à ${T(e.at)}"></div>`).join('');
  const rows = s.workers.filter((w) => ganttKeep(w, moves)).map((w) => {
    const row = sched.get(w.id); const home = grid.get(w.id);
    const segs = []; let t = 0;
    while (t < H) {
      const code = row[t]; let u = t; while (u < H && row[u] === code) u++;
      if (code !== OFF) {
        const left = pct(t), width = pct(u - t);
        const label = code >= 0 ? s.stages[code].name : code === TRANSITION ? '' : code === BREAK ? 'pause' : 'absente';
        const moved = code >= 0 && home[t] !== code && home[t] >= 0;
        const cls = code >= 0 ? `g-seg${moved ? ' moved' : ''}` : code === TRANSITION ? 'g-seg trans' : code === BREAK ? 'g-seg brk' : 'g-seg abs';
        const style = `left:${left}%;width:${width}%;${code >= 0 ? `background:${stageColor(code)}` : ''}`;
        segs.push(`<div class="${cls}" style="${style}" title="${esc(w.name)} · ${esc(label || 'trajet')} · ${T(t)}–${T(u)}">${width > 9 ? esc(label) : ''}</div>`);
      }
      t = u;
    }
    const sel = state.editing && state.editing.workerId === w.id ? `<div class="g-sel" style="left:${pct(state.editing.from)}%;width:${pct(state.editing.to - state.editing.from)}%"></div>` : '';
    return `<div class="g-row"><div class="g-name ${isInterim(w) ? 'interim' : ''}">${esc(w.name)}<small>${esc(stageName(w.stage))}${isInterim(w) ? ' · intérim' : ''}${w.locked ? ' · fixe' : ''}</small></div><div class="g-track ${editable && !w.locked ? 'editable' : ''}" data-worker="${esc(w.id)}">${segs.join('')}${sel}${events}</div></div>`;
  }).join('');
  return `<div class="scroll-x"><div class="gantt" id="gantt"><div class="g-axis"><div></div><div class="ticks">${ticks.join('')}</div></div>${rows}</div></div>
  <div class="legend">${s.stages.map((st, i) => `<span><i style="background:${stageColor(i)}"></i>${esc(st.name)}</span>`).join('')}<span><i style="background:repeating-linear-gradient(-45deg,var(--accent) 0 3px,var(--ink) 3px 6px)"></i>Trajet</span><span><i style="background:var(--hatch)"></i>Pause</span><span><i style="background:var(--bad);width:3px"></i>Imprévu</span><span><i style="background:var(--surface);box-shadow:inset 0 0 0 2px var(--ink)"></i>Renfort</span></div>`;
}

// ---------- Graphiques (courbes dans le temps, avec survol) ----------
const chartData = new Map();
let chartSeq = 0;

// series : [{ name, color, points:[[minute, valeur]], dashed?, step?, width? }]
// band : { over: index série haute, under: index série basse } → zone colorée là où « over » dépasse « under »
function timeChart({ title, subtitle = '', series, H, height = 200, unit = '', band = null, small = false }) {
  const id = `ch${++chartSeq}`;
  const W = small ? 360 : 1000, Hh = height, pl = 40, pr = small ? 12 : 16, pt = 12, pb = 26;
  const maxY = Math.max(1, ...series.flatMap((s) => s.points.map((p) => p[1])));
  const step = maxY <= 10 ? 2 : maxY <= 50 ? 10 : maxY <= 200 ? 50 : maxY <= 600 ? 100 : 250;
  const top = Math.ceil(maxY / step) * step;
  const x = (m) => pl + ((W - pl - pr) * m) / H;
  const y = (v) => pt + (Hh - pt - pb) * (1 - v / top);
  const pathOf = (s) => s.points.map((p, i) => {
    if (!i) return `M${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`;
    return s.step ? `H${x(p[0]).toFixed(1)}V${y(p[1]).toFixed(1)}` : `L${x(p[0]).toFixed(1)},${y(p[1]).toFixed(1)}`;
  }).join('');
  const area = (s) => `${pathOf(s)}L${x(s.points[s.points.length - 1][0]).toFixed(1)},${y(0)}L${x(s.points[0][0]).toFixed(1)},${y(0)}Z`;
  const yTicks = []; for (let v = 0; v <= top; v += step) yTicks.push(v);
  const yAxis = yTicks.map((v) => `<line class="grid" x1="${pl}" x2="${W - pr}" y1="${y(v)}" y2="${y(v)}"/><text class="axis" x="${pl - 6}" y="${y(v) + 3.5}" text-anchor="end">${fmtN(v)}</text>`).join('');
  const xAxis = []; for (let t = 0; t <= H; t += 60) xAxis.push(`<text class="axis" x="${x(t)}" y="${Hh - 8}" text-anchor="${t === 0 ? 'start' : H - t < 30 ? 'end' : 'middle'}">${T(t)}</text>`);
  let bandSvg = '';
  if (band) {
    bandSvg = `<path d="${area(series[band.over])}" class="band"/><path d="${area(series[band.under])}" fill="var(--surface)"/>`;
  }
  const lines = series.map((s) => `<path d="${pathOf(s)}" fill="none" stroke="${s.color}" stroke-width="${s.width ?? 2}" ${s.dashed ? 'stroke-dasharray="5 4"' : ''} stroke-linejoin="round" stroke-linecap="round"/>`).join('');
  // Étiquettes directes en bout de courbe (grand format), écartées pour ne pas se chevaucher
  let ends = '';
  if (false) {
    const lab = series.map((s) => ({ s, yy: y(s.points[s.points.length - 1][1]) })).sort((a, b) => a.yy - b.yy);
    for (let i = 1; i < lab.length; i++) if (lab[i].yy - lab[i - 1].yy < 15) lab[i].yy = lab[i - 1].yy + 15;
    ends = lab.map((l) => `<circle cx="${x(H)}" cy="${y(l.s.points[l.s.points.length - 1][1])}" r="3.5" fill="${l.s.color}"/><text class="endlabel" x="${x(H) + 8}" y="${l.yy + 4}">${esc(l.s.name)}</text>`).join('');
  }
  chartData.set(id, { series, H, x0: pl, x1: W - pr, W, unit });
  const legend = series.map((s) => `<span><svg width="22" height="8" aria-hidden="true"><line x1="1" x2="21" y1="4" y2="4" stroke="${s.color}" stroke-width="${s.width ?? 2}" ${s.dashed ? 'stroke-dasharray="5 4"' : ''} stroke-linecap="round"/></svg>${esc(s.name)}</span>`).join('');
  return `<figure class="chart ${small ? 'small' : ''}" style="margin:0">
    <figcaption><b>${esc(title)}</b>${subtitle ? `<span class="muted">${subtitle}</span>` : ''}</figcaption>
    ${series.length > 1 ? `<div class="legend">${legend}</div>` : ''}
    <div class="chart-plot" data-chart="${id}">
      <svg viewBox="0 0 ${W} ${Hh}" role="img" aria-label="${esc(title)}">${bandSvg}${yAxis}${xAxis.join('')}${lines}${ends}<line class="cross" x1="0" x2="0" y1="${pt}" y2="${Hh - pb}" style="display:none"/></svg>
      <div class="tip" hidden></div>
    </div>
  </figure>`;
}

function valueAt(points, m, step) {
  let v = points[0][1];
  for (const p of points) { if (p[0] <= m) v = p[1]; else { if (!step && p !== points[0]) { const prev = points[points.indexOf(p) - 1]; return prev[1] + ((p[1] - prev[1]) * (m - prev[0])) / (p[0] - prev[0]); } break; } }
  return v;
}

document.addEventListener('pointermove', (ev) => {
  const plot = ev.target.closest?.('.chart-plot');
  document.querySelectorAll('.chart-plot.hover').forEach((p) => { if (p !== plot) { p.classList.remove('hover'); p.querySelector('.tip').hidden = true; p.querySelector('.cross').style.display = 'none'; } });
  if (!plot) return;
  const d = chartData.get(plot.dataset.chart); if (!d) return;
  const svg = plot.querySelector('svg'); const r = svg.getBoundingClientRect();
  const sx = ((ev.clientX - r.left) / r.width) * d.W;
  if (sx < d.x0 - 4 || sx > d.x1 + 4) { plot.querySelector('.tip').hidden = true; plot.querySelector('.cross').style.display = 'none'; return; }
  const m = Math.max(0, Math.min(d.H, Math.round((((sx - d.x0) / (d.x1 - d.x0)) * d.H) / 5) * 5));
  const cx = d.x0 + ((d.x1 - d.x0) * m) / d.H;
  const cross = plot.querySelector('.cross'); cross.setAttribute('x1', cx); cross.setAttribute('x2', cx); cross.style.display = '';
  const tip = plot.querySelector('.tip'); tip.hidden = false; plot.classList.add('hover');
  tip.replaceChildren();
  const h = document.createElement('div'); h.className = 'tip-time'; h.textContent = T(m); tip.appendChild(h);
  for (const s of d.series) {
    const row = document.createElement('div'); row.className = 'tip-row';
    const key = document.createElement('i'); key.style.background = s.color; row.appendChild(key);
    const v = document.createElement('b'); v.textContent = fmtN(valueAt(s.points, m, s.step)); row.appendChild(v);
    const n = document.createElement('span'); n.textContent = s.name; row.appendChild(n);
    tip.appendChild(row);
  }
  const px = ((cx / d.W) * r.width);
  tip.style.left = `${px > r.width * 0.6 ? px - tip.offsetWidth - 12 : px + 12}px`;
});

function plansView() {
  const issues = currentIssues();
  if (issues.length) return `${pageHead('Étape 5 · Plans', 'Il manque des informations', '')}${issuesBox(() => true)}`;
  const s = scenario();
  if (!state.analysis || state.analysis.version !== state.version) {
    if (!state.busy) queueMicrotask(runAnalysis);
    return `${pageHead('Étape 5 · Plans', 'Recherche des renforts', `L’outil simule la journée minute par minute (${s.workers.length} personnes, ${fmtN(s.orders.length)} commandes, ${s.stages.length} postes), puis essaie de déplacer les personnes polyvalentes là où ça coince.`)}
      <section class="panel"><p id="busy" class="mono">${esc(state.busy || 'Préparation…')}</p></section>`;
  }
  const A = state.analysis.result;
  const base = A.baseline;
  const sel = selectedPlan(s);
  const r = sel.result;
  const notes = { base: 'L’affectation prévue, sans aucun déplacement.', simple: describeMoves(s, (A.plans.find((p) => p.id === 'simple')?.result.moves) ?? []), best: describeMoves(s, (A.plans.find((p) => p.id === 'best')?.result.moves) ?? []) };
  const mine = mineResult(s);
  const cards = A.plans.map((p) => planCard(p.id, p.name, p.result, base, esc(notes[p.id]))).join('')
    + planCard('mine', 'Mon plan', mine.result, base, (state.model.manualMoves?.length ? esc(describeMoves(s, state.model.manualMoves)) : 'Construis ton propre plan en glissant sur le planning.'));

  let headline = '', sideList = '', robust = '';
  if (r) {
    const ex = explainPlan(s, base, r);
    headline = ex.headline.replace(/(\d[\d\s ]*) retards? évités?/, '<b>$&</b>');
    sideList = ex.sideEffects.length ? `<ul>${ex.sideEffects.map((x) => `<li>${esc(x)}</li>`).join('')}</ul>` : '';
    const rob = robustFor(s, sel);
    if (rob) {
      const low = rob[0], high = rob[1];
      robust = `<div class="notice ${low.holds && high.holds ? 'ok' : 'warn'} small"><b>Test de robustesse.</b> Si les cadences réelles sont 15 % plus basses : ${fmtN(low.baseLate)} retards sans changement, ${fmtN(low.planLate)} avec ce plan. Si elles sont 15 % plus hautes : ${fmtN(high.baseLate)} → ${fmtN(high.planLate)}. ${low.holds && high.holds ? 'Le plan reste utile dans les deux cas.' : 'Attention : dans un des cas, le plan fait moins bien que ne rien changer.'}</div>`;
    }
  }
  const kpis = r ? `<div class="kpis">
    <div class="kpi"><span class="v">${fmtN(r.onTimePercent, 1)} %</span><span class="l">à l’heure (${fmtN(r.onTime)} / ${fmtN(r.due)})</span></div>
    <div class="kpi"><span class="v">${fmtN(r.tardiness)} min</span><span class="l">retard cumulé</span></div>
    <div class="kpi"><span class="v">${fmtN(r.remaining)}</span><span class="l">commandes non finies à ${T(s.horizon)}</span></div>
    <div class="kpi"><span class="v">${r.moves.length}</span><span class="l">déplacement${r.moves.length > 1 ? 's' : ''}</span></div>
    <div class="kpi"><span class="v">${fmtN(r.transitionMinutes)} min</span><span class="l">de trajet sans production</span></div>
  </div>` : '';

  const editing = state.selected === 'mine';
  const pop = editing && state.editing ? (() => {
    const w = s.workers.find((x) => x.id === state.editing.workerId);
    const dests = s.stages.filter((st) => st.id !== w.stage && w.skills.includes(st.id));
    return `<div class="editor-pop" role="group" aria-label="Nouveau déplacement">
      <div><div class="eyebrow">Nouveau déplacement</div><b>${esc(w.name)}</b></div>
      <div class="field"><label for="ed-from">De</label><input id="ed-from" type="time" value="${T(state.editing.from)}"></div>
      <div class="field"><label for="ed-to">À</label><input id="ed-to" type="time" value="${T(state.editing.to)}"></div>
      <div class="field"><label for="ed-dest">Vers</label>${dests.length ? `<select id="ed-dest">${dests.map((st) => `<option value="${esc(st.id)}">${esc(st.name)}</option>`).join('')}</select>` : '<p class="small">Cette personne ne sait faire aucun autre poste.</p>'}</div>
      <div class="row"><button class="btn primary" data-action="add-move" ${dests.length ? '' : 'disabled'}>Ajouter</button><button class="btn" data-action="cancel-move">Annuler</button></div>
    </div>`;
  })() : '';
  const myMoves = state.model.manualMoves ?? [];
  const mineBox = editing ? `<section class="panel">
    <div class="panel-head"><h2>Mon plan</h2><div class="row">${myMoves.length ? '<button class="btn small danger" data-action="clear-mine">Tout effacer</button>' : ''}</div></div>
    <p class="small muted">Glisse sur la ligne d’une personne dans le planning pour choisir une période, puis choisis le poste où elle va. Le résultat se met à jour tout de suite.</p>
    ${mine.issues.length ? `<div class="notice bad">${mine.issues.map(esc).join(' ')}</div>` : ''}
    ${myMoves.length ? `<table><tbody>${myMoves.map((m, i) => `<tr><td>${esc(describeMoves(s, [m]))}</td><td style="text-align:right"><button class="btn small danger" data-action="remove-move" data-arg="${i}">Retirer</button></td></tr>`).join('')}</tbody></table>` : '<p class="muted small">Aucun déplacement pour l’instant.</p>'}
  </section>` : '';

  let charts = '';
  if (r) {
    const dl = s.orders.filter((o) => o.deadline <= s.horizon).map((o) => o.deadline).sort((p, q) => p - q);
    const due = []; let k = 0;
    for (let tm = 0; tm <= s.horizon; tm += 5) { while (k < dl.length && dl[k] <= tm) k++; due.push([tm, k]); }
    const done = (res) => [[0, 0], ...res.timeline.map((p) => [p.minute, p.completed])];
    const isBase = r === base;
    const hero = timeChart({
      title: 'Commandes finies au fil de la journée',

      H: s.horizon, height: 300,
      series: isBase
        ? [{ name: 'Dues (heures limites)', color: 'var(--bad)', step: true, width: 1.5, points: due }, { name: 'Finies sans changement', color: 'var(--ink)', width: 2.5, points: done(base) }]
        : [{ name: 'Dues (heures limites)', color: 'var(--bad)', step: true, width: 1.5, points: due }, { name: 'Finies sans changement', color: 'var(--muted)', dashed: true, points: done(base) }, { name: `Finies · ${sel.name}`, color: 'var(--ink)', width: 2.5, points: done(r) }],
      band: { over: 0, under: isBase ? 1 : 2 },
    });
    // Les postes où la file change le plus d’abord ; les autres sont repliés
    const peakOf = (res, i) => Math.max(...res.timeline.map((p) => p.queues[i]), 0);
    const orderIdx = s.stages.map((_, i) => i).sort((a, b) => (Math.abs(peakOf(base, b) - peakOf(r, b)) + peakOf(base, b) / 4) - (Math.abs(peakOf(base, a) - peakOf(r, a)) + peakOf(base, a) / 4));
    const shown = new Set(orderIdx.slice(0, 6));
    const queueCharts = s.stages.map((st, i) => {
      const pb = [[0, 0], ...base.timeline.map((p) => [p.minute, p.queues[i]])];
      const pp = [[0, 0], ...r.timeline.map((p) => [p.minute, p.queues[i]])];
      const mb = Math.max(...pb.map((p) => p[1])), mp = Math.max(...pp.map((p) => p[1]));
      return timeChart({
        title: st.name, subtitle: isBase ? ` · jusqu’à ${fmtN(mb)} en attente` : ` · pic ${fmtN(mb)} → ${fmtN(mp)}`,
        H: s.horizon, height: 150, small: true,
        series: isBase ? [{ name: 'En attente', color: stageColor(i), width: 2.5, points: pb }] : [{ name: 'Sans changement', color: 'var(--muted)', dashed: true, points: pb }, { name: sel.name, color: stageColor(i), width: 2.5, points: pp }],
      });
    });
    const queues = orderIdx.filter((i) => shown.has(i)).map((i) => queueCharts[i]).join('');
    const rest = orderIdx.filter((i) => !shown.has(i)).map((i) => queueCharts[i]).join('');
    charts = `${hero}<h3 style="margin-top:8px">Commandes en attente devant chaque poste</h3><p class="small muted">Une file qui monte = le poste n’arrive pas à suivre. Le but d’un renfort est d’aplatir la file du poste qui coince sans faire trop monter celle du poste qu’on dégarnit.${rest ? ' Les postes où la file change le plus sont affichés en premier.' : ''}</p><div class="charts">${queues}</div>${rest ? `<details><summary>Voir les ${s.stages.length - shown.size} autres postes</summary><div class="charts" style="margin-top:12px">${rest}</div></details>` : ''}`;
  }

  const people = r ? s.workers.map((w) => {
    const pw = r.perWorker[w.id];
    const units = s.stages.map((st) => `<td class="num">${pw.units[st.id] > 0.05 ? fmtN(pw.units[st.id]) : '<span class="muted">·</span>'}</td>`).join('');
    const moved = r.moves.some((m) => m.workerId === w.id);
    return `<tr class="${moved ? 'is-selected' : ''}"><td><b>${esc(w.name)}</b>${isInterim(w) ? ' <span class="chip interim">int.</span>' : ''}${moved ? ' <span class="chip">renfort</span>' : ''}</td><td>${esc(stageName(w.stage))}</td><td class="num">${fmtN(pw.active)}</td><td class="num">${fmtN(pw.idle)}</td><td class="num">${fmtN(pw.transition)}</td>${units}</tr>`;
  }).join('') : '';

  const all = [...A.candidates.map((c, i) => ({ c, i }))].sort((a, b) => compareResults(a.c, b.c));
  const allRows = all.map(({ c, i }) => `<tr class="${state.selected === `c:${i}` ? 'is-selected' : ''}"><td>${c.moves.length ? esc(describeMoves(s, c.moves)) : '<b>Ne rien changer</b>'}</td><td class="num">${fmtN(c.late)}</td><td class="num">${fmtN(c.tardiness)}</td><td class="num">${c.moves.length}</td><td><button class="btn small" data-action="select-plan" data-arg="c:${i}">Voir</button></td></tr>`).join('');

  return `
  ${pageHead('Étape 5 · Plans', 'Compare, puis décide', 'Trois plans calculés et le tien, sur la même journée. Rien n’est appliqué automatiquement : c’est toi qui choisis.', `${state.selected !== 'mine' && r?.moves.length ? '<button class="btn" data-action="copy-to-mine">Partir de ce plan</button>' : ''}<button class="btn" data-action="hist-save-day">Enregistrer dans le suivi</button>`)}
  <div class="plans">${cards}</div>
  ${r ? `<div class="headline"><span class="bar"></span><div><p>${headline}</p>${sideList}</div></div>` : ''}
  ${robust}
  ${kpis}
  ${mineBox}
  ${pop}
  <section class="panel strong">
    <div class="panel-head"><h2>Planning · ${esc(sel.name)}</h2><div class="row">${s.workers.length > 12 ? ganttFilterHTML(s, r ? r.moves : state.model.manualMoves ?? []) : ''}${editing ? '<span class="chip computed">Mode édition</span>' : '<button class="btn small" data-action="select-plan" data-arg="mine">Modifier à la main</button>'}</div></div>
    ${ganttHTML(s, r ? r.moves : state.model.manualMoves ?? [], editing)}
  </section>
  ${r ? `<section class="panel"><div class="panel-head"><h2>Ce qui change dans la journée</h2><span class="small muted">Survole un graphique pour lire les valeurs</span></div>${charts}</section>
  <section class="panel"><div class="panel-head"><h2>Travail par personne</h2><span class="small muted">Minutes et unités sur la période</span></div>
    <div class="scroll-x"><table><thead><tr><th>Personne</th><th>Poste de départ</th><th class="num">Actif (min)</th><th class="num">Sans travail (min)</th><th class="num">Trajets (min)</th>${s.stages.map((st) => `<th class="num">${esc(st.name)} (${unitLabel(st)})</th>`).join('')}</tr></thead><tbody>${people}</tbody></table></div>
    <p class="hint">« Sans travail » : la personne était à son poste mais aucune commande n’était prête, ou la machine était arrêtée.</p></section>` : ''}
  <p class="small muted mono">Calculé en ${fmtN((A.elapsedMs ?? 0) / 1000, 1)} s · ${A.evaluated} plans simulés minute par minute · ${fmtN((A.simulatedPersonMinutes ?? 0) / 1000)} k minutes-personne · ${s.workers.length} personnes · ${fmtN(s.orders.length)} commandes · ${s.stages.length} postes</p>
  <details class="panel"><summary>Tous les plans évalués (${A.evaluated})</summary>
    <p class="small muted">${esc(A.method)}</p>
    <div class="scroll-x"><table><thead><tr><th>Déplacements</th><th class="num">Retards</th><th class="num">Retard cumulé (min)</th><th class="num">Nb</th><th></th></tr></thead><tbody>${allRows}</tbody></table></div>
  </details>`;
}

function forecastBanner() {
  if (!state.history.days.length) return '';
  try {
    const f = forecastFor(todayISO());
    const bits = [];
    if (f.topAbs && f.topAbs.p >= 0.1) bits.push(`absence possible à ${esc(f.topAbs.st.name)} vers ${String(f.topAbs.h).padStart(2, '0')}:00 (${pct(f.topAbs.p)})`);
    if (f.peak && f.peak.pPeak >= 0.5) bits.push(`pic de commandes probable vers ${String(f.peak.h).padStart(2, '0')}:00 (${pct(f.peak.pPeak)})`);
    if (!bits.length) return '';
    return `<div class="notice small"><b>D’après le suivi, aujourd’hui :</b> ${bits.join(' ; ')}. <button class="btn small ghost" data-action="go" data-arg="tracking">Voir les prévisions</button></div>`;
  } catch { return ''; }
}

// Rendu, événements et démarrage

function render() {
  const focusId = document.activeElement?.id;
  const views = { warehouse: warehouseView, team: teamView, day: dayView, diagnostic: diagnosticView, plans: plansView, tracking: trackingView, ai: aiView };
  let html;
  try { html = views[state.step](); } catch (e) { console.error(e); html = `<div class="notice bad" role="alert">Cet écran n’a pas pu s’afficher : ${esc(e.message)}. Vérifie les données saisies ou recharge un exemple.</div>`; }
  document.getElementById('app').innerHTML = `${headerHTML()}<main id="main">${html}</main>${modalHTML() || trackingModalHTML() || aiModalHTML() || sitesModalHTML() || routeModalHTML()}`;
  if (focusId) { const el = document.getElementById(focusId); if (el) el.focus({ preventScroll: true }); }
  if (state.step === 'team') applyTeamFilter();
  const nav = document.querySelector('.steps'); const cur = nav?.querySelector('[aria-current]');
  if (nav && cur && (cur.offsetLeft + cur.offsetWidth > nav.scrollLeft + nav.clientWidth || cur.offsetLeft < nav.scrollLeft)) nav.scrollLeft = cur.offsetLeft - 16;
}

function go(step) {
  state.step = step; state.editing = null; state.confirm = null;
  render();
  window.scrollTo({ top: 0 });
  try { history.replaceState(null, '', `#${step}`); } catch { /* sans importance */ }
}

const uid = (prefix, taken) => { let n = taken.length + 1; while (taken.includes(`${prefix}${n}`)) n++; return `${prefix}${n}`; };

function confirmTwice(key) {
  if (state.confirm === key) { state.confirm = null; return true; }
  state.confirm = key; render(); return false;
}

const actions = {
  go: (a) => go(a),
  open(value) {
    if (!value) return;
    const [kind, k] = value.split(':');
    if (kind === 'preset') state.model = createModel(k);
    else { const lib = store.get(LIB_KEY, []); try { state.model = normalizeModel(lib[+k].model); } catch (e) { toast(e.message); return; } }
    state.selected = 'best'; state.editing = null;
    changed();
    toast(`« ${state.model.name} » ouvert`);
  },
  save() {
    const lib = store.get(LIB_KEY, []);
    const i = lib.findIndex((x) => x.name === state.model.name);
    const entry = { name: state.model.name, savedAt: new Date().toISOString(), model: state.model };
    if (i >= 0) lib[i] = entry; else lib.push(entry);
    toast(store.set(LIB_KEY, lib) ? `« ${state.model.name} » enregistré dans ce navigateur` : 'Ce navigateur bloque l’enregistrement. Utilise « Exporter ».');
    render();
  },
  export() { state.modal = 'export'; render(); },
  import() { state.modal = 'import'; render(); },
  'close-modal'() { state.modal = null; render(); },
  async 'copy-export'() {
    const ta = document.getElementById('export-text');
    try { await navigator.clipboard.writeText(ta.value); toast('Copié'); } catch { ta.focus(); ta.select(); toast('Sélectionné : copie avec Ctrl+C ou ⌘+C'); }
  },
  'do-import'() {
    const file = document.getElementById('import-file')?.files?.[0];
    const text = document.getElementById('import-text')?.value?.trim();
    const apply = (raw) => {
      try { state.model = normalizeModel(JSON.parse(raw)); state.modal = null; state.selected = 'best'; changed(); toast('Journée importée'); }
      catch (e) { toast(`Import impossible : ${e.message}`); }
    };
    if (file) { if (file.size > 2e6) { toast('Fichier trop lourd (2 Mo maximum).'); return; } const r = new FileReader(); r.onload = () => apply(r.result); r.readAsText(file); }
    else if (text) apply(text);
    else toast('Choisis un fichier ou colle un contenu.');
  },
  'paste-team'() { state.modal = 'paste-team'; render(); },
  'do-paste-team'() {
    const m = state.model;
    const lines = (document.getElementById('paste-text')?.value ?? '').split(/\r?\n/).map((l) => l.trim()).filter(Boolean);
    let added = 0;
    for (const line of lines) {
      const cols = line.split(/\t|;|,/).map((c) => c.trim());
      if (!cols[0]) continue;
      const st = m.stages.find((s) => s.name.toLowerCase() === (cols[1] ?? '').toLowerCase()) ?? m.stages[0];
      const start = fromTime(cols[2]) ?? 0; const end = fromTime(cols[3]) ?? m.settings.horizon;
      const id = uid('P', m.workers.map((w) => w.id));
      m.workers.push({ id, name: cols[0], stage: st.id, skills: [st.id], rates: { [st.id]: st.rate }, start: Math.min(start, m.settings.horizon - 1), end: Math.min(Math.max(end, start + 1), m.settings.horizon), breaks: [], locked: false });
      added++;
    }
    state.modal = null; changed(); toast(`${added} personne${added > 1 ? 's' : ''} ajoutée${added > 1 ? 's' : ''}`);
  },
  'stage-add'() {
    const m = state.model;
    const id = uid('poste', m.stages.map((s) => s.id));
    // Les vagues existantes gardent leur parcours actuel : le nouveau poste n’y est pas ajouté d’office.
    const all = m.stages.map((s) => s.id);
    for (const b of m.batches) b.route ??= [...all];
    for (const e of m.events) if (e.type === 'peak') e.route ??= [...all];
    m.stages.push({ id, name: 'Nouveau poste', unit: 'order', rate: 60, maxWorkers: 4, maxRate: 0, after: [] });
    changed();
    toast('Poste ajouté. Indique après quel poste il commence, puis ajoute-le aux vagues concernées dans « Journée ».');
  },
  'toggle-after'(arg) {
    const [i, id] = arg.split('|'); const st = state.model.stages[+i];
    const on = (st.after ?? []).includes(id);
    const next = on ? st.after.filter((x) => x !== id) : [...(st.after ?? []), id];
    const test = state.model.stages.map((x, j) => (j === +i ? { ...x, after: next } : x));
    if (!on && findCycle(test)) { toast('Impossible : cela créerait une boucle entre les postes.'); return; }
    st.after = next; changed();
  },
  'toggle-route'(arg) {
    const [path, id] = arg.split('|'); const obj = getPath(state.model, path);
    const all = state.model.stages.map((s) => s.id);
    let route = obj.route ? [...obj.route] : [...all];
    route = route.includes(id) ? route.filter((x) => x !== id) : [...route, id];
    if (!route.length) { toast('Une vague doit passer par au moins un poste.'); return; }
    obj.route = all.every((x) => route.includes(x)) ? null : all.filter((x) => route.includes(x));
    changed();
  },
  'stage-left'(i) { const s = state.model.stages; i = +i; [s[i - 1], s[i]] = [s[i], s[i - 1]]; changed(); },
  'stage-right'(i) { const s = state.model.stages; i = +i; [s[i + 1], s[i]] = [s[i], s[i + 1]]; changed(); },
  'stage-delete'(i) {
    if (!confirmTwice(`del-stage:${i}`)) return;
    const m = state.model; const st = m.stages[+i];
    m.stages.splice(+i, 1);
    const fallback = m.stages[0];
    for (const w of m.workers) {
      w.skills = w.skills.filter((x) => x !== st.id); delete w.rates[st.id];
      if (w.stage === st.id) { w.stage = fallback.id; if (!w.skills.includes(fallback.id)) { w.skills.unshift(fallback.id); w.rates[fallback.id] = fallback.rate; } }
    }
    for (const x of m.stages) x.after = (x.after ?? []).filter((p) => p !== st.id).concat(x.after?.includes(st.id) ? st.after ?? [] : []).filter((p, k, arr) => arr.indexOf(p) === k && p !== x.id);
    for (const b of [...m.batches, ...m.events.filter((e) => e.type === 'peak')]) if (b.route) { b.route = b.route.filter((x) => x !== st.id); if (!b.route.length) b.route = null; }
    m.events = m.events.filter((e) => !(e.type === 'machine' && e.stage === st.id));
    m.manualMoves = m.manualMoves.filter((x) => x.to !== st.id);
    changed(); toast(`Poste « ${st.name} » supprimé`);
  },
  'worker-add'() {
    const m = state.model; const st = m.stages[0];
    if (!st) { toast('Ajoute d’abord un poste dans « Entrepôt ».'); return; }
    const id = uid('P', m.workers.map((w) => w.id));
    m.workers.push({ id, name: `Personne ${m.workers.length + 1}`, stage: st.id, skills: [st.id], rates: { [st.id]: st.rate }, start: 0, end: m.settings.horizon, breaks: [{ start: Math.min(120, m.settings.horizon - 15), duration: 15 }], locked: false, contract: 'interne' });
    changed();
  },
  'worker-delete'(i) {
    if (!confirmTwice(`del-worker:${i}`)) return;
    const m = state.model; const w = m.workers[+i];
    m.workers.splice(+i, 1);
    m.events = m.events.filter((e) => !(e.type === 'absence' && e.workerId === w.id));
    m.manualMoves = m.manualMoves.filter((x) => x.workerId !== w.id);
    changed(); toast(`${w.name} retiré·e de l’équipe`);
  },
  'batch-add'() {
    const m = state.model; const last = m.batches[m.batches.length - 1];
    const arrival = Math.min(m.settings.horizon - 30, last ? last.arrival + 60 : 0);
    m.batches.push({ id: uid('V', m.batches.map((b) => b.id)), name: `Vague ${m.batches.length + 1}`, count: 100, arrival, spread: 15, deadline: Math.min(arrival + 80, m.settings.horizon), route: last?.route ? [...last.route] : null });
    changed();
  },
  'batch-delete'(i) { state.model.batches.splice(+i, 1); changed(); },
  'event-add'(type) {
    const m = state.model; const at = Math.min(60, m.settings.horizon - 30);
    if ((type === 'absence' && !m.workers.length) || (type === 'machine' && !m.stages.length)) { toast(type === 'absence' ? 'Ajoute d’abord des personnes dans « Équipe ».' : 'Ajoute d’abord un poste dans « Entrepôt ».'); return; }
    if (type === 'absence') m.events.push({ type, workerId: m.workers[0].id, at, until: null });
    if (type === 'peak') m.events.push({ type, at, count: 60, spread: 15, deadline: Math.min(at + 90, m.settings.horizon), route: m.batches[0]?.route ? [...m.batches[0].route] : null });
    if (type === 'machine') m.events.push({ type, stage: m.stages[0].id, at, duration: 30 });
    changed();
  },
  'event-delete'(i) { state.model.events.splice(+i, 1); changed(); },
  'select-plan'(id) { state.selected = id; state.editing = null; render(); if (id === 'mine') document.getElementById('gantt')?.scrollIntoView({ block: 'nearest' }); },
  'copy-to-mine'() {
    const sel = selectedPlan(scenario());
    state.model.manualMoves = sel.result.moves.map(({ workerId, to, at, until }) => ({ workerId, to, at, until }));
    state.selected = 'mine';
    changed({ keepAnalysis: true });
    toast('Plan copié dans « Mon plan » : modifie-le librement');
  },
  'add-move'() {
    const e = state.editing; if (!e) return;
    const from = fromTime(document.getElementById('ed-from').value); const to = fromTime(document.getElementById('ed-to').value);
    const dest = document.getElementById('ed-dest')?.value;
    if (from == null || to == null || to <= from) { toast('L’heure de fin doit être après l’heure de début.'); return; }
    state.model.manualMoves.push({ workerId: e.workerId, to: dest, at: from, until: to });
    state.editing = null;
    changed({ keepAnalysis: true });
  },
  'skill-menu'(i) { state.skillMenu = +i; render(); document.getElementById(`sk-add-${i}`)?.focus(); },
  'skill-remove'(arg) {
    const [i, sid] = arg.split('|'); const w = state.model.workers[+i];
    w.skills = w.skills.filter((x) => x !== sid);
    state.model.manualMoves = state.model.manualMoves.filter((x) => !(x.workerId === w.id && x.to === sid));
    changed();
  },
  'cancel-move'() { state.editing = null; render(); },
  'remove-move'(i) { state.model.manualMoves.splice(+i, 1); changed({ keepAnalysis: true }); },
  'clear-mine'() { state.model.manualMoves = []; changed({ keepAnalysis: true }); },
};

// ---------- Schéma du flux : zoom et déplacement ----------
function setVB(wrap, vb) { wrap.querySelector('svg').setAttribute('viewBox', vb.map((v) => v.toFixed(1)).join(' ')); }
function getVB(wrap) { return wrap.querySelector('svg').getAttribute('viewBox').split(' ').map(Number); }
function zoomFlow(wrap, factor, cx = 0.5, cy = 0.5) {
  const [x, y, w, h] = getVB(wrap);
  const base = wrap.dataset.vb.split(' ').map(Number);
  const nw = Math.min(base[2] * 3, Math.max(base[2] / 4, w * factor)); const nh = (nw / w) * h;
  setVB(wrap, [x + (w - nw) * cx, y + (h - nh) * cy, nw, nh]);
}
let pan = null;
document.addEventListener('pointerdown', (ev) => {
  const wrap = ev.target.closest('.flowwrap');
  if (!wrap || ev.target.closest('button') || ev.target.closest('[data-action]')) return;
  pan = { wrap, x: ev.clientX, y: ev.clientY, vb: getVB(wrap), rect: wrap.getBoundingClientRect() };
  wrap.classList.add('dragging');
});
document.addEventListener('pointermove', (ev) => {
  if (!pan) return;
  const [x, y, w, h] = pan.vb;
  const k = Math.max(w / pan.rect.width, h / pan.rect.height);
  setVB(pan.wrap, [x - (ev.clientX - pan.x) * k, y - (ev.clientY - pan.y) * k, w, h]);
});
document.addEventListener('pointerup', () => { if (pan) { pan.wrap.classList.remove('dragging'); pan = null; } });
document.addEventListener('wheel', (ev) => {
  const wrap = ev.target.closest?.('.flowwrap');
  if (!wrap || !(ev.ctrlKey || ev.metaKey)) return;
  ev.preventDefault();
  const r = wrap.getBoundingClientRect();
  zoomFlow(wrap, ev.deltaY > 0 ? 1.12 : 1 / 1.12, (ev.clientX - r.left) / r.width, (ev.clientY - r.top) / r.height);
}, { passive: false });

document.addEventListener('click', (ev) => {
  const fz = ev.target.closest('[data-flowzoom]');
  if (fz) {
    const wrap = fz.closest('.flowwrap');
    if (fz.dataset.flowzoom === 'fit') setVB(wrap, wrap.dataset.vb.split(' ').map(Number));
    else zoomFlow(wrap, fz.dataset.flowzoom === 'in' ? 0.8 : 1.25);
    return;
  }
  const back = ev.target.classList?.contains('modal-back') ? ev.target : null;
  if (back) { actions['close-modal'](); return; }
  const el = ev.target.closest('[data-action]');
  if (!el || el.disabled) return;
  const fn = actions[el.dataset.action];
  if (fn) { ev.preventDefault(); fn(el.dataset.arg); }
});

document.addEventListener('change', (ev) => {
  const el = ev.target;
  const m = state.model;
  if (el.dataset.actionChange === 'open') { actions.open(el.value); return; }
  if (el.dataset.actionChange === 'skill-add') {
    const w = m.workers[+el.dataset.w]; const sid = el.value; if (!sid) return;
    const st = m.stages.find((s) => s.id === sid);
    if (!w.skills.includes(sid)) w.skills.push(sid);
    if (w.rates[sid] == null && state.history.days.length) { const sug = models().transfer.suggest(w, sid); if (sug) { w.rates[sid] = sug.rate; toast(`Cadence proposée d’après le suivi : ${sug.rate} ${rateLabel(st)}`); } }
    w.rates[sid] ??= Math.round(st.rate * 0.85);
    state.skillMenu = null;
    changed(); return;
  }
  if (el.dataset.actionChange === 'forecast-date') { state.forecastDate = el.value || null; render(); return; }
  if (el.dataset.actionChange === 'assist-pick') { const s = state.assist.selected; if (el.checked) s.add(el.dataset.k); else s.delete(el.dataset.k); readTextArea(); render(); return; }
  if (el.dataset.actionChange === 'assist-file') {
    const file = el.files?.[0]; if (!file) return;
    fileToMedia(file).then((media) => { state.assist.image = media; state.assist.error = null; render(); }).catch(() => { state.assist.error = 'Cette image n’a pas pu être lue.'; render(); });
    return;
  }
  if (el.dataset.actionChange === 'skill') {
    const w = m.workers[+el.dataset.w]; const sid = el.dataset.s; const st = m.stages.find((s) => s.id === sid);
    if (el.checked && w.rates[sid] == null && state.history.days.length) {
      const sug = models().transfer.suggest(w, sid);
      if (sug) { w.rates[sid] = sug.rate; toast(`Cadence proposée d’après le suivi : ${sug.rate} ${rateLabel(st)} (${Math.round(sug.ratio * 100)} % de son niveau habituel)`); }
    }
    if (el.checked) { if (!w.skills.includes(sid)) w.skills.push(sid); w.rates[sid] ??= Math.round(st.rate * 0.85); }
    else { w.skills = w.skills.filter((x) => x !== sid); m.manualMoves = m.manualMoves.filter((x) => !(x.workerId === w.id && x.to === sid)); }
    changed(); return;
  }
  if (el.dataset.actionChange === 'worker-stage') {
    const w = m.workers[+el.dataset.w]; const st = m.stages.find((s) => s.id === el.value);
    w.stage = st.id; if (!w.skills.includes(st.id)) w.skills.push(st.id); w.rates[st.id] ??= st.rate;
    m.manualMoves = m.manualMoves.filter((x) => x.workerId !== w.id);
    changed(); return;
  }
  const kind = el.dataset.kind;
  if (kind === 'stage-rate') {
    const st = m.stages[+el.dataset.index]; const v = parseFloat(String(el.value).replace(',', '.'));
    if (!(v > 0)) { toast('Cadence invalide.'); render(); return; }
    const f = v / st.rate;
    for (const w of m.workers) if (w.rates[st.id] != null) w.rates[st.id] = Math.round(w.rates[st.id] * f * 10) / 10;
    st.rate = v; changed(); return;
  }
  if (kind === 'horizon') {
    const v = fromTime(el.value);
    if (v == null || v < 15 || v > 720) { toast('La période doit durer entre 15 minutes et 12 heures.'); render(); return; }
    m.settings.horizon = v;
    for (const w of m.workers) { w.end = Math.min(w.end, v); w.start = Math.min(w.start, v - 1); w.breaks = (w.breaks ?? []).filter((b) => b.start + b.duration <= w.end); }
    changed(); return;
  }
  if (kind === 'break-start' || kind === 'break-dur') {
    const w = m.workers[+el.dataset.w]; const k = +(el.dataset.b ?? 0);
    w.breaks = w.breaks?.length ? w.breaks : [{ start: w.start, duration: 0 }];
    const b = w.breaks[k] ?? w.breaks[0];
    if (kind === 'break-start') { const v = fromTime(el.value); if (v != null) b.start = v; }
    else { const v = parseInt(el.value, 10); b.duration = Number.isFinite(v) ? Math.max(0, v) : 0; }
    changed(); return;
  }
  if (el.dataset.path) {
    const v = readInput(el);
    if (v === null && kind !== 'nullable-time') { toast('Valeur invalide : elle n’a pas été prise en compte.'); render(); return; }
    setPath(m, el.dataset.path, v);
    changed();
  }
});

// ---------- Planning : glisser pour créer un déplacement ----------
let drag = null;
function minuteAt(track, clientX) {
  const r = track.getBoundingClientRect();
  const H = state.model.settings.horizon;
  const raw = ((clientX - r.left) / r.width) * H;
  return Math.max(0, Math.min(H, Math.round(raw / 15) * 15));
}
document.addEventListener('pointerdown', (ev) => {
  const track = ev.target.closest('.g-track.editable');
  if (!track || state.selected !== 'mine') return;
  ev.preventDefault();
  const a = minuteAt(track, ev.clientX);
  let sel = track.querySelector('.g-sel');
  if (!sel) { sel = document.createElement('div'); sel.className = 'g-sel'; track.appendChild(sel); }
  drag = { track, a, b: a, sel, workerId: track.dataset.worker };
  try { track.setPointerCapture(ev.pointerId); } catch { /* ignoré */ }
  paintDrag();
});
document.addEventListener('pointermove', (ev) => { if (!drag) return; drag.b = minuteAt(drag.track, ev.clientX); paintDrag(); });
document.addEventListener('pointerup', () => {
  if (!drag) return;
  const w = state.model.workers.find((x) => x.id === drag.workerId);
  let from = Math.min(drag.a, drag.b), to = Math.max(drag.a, drag.b);
  if (to - from < 15) to = from + 60;
  from = Math.max(from, w.start); to = Math.min(to, w.end);
  drag = null;
  if (to <= from) return;
  state.editing = { workerId: w.id, from, to };
  render();
  const pop = document.querySelector('.editor-pop');
  pop?.scrollIntoView({ block: 'nearest', behavior: 'smooth' });
  document.getElementById('ed-dest')?.focus({ preventScroll: true });
});
function paintDrag() {
  const H = state.model.settings.horizon;
  const a = Math.min(drag.a, drag.b), b = Math.max(drag.a, drag.b);
  drag.sel.style.left = `${(100 * a) / H}%`;
  drag.sel.style.width = `${(100 * Math.max(b - a, 2)) / H}%`;
}

document.addEventListener('keydown', (ev) => { if (ev.key === 'Escape' && state.modal) actions['close-modal'](); });

const HISTORY_KEY = 'crewline.history';
state.history = store.get(HISTORY_KEY, null) ?? emptyHistory();
state.historyVersion = 0;
state.forecastDate = null;

function saveHistory(h) {
  state.history = h; state.historyVersion++; state.models = null;
  if (!store.set(HISTORY_KEY, h)) toast('Ce navigateur bloque l’enregistrement du suivi : pense à l’exporter.');
}
function models() {
  const key = `${state.historyVersion}|${state.version}`;
  if (!state.models || state.models.key !== key) state.models = { key, value: trainAll({ ...state.history, days: siteDays() }, state.model) };
  return state.models.value;
}
const todayISO = () => { const d = new Date(); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; };
function nextWorkday() { const d = new Date(); while ([0, 6].includes(d.getDay())) d.setDate(d.getDate() + 1); return `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`; }
const dateFr = (iso) => new Date(`${iso}T12:00:00`).toLocaleDateString('fr-FR', { weekday: 'long', day: 'numeric', month: 'long' });
const pct = (p) => `${fmtN(p * 100)} %`;

function riskClass(p, base) {
  const r = base > 0 ? p / base : 1;
  return r >= 2 ? 'l3' : r >= 1.3 ? 'l2' : 'l1';
}

function forecastFor(date) {
  const M = models(); const m = state.model; const wd = weekdayOf(date);
  const cells = (risk) => m.stages.map((st) => M.hours.map((h) => ({ st, h, ...risk.predict(st.id, wd, h) })));
  const abs = cells(M.absence), late = cells(M.late);
  const vol = M.volume ? M.hours.map((h) => ({ h, ...M.volume.predict(date, h) })) : [];
  const topAbs = abs.flat().sort((a, b) => b.p / (b.base || 1) - a.p / (a.base || 1))[0];
  const topLate = late.flat().sort((a, b) => b.p - a.p)[0];
  const peak = [...vol].sort((a, b) => b.pPeak - a.pPeak)[0];
  return { wd, abs, late, vol, topAbs, topLate, peak, total: vol.reduce((n, v) => n + v.expected, 0), normal: vol.reduce((n, v) => n + v.normal, 0) };
}

function heatRisk(title, rows, hours) {
  const head = `<div></div>${hours.map((h) => `<div class="h-time">${String(h).padStart(2, '0')}:00</div>`).join('')}`;
  const body = rows.map((row, i) => `<div class="h-label"><span class="swatch" style="background:${stageColor(state.model.stages.indexOf(row[0].st))}"></span>${esc(row[0].st.name)}</div>${row.map((c) => `<div class="cell ${riskClass(c.p, c.base)}" title="${esc(c.st.name)} ${String(c.h).padStart(2, '0')}:00 : ${pct(c.p)} (moyenne du poste ${pct(c.base)}, ${c.n} jours observés)">${pct(c.p)}</div>`).join('')}`).join('');
  return `<div><h3>${esc(title)}</h3><div class="scroll-x"><div class="heat" style="grid-template-columns:150px repeat(${hours.length},minmax(64px,1fr));min-width:420px">${head}${body}</div></div></div>`;
}

function volumeBars(vol) {
  if (!vol.length) return '';
  const max = Math.max(...vol.map((v) => Math.max(v.expected, v.normal))) || 1;
  return `<div class="vbars" role="img" aria-label="Volume attendu par heure">${vol.map((v) => {
    const up = v.expected / Math.max(1, v.normal) - 1;
    return `<div class="vbar" title="${String(v.h).padStart(2, '0')}:00 : ${fmtN(v.expected)} commandes attendues, ${fmtN(v.normal)} en temps normal, risque de pic ${pct(v.pPeak)}">
      <span class="vval mono">${fmtN(v.expected)}</span>
      <div class="vcol"><div class="vfill ${v.pPeak >= 0.5 ? 'peak' : ''}" style="height:${(100 * v.expected) / max}%"></div><div class="vnorm" style="bottom:${(100 * v.normal) / max}%"></div></div>
      <span class="vlab mono">${String(v.h).padStart(2, '0')}:00</span>
      <span class="vdelta ${up > 0.15 ? 'delta-bad' : 'muted'}">${up >= 0 ? '+' : ''}${fmtN(up * 100)} %</span>
      ${v.pPeak >= 0.5 ? `<span class="chip assumed">pic ${pct(v.pPeak)}</span>` : ''}
    </div>`;
  }).join('')}</div><div class="legend"><span><i style="background:var(--s1)"></i>Commandes attendues</span><span><i style="background:var(--warn)"></i>Pic probable (≥ 50 %)</span><span><i style="background:var(--ink);height:3px"></i>Niveau normal</span></div>`;
}

function trackingView() {
  const h = { ...state.history, days: siteDays() }; const m = state.model;
  const actions = `<button class="btn" data-action="hist-event">+ Événement passé</button><button class="btn" data-action="hist-save-day">Enregistrer la journée en cours</button>`;

    return `${pageHead('Suivi', 'Apprendre de tes journées', 'Chaque journée enregistrée (absences, retards, pannes, pics, volumes, cadences) alimente des modèles qui prévoient les risques des jours suivants. Plus il y a de données, plus les prévisions sont fiables.', actions)}

  if (f.topLate && f.topLate.p >= 0.1) head.push(`retards à l’arrivée probables à <b>${esc(f.topLate.st.name)}</b> vers ${String(f.topLate.h).padStart(2, '0')}:00 (${pct(f.topLate.p)})`);
  if (f.vol.length) head.push(`volume attendu <b>${fmtN(f.total)} commandes</b> (${f.total >= f.normal ? '+' : ''}${fmtN((f.total / Math.max(1, f.normal) - 1) * 100)} % par rapport à la normale)${f.peak && f.peak.pPeak >= 0.5 ? `, pic probable vers ${String(f.peak.h).padStart(2, '0')}:00` : ''}`);

    if (a.id === b.id) return '<td class="num muted">100 %</td>';
    const p = T2.get(a.id, b.id);
    return p?.ratio ? `<td class="num" title="${p.n} personne(s), fiabilité ${p.confidence}"><b>${fmtN(p.ratio * 100)} %</b> <span class="muted small">${p.n} pers.</span></td>` : '<td class="num muted small">pas assez de données</td>';
  }).join('')}</tr>`).join('')}</tbody></table>`;
  const best = T2.pairs.filter((p) => p.ratio).sort((x, y) => x.ratio - y.ratio)[0];

  // Historique des retards
  const lastDays = h.days.slice(-40);
  const maxLate = Math.max(1, ...lastDays.map((d) => d.late ?? 0));
  const bars = `<div class="hbars" role="img" aria-label="Commandes en retard par jour">${lastDays.map((d) => `<div class="hbar" title="${dateFr(d.date)} : ${d.late ?? '—'} retards, ${d.events.length} événements"><div style="height:${(100 * (d.late ?? 0)) / maxLate}%"></div></div>`).join('')}</div><div class="row small muted" style="justify-content:space-between"><span>${dateFr(lastDays[0].date)}</span><span>${dateFr(lastDays[lastDays.length - 1].date)}</span></div>`;

    return `<tr><td>${dateFr(d.date)}</td><td class="num">${fmtN(d.orders)}</td><td class="num">${d.late ?? '—'}</td><td>${Object.entries(counts).map(([k, v]) => `${v} ${k}${v > 1 ? 's' : ''}`).join(', ') || '<span class="muted">aucun</span>'}</td><td><div class="row" style="flex-wrap:nowrap;gap:6px">${d.snapshot ? `<button class="btn small" data-action="hist-reopen" data-arg="${d.date}">Rouvrir</button>` : ''}<button class="btn small danger" data-action="hist-del-day" data-arg="${d.date}">Retirer</button></div></td></tr>`;
  }).join('');

  return `

  <div class="row">${h.demo ? '<span class="chip assumed">Historique d’exemple : données fictives</span>' : '<span class="chip input">Données saisies</span>'}<span class="chip computed">Modèles entraînés dans ton navigateur</span>
    <button class="btn small ghost" data-action="hist-export">Exporter le suivi</button><button class="btn small ghost danger" data-action="hist-clear">${state.confirm === 'hist-clear' ? 'Confirmer : tout effacer' : 'Effacer le suivi'}</button></div>

  <section class="panel strong">

    <div class="headline"><span class="bar"></span><div><p>${esc(dateFr(date)).replace(/^./, (c) => c.toUpperCase())} : ${head.join(' ; ')}.</p></div></div>
    <div class="grid-2">${heatRisk('Risque qu’une absence commence', f.abs, M.hours)}${heatRisk('Risque qu’un retard à l’arrivée commence', f.late, M.hours)}</div>
    <div class="legend"><span><i style="background:var(--ok-soft);border:1px solid var(--ok)"></i>Normal pour ce poste</span><span><i style="background:var(--warn-soft);border:1px solid var(--warn)"></i>1,3 à 2 × la normale</span><span><i style="background:var(--bad)"></i>Plus de 2 × la normale</span></div>
    <h3>Commandes attendues par heure</h3>
    ${volumeBars(f.vol)}
    <div class="row"><button class="btn primary" data-action="hist-apply-forecast" data-arg="${date}">Tester ces risques sur la journée →</button><span class="small muted">Ajoute à la journée les imprévus les plus probables, puis ouvre le diagnostic.</span></div>
  </section>

  <section class="panel">

    <p class="small muted">Lecture : une personne à 100 % sur son poste principal (ligne) atteint en moyenne ce pourcentage sur l’autre poste (colonne). Calculé sur les cadences mesurées des personnes qui font les deux.${best ? ` Le transfert le plus coûteux : ${esc(m.stages.find((s) => s.id === best.from).name)} → ${esc(m.stages.find((s) => s.id === best.to).name)} (${fmtN(best.ratio * 100)} %).` : ''} Quand tu coches un nouveau poste pour quelqu’un dans « Équipe », sa cadence est proposée à partir de ce tableau.</p>
    <div class="scroll-x">${matrix}</div>
  </section>

  <div class="grid-2">
    <section class="panel">
      <div class="panel-head"><h2>Commandes en retard par jour</h2><span class="small muted">${lastDays.length} derniers jours</span></div>
      ${bars}
      <div class="scroll-x"><table><thead><tr><th>Jour</th><th class="num">Commandes</th><th class="num">Retards</th><th>Événements</th><th></th></tr></thead><tbody>${rows}</tbody></table></div>
    </section>
    <section class="panel">
      <div class="panel-head"><h2>Fiabilité des prévisions</h2></div>
      ${ev ? `<p class="small muted">Test honnête : les modèles apprennent sur les ${ev.trainDays} premiers jours, puis prévoient les ${ev.testDays} derniers sans les avoir vus.</p>
      <div class="kpis" style="grid-template-columns:1fr">
        <div class="kpi"><span class="v">${ev.late.capture20 != null ? pct(ev.late.capture20) : '—'}</span><span class="l">des retards réels tombent dans les 20 % de créneaux jugés les plus risqués (au hasard : 20 %)</span></div>
        <div class="kpi"><span class="v">${ev.absence.capture20 != null ? pct(ev.absence.capture20) : '—'}</span><span class="l">des absences réelles tombent dans les 20 % de créneaux jugés les plus risqués (au hasard : 20 %)</span></div>
        <div class="kpi"><span class="v">${fmtN(ev.volume.mae)} cmd/h</span><span class="l">d’erreur moyenne sur le volume, contre ${fmtN(ev.volume.naive)} avec une simple moyenne (${fmtN(ev.volume.gain * 100)} % de mieux)</span></div>
      </div>
      <p class="hint">Les absences restent difficiles à prévoir : ce sont des événements rares. Les prévisions deviennent plus fiables avec plusieurs mois de données réelles.</p>` : '<p class="muted">Il faut au moins 12 journées pour mesurer la fiabilité des prévisions.</p>'}
    </section>
  </div>`;
}

  'hist-save-day'() { state.modal = 'hist-save-day'; render(); },
  'hist-event'() { state.modal = 'hist-event'; render(); },
  'hist-do-save'() {
    const date = document.getElementById('hs-date').value || todayISO();
    const note = document.getElementById('hs-note').value;
    const s = scenario();
    let result = null, planName = '';
    if (state.analysis?.result) { const sel = selectedPlan(s); result = sel.result; planName = sel.name; }
    else { try { result = simulate(s, []); planName = 'Ne rien changer'; } catch { /* données incomplètes */ } }
    const day = dayFromModel(state.model, s, result, { date, planName, note });
    day.site = state.model.site?.id ?? null; day.siteName = state.model.site?.name ?? ''; day.snapshot = JSON.parse(JSON.stringify(state.model));
    saveHistory(addDay(state.history, day));
    state.modal = null; render(); toast(`Journée du ${dateFr(date)} enregistrée dans le suivi`);
  },
  'hist-do-event'() {
    const date = document.getElementById('he-date').value; if (!date) { toast('Choisis une date.'); return; }
    const type = document.getElementById('he-type').value; const stage = document.getElementById('he-stage').value;
    const at = fromTime(document.getElementById('he-at').value) ?? 0; const q = parseInt(document.getElementById('he-qty').value, 10) || 0;
    const h = state.history;
    let day = h.days.find((d) => d.date === date);
    if (!day) day = { date, weekday: weekdayOf(date), startHour: state.model.settings.startHour, horizon: state.model.settings.horizon, stages: state.model.stages.map((s) => ({ id: s.id, name: s.name, rate: s.rate })), staff: {}, volumes: {}, orders: 0, late: null, due: null, events: [], rates: [], plan: '', note: '' };
    const e = type === 'absence' ? { type, stage, at, until: null } : type === 'late' ? { type, stage, at, minutes: q || 15 } : type === 'machine' ? { type, stage, at, until: at + (q || 30) } : { type: 'peak', stage: null, at, count: q || 50 };
    day = { ...day, events: [...day.events, e] };
    saveHistory(addDay(h, day));
    render(); toast('Événement ajouté au suivi');
  },
  'hist-del-day'(date) { saveHistory({ ...state.history, days: state.history.days.filter((d) => d.date !== date) }); render(); },
  'hist-apply-forecast'(date) {
    const f = forecastFor(date); const m = state.model; let added = 0;
    const abs = f.abs.flat().filter((c) => c.p >= 0.12).sort((a, b) => b.p - a.p).slice(0, 2);
    for (const c of abs) {
      const w = m.workers.find((x) => x.stage === c.st.id && !x.locked && !m.events.some((e) => e.type === 'absence' && e.workerId === x.id));
      if (w) { m.events.push({ type: 'absence', workerId: w.id, at: Math.max(0, (c.h - m.settings.startHour) * 60), until: null }); added++; }
    }
    const peak = f.vol.filter((v) => v.pPeak >= 0.5).sort((a, b) => b.pPeak - a.pPeak)[0];
    if (peak) {
      const at = Math.max(0, (peak.h - m.settings.startHour) * 60);
      m.events.push({ type: 'peak', at, count: Math.max(10, Math.round(peak.expected - peak.normal)), spread: 30, deadline: Math.min(at + 90, m.settings.horizon), route: m.batches[0]?.route ?? null });
      added++;
    }
    if (!added) { toast('Aucun risque assez élevé ce jour-là pour être ajouté.'); return; }
    changed(); go('diagnostic'); toast(`${added} imprévu${added > 1 ? 's' : ''} probable${added > 1 ? 's' : ''} ajouté${added > 1 ? 's' : ''} à la journée`);
  },
});

function blockedHint(err) {
  const msg = String(err?.message ?? err);
  if (/Failed to fetch|NetworkError|Load failed|CSP|blocked/i.test(msg)) return 'Impossible de joindre l’IA : réseau coupé, ou page ouverte dans un aperçu qui bloque les connexions externes (comme l’aperçu Claude). Ouvre Crewline depuis ton site ou le fichier autonome.';
  if (/40[13]/.test(msg)) return 'La clé d’IA est refusée. Vérifie-la dans l’onglet IA.';
  if (/429/.test(msg)) return 'Limite gratuite atteinte pour le moment. Réessaie dans une minute.';
  return msg;
}

async function fileToMedia(file) {
  const dataUrl = await new Promise((res, rej) => { const r = new FileReader(); r.onload = () => res(r.result); r.onerror = rej; r.readAsDataURL(file); });
  // Réduit les grandes photos (moins de données envoyées, lecture aussi bonne)
  const img = await new Promise((res, rej) => { const i = new Image(); i.onload = () => res(i); i.onerror = rej; i.src = dataUrl; });
  const scale = Math.min(1, 1800 / Math.max(img.width, img.height));
  const c = document.createElement('canvas'); c.width = Math.round(img.width * scale); c.height = Math.round(img.height * scale);
  c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
  const out = c.toDataURL('image/jpeg', 0.88);
  return { mime: 'image/jpeg', base64: out.split(',')[1] };
}

function stopRecording() {
  try { recognition?.stop(); } catch { /* déjà arrêté */ }
  try { if (recorder && recorder.state !== 'inactive') recorder.stop(); } catch { /* déjà arrêté */ }
  if (state.assist) state.assist.recording = false;
}

async function runAssist(input) {
  const a = state.assist; const m = state.model;
  a.busy = true; a.error = null; render();
  const suggest = state.history.days.length ? (w, sid) => models().transfer.suggest(w, sid) : null;
  try {
    let patch;
    if (aiReady()) {
      try { patch = await aiExtract(state.ai, m, a.kind, input); }
      catch (e) {
        if (input.text) { patch = localParse(input.text, m); a.error = `${blockedHint(e)} J’ai utilisé la lecture locale à la place.`; }
        else throw e;
      }
    } else if (input.text) patch = localParse(input.text, m);
    else throw new Error('Lire une photo ou un enregistrement demande une clé d’IA (onglet IA).');
    a.patch = patch; a.suggest = suggest;
    a.rows = previewChanges(m, patch);
    a.selected = new Set(a.rows.filter((r) => r.ok).map((r) => `${r.kind}:${r.index}`));
  } catch (e) { a.error = blockedHint(e); }
  a.busy = false; render();
}
