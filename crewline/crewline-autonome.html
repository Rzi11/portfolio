export function validateScenario(s) {
  const issues = [];
  const push = (field, message) => issues.push({ field, message });
  if (!isInt(s.horizon, 15, 720)) push('settings.horizon', 'La durée simulée doit être comprise entre 15 minutes et 12 heures.');
  if (!isInt(s.startHour, 0, 23)) push('settings.startHour', 'Heure de début invalide.');
  if (!isInt(s.transitionMinutes, 0, 60)) push('settings.transitionMinutes', 'Le temps de changement de poste doit être entre 0 et 60 minutes.');
  if (!isInt(s.transferMinutes, 0, 60)) push('settings.transferMinutes', 'Le délai entre deux postes doit être entre 0 et 60 minutes.');
  if (!['fifo', 'deadline'].includes(s.priority)) push('settings.priority', 'Ordre de traitement invalide.');
  if (!Array.isArray(s.stages) || s.stages.length < 1) { push('stages', 'Ajoute au moins un poste dans « Entrepôt ».'); return issues; }
  if (s.stages.length > 30) { push('stages', 'Maximum 30 postes.'); return issues; }
  const ids = new Set();
  for (const st of s.stages) {
    if (!/^[a-zA-Z0-9_-]{1,40}$/.test(st.id) || ids.has(st.id)) push(`stage.${st.id}`, 'Identifiant de poste invalide ou répété.');
    ids.add(st.id);
    if (!st.name?.trim()) push(`stage.${st.id}`, 'Un poste n’a pas de nom.');
    if (!['line', 'order'].includes(st.unit)) push(`stage.${st.id}`, `Unité invalide pour ${st.name}.`);
    if (!(st.rate > 0 && st.rate <= 5000)) push(`stage.${st.id}`, `Cadence de référence invalide pour ${st.name}.`);
    if (!isInt(st.maxWorkers, 1, 30)) push(`stage.${st.id}`, `Nombre de places invalide pour ${st.name}.`);
    if (!(st.maxRate >= 0 && st.maxRate <= 100000)) push(`stage.${st.id}`, `Plafond machine invalide pour ${st.name}.`);
  }
  for (const st of s.stages) for (const p of st.after ?? []) {
    if (!ids.has(p)) push(`stage.${st.id}`, `${st.name} dépend d’un poste supprimé.`);
    if (p === st.id) push(`stage.${st.id}`, `${st.name} ne peut pas dépendre de lui-même.`);
  }
  const cycle = findCycle(s.stages);
  if (cycle) push('stages', `Boucle entre postes : ${cycle.map((id) => s.stages.find((x) => x.id === id)?.name ?? id).join(' → ')}. Retire une dépendance.`);
  if (!Array.isArray(s.workers) || s.workers.length < 1) { push('workers', 'Ajoute au moins une personne dans « Équipe ».'); return issues; }
  if (s.workers.length > 150) { push('workers', 'Maximum 150 personnes.'); return issues; }
  const wids = new Set();
  for (const w of s.workers) {
    const label = w.name || w.id;
    if (!w.id || wids.has(w.id)) push(`worker.${w.id}`, 'Identifiant de personne vide ou répété.');
    wids.add(w.id);
    if (!ids.has(w.stage)) push(`worker.${w.id}`, `${label} : poste de départ inconnu.`);
    else if (!w.skills?.includes(w.stage)) push(`worker.${w.id}`, `${label} doit savoir faire son poste de départ.`);
    if (!isInt(w.start, 0, s.horizon) || !isInt(w.end, 1, s.horizon) || w.end <= w.start) push(`worker.${w.id}`, `${label} : horaires invalides.`);
    for (const b of w.breaks ?? []) {
      if (!isInt(b.duration, 0, 120) || !isInt(b.start, 0, s.horizon) || (b.duration > 0 && (b.start < w.start || b.start + b.duration > w.end))) push(`worker.${w.id}`, `${label} : pause en dehors de ses horaires.`);
    }
    for (const id of w.skills ?? []) {
      if (!ids.has(id)) push(`worker.${w.id}`, `${label} : compétence sur un poste supprimé.`);
      else if (!(w.rates?.[id] > 0 && w.rates[id] <= 5000)) push(`worker.${w.id}`, `${label} : cadence manquante pour ${s.stages.find((x) => x.id === id).name}.`);
    }
  }
  if (!Array.isArray(s.orders) || s.orders.length < 1) push('batches', 'Aucune commande à traiter : ajoute au moins une vague dans « Journée ».');
  if (s.orders?.length > 15000) push('batches', 'Maximum 15 000 commandes par journée simulée.');
  const routesSeen = new Set();
  for (const o of s.orders ?? []) {
    const key = JSON.stringify(o.route ?? null);
    if (!routesSeen.has(key)) {
      routesSeen.add(key);
      if (o.route && (!o.route.length || o.route.some((id) => !ids.has(id)))) push('batches', `Le parcours de « ${o.batch} » doit passer par au moins un poste existant.`);
    }
    if (!isInt(o.arrival, 0, s.horizon - 1)) { push('batches', `Des commandes arrivent après la fin de la période (${o.batch}).`); break; }
    if (!isInt(o.deadline, 1, 2000) || o.deadline < o.arrival) { push('batches', `Échéance avant l’arrivée (${o.batch}).`); break; }
  }
  for (const e of s.events ?? []) {
    if (e.type === 'absence' && (!wids.has(e.workerId) || !isInt(e.at, 0, s.horizon))) push('events', 'Absence : personne ou heure invalide.');
    if (e.type === 'machine' && (!ids.has(e.stage) || !isInt(e.at, 0, s.horizon) || !isInt(e.duration, 1, 720))) push('events', 'Panne : poste, heure ou durée invalide.');
    if (e.type === 'peak' && (!isInt(e.at, 0, s.horizon - 1) || !isInt(e.count, 1, 2000) || !isInt(e.deadline, e.at, 2000))) push('events', 'Pic : heure, quantité ou échéance invalide.');
  }
  return issues;
}

// ---------------------------------------------------------------------------
// Emploi du temps minute par minute
// ---------------------------------------------------------------------------

export const OFF = -1, TRANSITION = -2, BREAK = -3, ABSENT = -4;

// Retourne { grid: Map(workerId -> Int16Array), issues: [] }
export function buildSchedule(s, moves = []) {
  const issues = [];
  const stageIndex = new Map(s.stages.map((st, i) => [st.id, i]));
  const grid = new Map();
  const absences = (s.events ?? []).filter((e) => e.type === 'absence');
  for (const w of s.workers) {
    const row = new Int16Array(s.horizon).fill(OFF);
    const home = stageIndex.get(w.stage);
    for (let t = w.start; t < w.end && t < s.horizon; t++) row[t] = home;
    const mine = moves.filter((m) => m.workerId === w.id).sort((a, b) => a.at - b.at);
    let prevEnd = -1;
    for (const m of mine) {
      const until = m.until ?? w.end;
      const to = stageIndex.get(m.to);
      const label = w.name || w.id;
      if (to === undefined) { issues.push(`${label} : poste de destination inconnu.`); continue; }
      if (w.locked) issues.push(`${label} est verrouillée sur son poste.`);
      if (!w.skills.includes(m.to)) issues.push(`${label} ne sait pas faire « ${s.stages[to].name} ».`);
      if (m.to === w.stage) issues.push(`${label} est déjà à « ${s.stages[to].name} ».`);
      if (!isInt(m.at, w.start, w.end - 1) || !isInt(until, m.at + 1, w.end)) issues.push(`${label} : le déplacement sort de ses horaires.`);
      if (m.at < prevEnd) issues.push(`${label} : deux déplacements se chevauchent.`);
      prevEnd = until + (until < w.end ? s.transitionMinutes : 0);
      for (let t = m.at; t < until && t < s.horizon; t++) row[t] = t < m.at + s.transitionMinutes ? TRANSITION : to;
      if (until < w.end) for (let t = until; t < Math.min(w.end, until + s.transitionMinutes); t++) row[t] = TRANSITION;
    }
    for (const b of w.breaks ?? []) for (let t = b.start; t < b.start + b.duration && t < s.horizon; t++) if (row[t] !== OFF) row[t] = BREAK;
    for (const a of absences) if (a.workerId === w.id) for (let t = a.at; t < (a.until ?? s.horizon) && t < s.horizon; t++) row[t] = ABSENT;
    if (mine.length && absences.some((a) => a.workerId === w.id && mine.some((m) => (m.until ?? w.end) > a.at && m.at < (a.until ?? s.horizon)))) issues.push(`${w.name || w.id} est absente pendant son déplacement.`);
    grid.set(w.id, row);
  }
  // Places disponibles
  for (let t = 0; t < s.horizon; t++) {
    const count = new Array(s.stages.length).fill(0);
    for (const row of grid.values()) if (row[t] >= 0) count[row[t]]++;
    const over = count.findIndex((c, i) => c > s.stages[i].maxWorkers);
    if (over >= 0) { issues.push(`${s.stages[over].name} : ${count[over]} personnes pour ${s.stages[over].maxWorkers} places à ${clock(s.startHour, t)}.`); break; }
  }
  return { grid, issues: [...new Set(issues)] };
}

export function validatePlan(s, moves = []) {
  const v = validateScenario(s);
  if (v.length) return v.map((i) => i.message);
  return buildSchedule(s, moves).issues;
}

// ---------------------------------------------------------------------------
// Simulation
// ---------------------------------------------------------------------------

function machineDown(s, stageId, t) {
  for (const e of s.events ?? []) if (e.type === 'machine' && e.stage === stageId && t >= e.at && t < e.at + e.duration) return true;
  return false;
}

export function slotSize(horizon) { return horizon <= 360 ? 30 : 60; }

export function simulate(s, moves = [], options = {}) {
  const { grid, issues } = buildSchedule(s, moves);
  if (issues.length) throw new Error(issues.join(' '));
  const nS = s.stages.length;
  const size = (o, i) => (s.stages[i].unit === 'line' ? o.lines : 1);
  const key = s.priority === 'fifo'
    ? (o) => [o.arrival, o.id]
    : (o) => [o.deadline, o.arrival, o.id];
  const cmp = (a, b) => { const ka = a.k, kb = b.k; for (let i = 0; i < ka.length; i++) { if (ka[i] < kb[i]) return -1; if (ka[i] > kb[i]) return 1; } return 0; };
  // Parcours : calculé une fois par parcours distinct.
  const routes = new Map();
  const infoFor = (route) => { const k = JSON.stringify(route ?? null); if (!routes.has(k)) routes.set(k, routeInfo(s.stages, route)); return routes.get(k); };
  const orders = s.orders.map((o, n) => {
    const info = infoFor(o.route);
    const rem = new Float64Array(nS); const pend = new Int16Array(nS);
    for (const i of info.stages) { rem[i] = size(o, i); pend[i] = info.prereqs.get(i).length; }
    return { ...o, n, info, rem, pend, done: new Array(nS).fill(null), doneCount: 0, completed: null, k: key(o) };
  });
  // Files par poste : arrivées (triées), débloquées par un poste amont (ordre chronologique), prêtes (triées par priorité).
  const arrivals = Array.from({ length: nS }, () => []);
  const unlocked = Array.from({ length: nS }, () => []);
  const headA = new Array(nS).fill(0); const headU = new Array(nS).fill(0);
  const ready = Array.from({ length: nS }, () => []);
  // Les commandes finies restent dans la file jusqu’au prochain compactage : on avance un index de tête
  // et on compte les commandes encore à traiter, au lieu de recopier la file à chaque minute.
  const headR = new Int32Array(nS); const live = new Int32Array(nS); const dead = new Int32Array(nS);
  for (const o of orders) for (const i of o.info.roots) arrivals[i].push({ o, at: o.arrival });
  for (const a of arrivals) a.sort((x, y) => x.at - y.at || cmp(x.o, y.o));
  const insertReady = (i, o) => {
    const q = ready[i]; let lo = headR[i], hi = q.length;
    while (lo < hi) { const mid = (lo + hi) >> 1; if (cmp(q[mid], o) <= 0) lo = mid + 1; else hi = mid; }
    if (lo === q.length) q.push(o); else q.splice(lo, 0, o);
    live[i]++;
  };

  const workers = s.workers;
  const perWorker = Object.fromEntries(workers.map((w) => [w.id, { units: Object.fromEntries(s.stages.map((st) => [st.id, 0])), active: 0, idle: 0, blocked: 0, transition: 0, break: 0, present: 0 }]));
  const production = Object.fromEntries(s.stages.map((st) => [st.id, 0]));
  const slot = slotSize(s.horizon);
  const nSlots = Math.ceil(s.horizon / slot);
  const slots = Array.from({ length: nSlots }, (_, k) => ({
    start: k * slot, end: Math.min(s.horizon, (k + 1) * slot),
    production: new Array(nS).fill(0), capacity: new Array(nS).fill(0), people: new Array(nS).fill(0), queueMax: new Array(nS).fill(0),
  }));
  const timeline = [];
  const trace = options.trace ? [] : null;
  let transitionMinutes = 0;
  let completedCount = 0;
  const rows = workers.map((w) => grid.get(w.id));
  const pws = workers.map((w) => perWorker[w.id]);
  const rateMin = workers.map((w) => s.stages.map((st) => (w.rates[st.id] ?? 0) / 60));
  const stageCap = new Float64Array(nS); const stageMax = new Float64Array(nS); const stageN = new Int32Array(nS);
  const stageWorkers = Array.from({ length: nS }, () => new Int32Array(workers.length));

  for (let t = 0; t < s.horizon; t++) {
    for (let i = 0; i < nS; i++) {
      while (headA[i] < arrivals[i].length && arrivals[i][headA[i]].at <= t) insertReady(i, arrivals[i][headA[i]++].o);
      while (headU[i] < unlocked[i].length && unlocked[i][headU[i]].at <= t) insertReady(i, unlocked[i][headU[i]++].o);
    }
    const sl = slots[Math.floor(t / slot)];
    const limits = s.stages.map((st) => (machineDown(s, st.id, t) ? 0 : st.maxRate > 0 ? st.maxRate / 60 : Infinity));
    const finished = [];
    const minuteTrace = trace ? {} : null;
    // 1. Qui est où cette minute : capacité cumulée par poste
    stageCap.fill(0); stageMax.fill(0); stageN.fill(0);
    for (let wi = 0; wi < workers.length; wi++) {
      const code = rows[wi][t];
      const pw = pws[wi];
      if (code === OFF || code === ABSENT) { if (minuteTrace) minuteTrace[workers[wi].id] = code; continue; }
      pw.present++;
      if (code === BREAK) { pw.break++; if (minuteTrace) minuteTrace[workers[wi].id] = code; continue; }
      if (code === TRANSITION) { pw.transition++; transitionMinutes++; if (minuteTrace) minuteTrace[workers[wi].id] = code; continue; }
      const r = rateMin[wi][code];
      stageCap[code] += r; if (r > stageMax[code]) stageMax[code] = r;
      stageWorkers[code][stageN[code]++] = wi;
    }
    // 2. Chaque poste traite ses commandes prêtes avec sa capacité cumulée :
    //    une commande avance au plus à la cadence de la personne la plus rapide (une personne par commande à la fois).
    for (let i = 0; i < nS; i++) {
      const n = stageN[i]; if (!n) continue;
      const st = s.stages[i]; const cap = stageCap[i];
      sl.people[i] += n;
      sl.capacity[i] += Math.min(cap, limits[i]);
      if (limits[i] <= EPS) {
        for (let k = 0; k < n; k++) { const wi = stageWorkers[i][k]; pws[wi].blocked++; if (minuteTrace) minuteTrace[workers[wi].id] = { stage: i, used: 0, blocked: true }; }
        continue;
      }
      let budget = Math.min(cap, limits[i]);
      let usedTotal = 0;
      const perOrder = stageMax[i];
      const q = ready[i];
      for (let k = headR[i]; k < q.length && budget > EPS; k++) {
        const o = q[k];
        if (o.rem[i] <= EPS) continue;
        const used = Math.min(budget, o.rem[i], perOrder);
        o.rem[i] -= used; budget -= used; usedTotal += used;
        if (o.rem[i] <= EPS) finished.push([i, o]);
      }
      production[st.id] += usedTotal; sl.production[i] += usedTotal;
      // Le travail est réparti au prorata des cadences : même taux d’occupation pour toutes les personnes du poste
      const share = usedTotal / cap;
      for (let k = 0; k < n; k++) {
        const wi = stageWorkers[i][k]; const pw = pws[wi]; const r = rateMin[wi][i];
        pw.units[st.id] += r * share; pw.active += share; pw.idle += 1 - share;
        if (minuteTrace) minuteTrace[workers[wi].id] = { stage: i, used: r * share };
      }
    }
    const touched = new Set();
    for (const [i, o] of finished) {
      o.done[i] = t + 1; o.doneCount++;
      touched.add(i);
      for (const j of o.info.succs.get(i)) {
        if (--o.pend[j] === 0) unlocked[j].push({ o, at: t + 1 + s.transferMinutes });
      }
      if (o.doneCount === o.info.stages.length) { o.completed = t + 1; completedCount++; }
    }
    for (const [i] of finished) { live[i]--; dead[i]++; }
    for (const i of touched) {
      const q = ready[i];
      while (headR[i] < q.length && q[headR[i]].done[i] !== null) { headR[i]++; dead[i]--; }
      if (headR[i] > 256 || dead[i] > 128) { ready[i] = q.filter((o) => o.done[i] === null); headR[i] = 0; dead[i] = 0; }
    }
    for (let i = 0; i < nS; i++) if (live[i] > sl.queueMax[i]) sl.queueMax[i] = live[i];
    if (trace) trace.push(minuteTrace);
    if ((t + 1) % 5 === 0 || t === s.horizon - 1) timeline.push({ minute: t + 1, completed: completedCount, queues: Array.from(live) });
  }

  const due = orders.filter((o) => o.deadline <= s.horizon);
  const onTime = due.filter((o) => o.completed !== null && o.completed <= o.deadline).length;
  const tardiness = due.reduce((sum, o) => sum + Math.max(0, (o.completed ?? s.horizon) - o.deadline), 0);
  const result = {
    total: orders.length, due: due.length, dueLater: orders.length - due.length,
    completed: completedCount, onTime, late: due.length - onTime, tardiness, remaining: orders.length - completedCount,
    remainingByStage: s.stages.map((_, i) => orders.filter((o) => o.completed === null && o.info.prereqs.has(i) && o.done[i] === null).length),
    onTimePercent: due.length ? (100 * onTime) / due.length : 100,
    moves: clone(moves), awayMinutes: moves.reduce((n, m) => n + ((m.until ?? s.workers.find((w) => w.id === m.workerId).end) - m.at), 0),
    transitionMinutes, production, perWorker, slots, timeline,
  };
  if (options.keepOrders) {
    result.orders = orders.map((o) => ({
      id: o.id, batch: o.batch, lines: o.lines, arrival: o.arrival, deadline: o.deadline, completed: o.completed,
      stages: o.info.stages, prereqs: Object.fromEntries([...o.info.prereqs].map(([k, v]) => [k, v])),
      done: o.done, worked: o.info.stages.map((i) => size(o, i) - o.rem[i]),
    }));
  }
  if (trace) { result.trace = trace; result.grid = grid; }
  return result;
}

// ---------------------------------------------------------------------------
// Diagnostic : charge requise vs capacité, avant tout calcul de plan
// ---------------------------------------------------------------------------

export function diagnose(s) {
  const issues = validateScenario(s);
  if (issues.length) return { ok: false, issues };
  const { grid } = buildSchedule(s, []);
  const slot = slotSize(s.horizon);
  const nSlots = Math.ceil(s.horizon / slot);
  const step = 5;
  const nb = Math.ceil(s.horizon / step);
  const routes = new Map();
  const infoFor = (route) => { const k = JSON.stringify(route ?? null); if (!routes.has(k)) routes.set(k, routeInfo(s.stages, route)); return routes.get(k); };
  const criticals = [];
  const cells = s.stages.map((st, i) => {
    // Capacité minute par minute avec l'affectation de départ.
    const cum = new Float64Array(s.horizon + 1);
    const people = new Array(nSlots).fill(0);
    const capSlot = new Array(nSlots).fill(0);
    for (let t = 0; t < s.horizon; t++) {
      let c = 0, n = 0;
      for (const w of s.workers) if (grid.get(w.id)[t] === i) { c += w.rates[st.id] / 60; n++; }
      if (machineDown(s, st.id, t)) c = 0;
      else if (st.maxRate > 0) c = Math.min(c, st.maxRate / 60);
      cum[t + 1] = cum[t] + c;
      capSlot[Math.floor(t / slot)] += c;
      people[Math.floor(t / slot)] += n / slot;
    }
    const capAt = (m) => cum[Math.min(s.horizon, Math.max(0, m))];
    // Travail que ce poste doit finir : il doit laisser un peu de temps aux postes suivants.
    const M = Array.from({ length: nb + 1 }, () => new Float64Array(nb + 1));
    const spread = new Array(nSlots).fill(0);
    for (const o of s.orders) {
      if (o.deadline > s.horizon) continue;
      const info = infoFor(o.route);
      if (!info.prereqs.has(i)) continue;
      const lead = info.down.get(i) * (s.transferMinutes + 2);
      const work = st.unit === 'line' ? o.lines : 1;
      const a = Math.floor(o.arrival / step);
      const d = Math.max(a + 1, Math.min(nb, Math.floor((o.deadline - lead) / step)));
      M[a][d] += work;
      const lo0 = o.arrival, hi0 = Math.max(o.deadline - lead, o.arrival + 1);
      for (let k = 0; k < nSlots; k++) { const lo = Math.max(lo0, k * slot), hi = Math.min(hi0, (k + 1) * slot); if (hi > lo) spread[k] += (work * (hi - lo)) / (hi0 - lo0); }
    }
    // S[a][d] = travail arrivé à partir de a et dû au plus tard à d
    const S = Array.from({ length: nb + 2 }, () => new Float64Array(nb + 1));
    for (let a = nb; a >= 0; a--) {
      let row = 0;
      for (let d = 0; d <= nb; d++) { row += M[a][d]; S[a][d] = S[a + 1][d] + row; }
    }
    const load = new Array(nSlots).fill(0);
    const worst = new Array(nSlots).fill(null);
    let critical = null; const over = [];
    for (let a = 0; a < nb; a++) {
      for (let d = a + 1; d <= nb; d++) {
        const dem = S[a][d];
        if (dem <= EPS) continue;
        const cap = capAt(d * step) - capAt(a * step);
        const ratio = cap > EPS ? dem / cap : Infinity;
        const win = { stage: st.id, start: a * step, end: Math.min(s.horizon, d * step), demand: dem, capacity: cap, ratio };
        // Fenêtres en surcharge (toutes longueurs), triées plus bas
        if (ratio > 1) over.push(win);
        // Coloration des créneaux : fenêtres de 2 h au plus, pour ne pas lisser les tensions locales
        if (d - a > 120 / step) continue;
        for (let k = Math.floor((a * step) / slot); k < nSlots && k * slot < d * step; k++) {
          // Un créneau prend la valeur d’une fenêtre seulement s’il en fait au moins pour moitié partie.
          const overlap = Math.min((k + 1) * slot, d * step) - Math.max(k * slot, a * step);
          if (overlap * 2 < Math.min(slot, d * step - a * step)) continue;
          if (ratio > load[k]) { load[k] = ratio; worst[k] = win; }
        }
      }
    }
    // Fenêtre critique : la plus courte qui explique au moins 60 % du plus gros manque
    if (over.length) {
      const deficit = (w) => (Number.isFinite(w.ratio) ? w.demand - w.capacity : w.demand);
      const maxDef = Math.max(...over.map(deficit));
      critical = over.filter((w) => deficit(w) >= 0.6 * maxDef).sort((x, y) => (x.end - x.start) - (y.end - y.start) || y.ratio - x.ratio)[0];
    }
    // La fenêtre critique colore aussi ses créneaux, même si elle dure plus de 2 h
    if (critical) for (let k = 0; k < nSlots; k++) {
      const overlap = Math.min((k + 1) * slot, critical.end) - Math.max(k * slot, critical.start);
      if (overlap * 2 >= Math.min(slot, critical.end - critical.start) && critical.ratio > load[k]) { load[k] = critical.ratio; worst[k] = critical; }
    }
    criticals[i] = critical;
    return load.map((l, k) => {
      const hours = (Math.min(s.horizon, (k + 1) * slot) - k * slot) / 60;
      // Charge affichée : travail à faire réparti entre arrivée et heure limite, rapporté à la capacité du créneau.
      // « critical » : le créneau fait partie de la fenêtre où le travail dépasse vraiment la capacité.
      const occ = capSlot[k] > EPS ? spread[k] / capSlot[k] : spread[k] > EPS ? Infinity : 0;
      const lo = k * slot, hi = Math.min(s.horizon, (k + 1) * slot);
      const inCritical = Boolean(critical) && Math.min(hi, critical.end) - Math.max(lo, critical.start) >= (hi - lo) / 2;
      return { stage: st.id, slot: k, start: lo, end: hi, load: occ, windowLoad: l, critical: inCritical, window: worst[k], demandPerHour: spread[k] / hours, capacityPerHour: capSlot[k] / hours, people: people[k], stopped: capSlot[k] <= EPS && people[k] > 0 };
    });
  });
  // Alertes : une par poste, sur sa fenêtre critique (travail à finir > capacité disponible)
  const alerts = [];
  s.stages.forEach((st, i) => {
    const w = criticals[i]; if (!w) return;
    const rates = s.workers.filter((x) => x.skills.includes(st.id)).map((x) => x.rates[st.id]);
    const avgRate = rates.length ? rates.reduce((p, q) => p + q, 0) / rates.length : st.rate;
    const hours = Math.max(1 / 60, (w.end - w.start) / 60);
    const missingPerHour = Number.isFinite(w.ratio) ? (w.demand - w.capacity) / hours : w.demand / hours;
    alerts.push({ stage: st.id, stageName: st.name, start: w.start, end: w.end, windowStart: w.start, windowEnd: w.end, peakLoad: w.ratio, missingPerHour, missingPeople: missingPerHour / avgRate, unit: rateLabel(st) });
  });
  alerts.sort((a, b) => b.missingPeople - a.missingPeople);
  const coverage = s.stages.map((st) => ({ stage: st.id, stageName: st.name, skilled: s.workers.filter((w) => w.skills.includes(st.id)).length, assigned: s.workers.filter((w) => w.stage === st.id).length }));
  const reinforcements = s.stages.map((st) => ({ stage: st.id, candidates: s.workers.filter((w) => !w.locked && w.stage !== st.id && w.skills.includes(st.id)).map((w) => w.id) }));
  return { ok: true, slot, cells, alerts, coverage, reinforcements, orders: s.orders.length, due: s.orders.filter((o) => o.deadline <= s.horizon).length };
}

// ---------------------------------------------------------------------------
// Recherche de plans
// ---------------------------------------------------------------------------

const rankLate = (a, b) => a.late - b.late || a.tardiness - b.tardiness || b.completed - a.completed || a.moves.length - b.moves.length || a.awayMinutes - b.awayMinutes;
const rankLight = (a, b) => a.late - b.late || a.moves.length - b.moves.length || a.awayMinutes - b.awayMinutes || a.tardiness - b.tardiness;
export const compareResults = rankLate;

export function decisionTimes(s) {
  if (Number.isInteger(s.decisionMinute)) return [s.decisionMinute];
  const times = [...new Set((s.events ?? []).map((e) => e.at))].filter((t) => t >= 0 && t < s.horizon).sort((a, b) => a - b);
  return times.length ? times : [0];
}

const planKey = (moves) => moves.map((m) => `${m.workerId}:${m.to}:${m.at}:${m.until}`).sort().join('|');

function* searchGen(s) {
  const baseline = simulate(s);
  const candidates = [{ id: 'base', kind: 'baseline', result: baseline }];
  const seen = new Set(['']);
  const limit = Math.max(1, Math.min(1000, s.maxEvaluations ?? 300));
  const rounds = Math.max(0, Math.min(8, s.maxMoves ?? 3));
  const times = decisionTimes(s);
  let truncated = false;

  const evaluate = (moves) => {
    const k = planKey(moves);
    if (seen.has(k)) return candidates.find((c) => planKey(c.result.moves) === k)?.result ?? null;
    seen.add(k);
    if (buildSchedule(s, moves).issues.length) return null;
    if (candidates.length >= budget) { truncated = true; return null; }
    const result = simulate(s, moves);
    candidates.push({ id: `p${candidates.length}`, kind: 'automatic', result });
    return result;
  };

  // Grand entrepôt : on cible les postes qui coincent le plus, au moment où leur file commence à monter,
  // avec les personnes des postes qui ont de la marge. Les renforts sont d’abord testés jusqu’à la fin
  // du service ; l’étape d’allègement les raccourcit ensuite.
  const fullSize = s.workers.reduce((n, w) => n + (w.locked ? 0 : w.skills.length - 1), 0) * times.length * 3;
  const focused = fullSize > Math.max(120, limit / 2);
  const budget = focused ? Math.min(limit, 330) : limit;
  const peakQ = s.stages.map((_, i) => Math.max(0, ...baseline.slots.map((x) => x.queueMax[i])));
  const stress = s.stages.map((st, i) => peakQ[i] + 3 * baseline.remainingByStage[i]);
  const maxStress = Math.max(1, ...stress);
  const hot = new Set(s.stages.map((st, i) => [st.id, stress[i]]).filter(([, v]) => v > 0).sort((a, b) => b[1] - a[1]).slice(0, 4).map(([id]) => id));
  const stageIdx = new Map(s.stages.map((st, i) => [st.id, i]));
  // Moment où la file d’un poste commence à monter (30 % de son pic), arrondi au quart d’heure précédent
  const riseTime = (i) => { const sl = baseline.slots.find((x) => x.queueMax[i] >= 0.3 * peakQ[i] && peakQ[i] > 0); return sl ? Math.max(0, Math.floor((sl.start - 15) / 15) * 15) : 0; };
  const focusTimes = (to) => [...new Set([riseTime(stageIdx.get(to)), ...times.filter((x) => (s.events ?? []).some((e) => e.at === x && (e.stage === to || e.type !== 'machine')))].filter((x) => x < s.horizon))].slice(0, 3);
  const neighbours = (base) => {
    const out = [];
    for (const w of s.workers) {
      if (w.locked || base.some((m) => m.workerId === w.id)) continue;
      for (const to of w.skills) {
        if (to === w.stage || (focused && !hot.has(to))) continue;
        for (const at of focused ? focusTimes(to) : times) {
          if (at < w.start || at >= w.end) continue;
          const durations = (focused ? [w.end] : [...new Set([at + 60, at + 120, w.end])]).filter((u) => u <= w.end && u > at + s.transitionMinutes);
          for (const until of durations) out.push({ score: (stress[stageIdx.get(to)] - stress[stageIdx.get(w.stage)]) / maxStress - at / s.horizon / 4, moves: [...base, { workerId: w.id, from: w.stage, to, at, until }] });
        }
      }
    }
    // Les plus prometteurs d’abord ; en mode ciblé, on garde les 45 meilleurs par tour
    out.sort((x, y) => y.score - x.score);
    return (focused ? out.slice(0, 45) : out).map((x) => x.moves);
  };

  // 1. Montée gloutonne : à chaque tour, le meilleur mouvement supplémentaire.
  let best = baseline;
  for (let r = 0; r < rounds && !truncated; r++) {
    let next = best;
    for (const moves of neighbours(best.moves)) {
      const res = evaluate(moves);
      if (truncated) break;
      if (res && rankLate(res, next) < 0) next = res;
      yield candidates.length;
    }
    if (next === best) break;
    best = next;
  }
  // 2. Allègement : raccourcir ou retirer des mouvements sans ajouter de retard.
  let light = best;
  let improved = true;
  while (improved && !truncated) {
    improved = false;
    for (let i = 0; i < light.moves.length; i++) {
      const variants = [light.moves.filter((_, j) => j !== i)];
      const m = light.moves[i];
      for (const u of [m.at + 60, m.at + 120]) if (u < m.until && u > m.at + s.transitionMinutes) variants.push(light.moves.map((x, j) => (j === i ? { ...x, until: u } : x)));
      for (const v of variants) {
        const res = evaluate(v);
        if (res && res.late <= best.late && rankLight(res, light) < 0) { light = res; improved = true; }
        yield candidates.length;
      }
      if (improved) break;
    }
  }
  const all = candidates.map((c) => c.result);
  const sorted = [...all].sort(rankLight);
  const efficient = sorted[0];
  const singles = all.filter((r) => r.moves.length === 1).sort(rankLate);
  const simplest = singles[0] && singles[0].late < baseline.late ? singles[0] : null;
  const plans = [{ id: 'base', name: 'Ne rien changer', result: baseline }];
  if (simplest && planKey(simplest.moves) !== planKey(efficient.moves)) plans.push({ id: 'simple', name: 'Un seul renfort', result: simplest });
  if (efficient !== baseline) plans.push({ id: 'best', name: 'Moins de retards', result: efficient });
  return {
    baseline, plans, recommended: plans[plans.length - 1], candidates: all, evaluated: all.length, truncated, times,
    method: `Recherche locale : jusqu’à ${rounds} déplacements, décision à ${times.map((t) => clock(s.startHour, t)).join(', ')}, renforts d’1 h, 2 h ou jusqu’à la fin du service. ${all.length} plans évalués${truncated ? ' (limite atteinte)' : ''}. Pas de garantie d’avoir trouvé le meilleur plan possible.`,
  };
}

const workMinutes = (s) => s.workers.reduce((n, w) => n + Math.max(0, Math.min(w.end, s.horizon) - w.start), 0);
export function recommend(s) { const t0 = Date.now(); const g = searchGen(s); let v = g.next(); while (!v.done) v = g.next(); return { ...v.value, elapsedMs: Date.now() - t0, simulatedPersonMinutes: v.value.evaluated * workMinutes(s) }; }
export async function recommendAsync(s, onProgress = () => {}) {
  const t0 = Date.now(); const g = searchGen(s); let v = g.next(); let last = Date.now();
  // Rend la main au navigateur régulièrement pour que l’écran reste fluide
  while (!v.done) { if (Date.now() - last > 60) { onProgress(v.value); await new Promise((r) => setTimeout(r, 0)); last = Date.now(); } v = g.next(); }
  return { ...v.value, elapsedMs: Date.now() - t0, simulatedPersonMinutes: v.value.evaluated * workMinutes(s) };
}

// ---------------------------------------------------------------------------
// Robustesse : le plan reste-t-il utile si les cadences sont différentes ?
// ---------------------------------------------------------------------------

export function scaleRates(s, factor) {
  const c = clone(s);
  for (const w of c.workers) for (const k of Object.keys(w.rates)) w.rates[k] = w.rates[k] * factor;
  return c;
}

export function robustness(s, moves, factors = [0.85, 1.15]) {
  return factors.map((f) => {
    const sc = scaleRates(s, f);
    const base = simulate(sc);
    const plan = simulate(sc, moves);
    return { factor: f, baseLate: base.late, planLate: plan.late, holds: plan.late <= base.late };
  });
}

// ---------------------------------------------------------------------------
// Explications en français
// ---------------------------------------------------------------------------

const fmt = (n) => Math.round(n).toLocaleString('fr-FR');
const joinFr = (xs) => (xs.length <= 1 ? xs.join('') : `${xs.slice(0, -1).join(', ')} et ${xs[xs.length - 1]}`);

export function describeMoves(s, moves) {
  if (!moves.length) return 'Aucun déplacement.';
  const groups = new Map();
  for (const m of moves) {
    const w = s.workers.find((x) => x.id === m.workerId);
    const until = m.until ?? w.end;
    const k = `${m.to}|${m.at}|${until}|${until >= w.end}`;
    if (!groups.has(k)) groups.set(k, { to: m.to, at: m.at, until, toEnd: until >= w.end, who: [] });
    groups.get(k).who.push(w.name || w.id);
  }
  return [...groups.values()].map((g) => {
    const st = s.stages.find((x) => x.id === g.to).name;
    const when = g.toEnd ? `à partir de ${clock(s.startHour, g.at)}` : `de ${clock(s.startHour, g.at)} à ${clock(s.startHour, g.until)}`;
    return `${joinFr(g.who)} → ${st} ${when}`;
  }).join(' ; ');
}

export function explainPlan(s, base, plan) {
  if (!plan.moves.length) {
    return { headline: base.late ? `Sans changement, ${fmt(base.late)} commandes sur ${fmt(base.due)} sont en retard.` : `Sans changement, toutes les commandes dues sont à l’heure.`, sideEffects: [] };
  }
  const gain = base.late - plan.late;
  const headline = gain > 0
    ? `${describeMoves(s, plan.moves)} : ${fmt(gain)} retard${gain > 1 ? 's' : ''} évité${gain > 1 ? 's' : ''} (${fmt(base.late)} → ${fmt(plan.late)}).`
    : gain === 0 ? `${describeMoves(s, plan.moves)} : aucun retard évité.` : `${describeMoves(s, plan.moves)} : ${fmt(-gain)} retards de plus.`;
  const sideEffects = [];
  const origins = [...new Set(plan.moves.map((m) => s.workers.find((w) => w.id === m.workerId).stage))];
  for (const id of origins) {
    const i = s.stages.findIndex((x) => x.id === id); const st = s.stages[i];
    const lost = base.production[id] - plan.production[id];
    const qb = Math.max(...base.slots.map((x) => x.queueMax[i])); const qp = Math.max(...plan.slots.map((x) => x.queueMax[i]));
    const left = plan.remainingByStage[i] - base.remainingByStage[i];
    let text = `${st.name} : ${lost > 0.5 ? `${fmt(lost)} ${unitLabel(st)} traitées en moins sur la période` : 'production inchangée'}, file d’attente maximale ${fmt(qb)} → ${fmt(qp)} commandes`;
    text += left > 0 ? `, ${fmt(left)} commandes restent bloquées à ce poste en fin de période.` : ', sans commande bloquée en fin de période.';
    sideEffects.push(text);
  }
  if (plan.transitionMinutes) sideEffects.push(`${fmt(plan.transitionMinutes)} minutes de trajet entre postes, sans production.`);
  return { headline, sideEffects };
}

export function explainDiagnosis(s, d) {
  if (!d.ok) return { headline: 'Données à corriger avant le diagnostic.', lines: d.issues.map((i) => i.message) };
  if (!d.alerts.length) return { headline: 'Aucun poste n’est surchargé : avec l’affectation prévue, chaque poste a assez de capacité pour tenir les échéances.', lines: [] };
  const a = d.alerts[0];
  const helpers = s.workers.filter((w) => !w.locked && w.stage !== a.stage && w.skills.includes(a.stage)).map((w) => w.rates[a.stage]);
  const helperRate = helpers.length ? helpers.reduce((x, y) => x + y, 0) / helpers.length : null;
  const need = helperRate ? Math.max(1, Math.ceil(a.missingPerHour / helperRate - 0.05)) : null;
  const headline = `${a.stageName} n’aura pas assez de monde entre ${clock(s.startHour, a.windowStart)} et ${clock(s.startHour, a.windowEnd)} : il manque au moins ${Math.ceil(a.missingPerHour)} ${a.unit}${need ? `, soit au moins ${need} renfort${need > 1 ? 's' : ''}` : ''}.`;
  const lines = d.alerts.slice(1).map((x) => `${x.stageName} : tension entre ${clock(s.startHour, x.windowStart)} et ${clock(s.startHour, x.windowEnd)} (il manque au moins ${Math.ceil(x.missingPerHour)} ${x.unit}).`);
  const r = d.reinforcements.find((x) => x.stage === a.stage);
  const helperNames = r.candidates.map((id) => s.workers.find((w) => w.id === id)?.name ?? id);
  lines.push(r.candidates.length ? `Renforts possibles pour ${a.stageName} : ${helperNames.length > 7 ? `${helperNames.slice(0, 6).join(', ')} et ${helperNames.length - 6} autres` : joinFr(helperNames)}.` : `Personne d’autre ne sait faire « ${a.stageName} » : aucun renfort possible.`);
  return { headline, lines };
}

// Crewline — historique et prévisions
// Modèles statistiques entraînés sur l’historique saisi : risques par poste et créneau,
// prévision des volumes et des pics, transfert de performance entre postes.
// Tout tourne dans le navigateur, sans dépendance.

export const HISTORY_VERSION = 1;
export const WEEKDAYS = ['dimanche', 'lundi', 'mardi', 'mercredi', 'jeudi', 'vendredi', 'samedi'];

export function emptyHistory() { return { version: HISTORY_VERSION, demo: false, days: [] }; }

const mean = (xs) => (xs.length ? xs.reduce((a, b) => a + b, 0) / xs.length : 0);
const isoDate = (d) => `${d.getFullYear()}-${String(d.getMonth() + 1).padStart(2, '0')}-${String(d.getDate()).padStart(2, '0')}`;
export const weekdayOf = (date) => new Date(`${date}T12:00:00`).getDay();

// ---------------------------------------------------------------------------
// Enregistrer une journée simulée ou réelle
// ---------------------------------------------------------------------------

// Transforme la journée en cours (modèle + résultat du plan retenu) en entrée d’historique.
export function dayFromModel(model, scenario, result, { date, planName = '', note = '' } = {}) {
  const start = model.settings.startHour;
  const volumes = {};
  for (const o of scenario.orders) { const h = start + Math.floor(o.arrival / 60); volumes[h] = (volumes[h] ?? 0) + 1; }
  const events = [];
  for (const e of model.events) {
    if (e.type === 'absence') {
      const w = model.workers.find((x) => x.id === e.workerId);
      events.push({ type: 'absence', stage: w?.stage ?? null, workerId: e.workerId, at: e.at, until: e.until ?? null });
    } else if (e.type === 'machine') events.push({ type: 'machine', stage: e.stage, at: e.at, until: e.at + e.duration });
    else if (e.type === 'peak') events.push({ type: 'peak', stage: null, at: e.at, count: e.count });
  }
  const rates = [];
  for (const w of model.workers) for (const st of w.skills) if (w.rates[st] > 0) rates.push({ workerId: w.id, stage: st, rate: w.rates[st], main: st === w.stage, measured: model.settings.ratesSource === 'mesurées' });
  return {
    date, weekday: weekdayOf(date), startHour: start, horizon: model.settings.horizon,
    stages: model.stages.map((s) => ({ id: s.id, name: s.name, rate: s.rate })),
    staff: Object.fromEntries(model.stages.map((s) => [s.id, model.workers.filter((w) => w.stage === s.id).length])),
    volumes, orders: scenario.orders.length, late: result?.late ?? null, due: result?.due ?? null,
    events, rates, plan: planName, note,
  };
}

export function addDay(history, day) {
  const h = { ...history, days: history.days.filter((d) => d.date !== day.date) };
  h.days.push(day);
  h.days.sort((a, b) => a.date.localeCompare(b.date));
  return h;
}

// ---------------------------------------------------------------------------
// Historique d’exemple (fictif, avec des tendances que les modèles doivent retrouver)
// ---------------------------------------------------------------------------

export function demoHistory(model, { weeks = 26, endDate = new Date(), seed = 2026 } = {}) {
  let s = seed >>> 0;
  const rnd = () => { s = (1664525 * s + 1013904223) >>> 0; return s / 4294967296; };
  const gauss = () => { const u = rnd() || 1e-9, v = rnd(); return Math.sqrt(-2 * Math.log(u)) * Math.cos(2 * Math.PI * v); };
  const start = model.settings.startHour; const H = model.settings.horizon; const hours = Math.ceil(H / 60);
  const stages = model.stages;
  // Tendances cachées : lundi matin plus d’absences, vendredi plus de commandes, l’emballage plus fragile.
  const absBase = (stId, wd, h) => 0.035 * (wd === 1 ? 2.6 : 1) * (h === start ? 1.8 : 1) * (stId === 'packing' ? 1.5 : 1);
  const lateBase = (wd, h) => (h === start ? 0.10 * (wd === 1 ? 2 : wd === 5 ? 1.4 : 1) : 0.01);
  const volFactor = (wd, h) => (wd === 5 ? 1.25 : wd === 1 ? 1.1 : 1) * (wd === 5 && h === start + 2 ? 1.3 : 1);
  // Vraies capacités de transfert entre postes (indice de performance sur le poste d’arrivée / poste d’origine).
  const transfer = { picking: { packing: 0.8, dispatch: 0.9, reception: 0.85, putaway: 0.9 }, packing: { picking: 0.85, dispatch: 0.95 }, dispatch: { packing: 0.88, picking: 0.82 }, reception: { putaway: 0.9, picking: 0.8 }, putaway: { reception: 0.92, picking: 0.86 } };
  const skill = Object.fromEntries(model.workers.map((w) => [w.id, 0.85 + 0.3 * rnd()]));
  const days = [];
  const end = new Date(endDate); end.setHours(12, 0, 0, 0);
  const d = new Date(end); d.setDate(d.getDate() - weeks * 7);
  const baseVolume = model.batches.reduce((n, b) => n + b.count, 0) / hours;
  let dayIndex = 0;
  while (d < end) {
    d.setDate(d.getDate() + 1);
    const wd = d.getDay(); if (wd === 0 || wd === 6) continue;
    dayIndex++;
    const date = isoDate(d);
    const trend = 1 + 0.004 * dayIndex; // activité qui augmente doucement
    const volumes = {};
    for (let k = 0; k < hours; k++) { const h = start + k; volumes[h] = Math.max(0, Math.round(baseVolume * volFactor(wd, h) * trend * (1 + 0.08 * gauss()))); }
    const events = [];
    for (const st of stages) {
      for (let k = 0; k < hours; k++) {
        const h = start + k;
        if (rnd() < absBase(st.id, wd, h)) {
          const pool = model.workers.filter((w) => w.stage === st.id);
          const w = pool[Math.floor(rnd() * pool.length)];
          events.push({ type: 'absence', stage: st.id, workerId: w?.id ?? null, at: k * 60 + Math.floor(rnd() * 50), until: null });
        }
        if (rnd() < lateBase(wd, h) * (st.id === 'picking' ? 1.2 : 1)) events.push({ type: 'late', stage: st.id, at: k * 60, minutes: 10 + Math.floor(rnd() * 35) });
      }
      if (st.id === 'packing' && wd === 3 && rnd() < 0.35) events.push({ type: 'machine', stage: st.id, at: 120 + Math.floor(rnd() * 60), until: 150 + Math.floor(rnd() * 60) });
    }
    for (let k = 0; k < hours; k++) {
      const h = start + k; const expected = baseVolume * trend;
      if (volumes[h] > expected * 1.2) events.push({ type: 'peak', stage: null, at: k * 60, count: Math.round(volumes[h] - expected) });
    }
    const rates = [];
    for (const w of model.workers) {
      const main = stages.find((x) => x.id === w.stage);
      const mainIdx = skill[w.id] * (1 + 0.04 * gauss());
      rates.push({ workerId: w.id, stage: w.stage, rate: +(main.rate * mainIdx).toFixed(1), main: true, measured: true });
      for (const sid of w.skills) {
        if (sid === w.stage) continue;
        const st = stages.find((x) => x.id === sid); if (!st) continue;
        const ratio = transfer[w.stage]?.[sid] ?? 0.85;
        if (rnd() < 0.5) rates.push({ workerId: w.id, stage: sid, rate: +(st.rate * skill[w.id] * ratio * (1 + 0.06 * gauss())).toFixed(1), main: false, measured: true });
      }
    }
    const absences = events.filter((e) => e.type === 'absence').length;
    const late = Math.max(0, Math.round(absences * 25 + events.filter((e) => e.type === 'machine').length * 40 + (volFactor(wd, start + 2) > 1.2 ? 30 : 0) + 6 * gauss()));
    days.push({
      date, weekday: wd, startHour: start, horizon: H,
      stages: stages.map((x) => ({ id: x.id, name: x.name, rate: x.rate })),
      staff: Object.fromEntries(stages.map((x) => [x.id, model.workers.filter((w) => w.stage === x.id).length])),
      volumes, orders: Object.values(volumes).reduce((a, b) => a + b, 0), late, due: null, events, rates, plan: '', note: '',
    });
  }
  return { version: HISTORY_VERSION, demo: true, days };
}

// ---------------------------------------------------------------------------
// Modèle 1 : risque d’absence ou de retard par poste, jour de la semaine et heure
// Lissage bayésien (Beta) : le taux observé est tiré vers la moyenne du poste
// tant qu’il y a peu de jours observés.
// ---------------------------------------------------------------------------

const affects = (e, hour, day) => {
  const lo = (hour - day.startHour) * 60, hi = lo + 60;
  // Absences et retards : on prévoit le risque qu’ils COMMENCENT dans ce créneau.
  if (e.type === 'late' || e.type === 'absence') return e.at >= lo && e.at < hi;
  const until = e.until ?? day.horizon;
  return e.at < hi && until > lo;
};

export function hoursOf(history, model) {
  const start = model?.settings.startHour ?? history.days[0]?.startHour ?? 8;
  const H = model?.settings.horizon ?? history.days[0]?.horizon ?? 240;
  return Array.from({ length: Math.ceil(H / 60) }, (_, k) => start + k);
}

export function trainRisk(days, type, stageIds, hours, { strength = 30 } = {}) {
  // Modèle à effets séparés : risque = taux du poste × effet du jour × effet de l’heure,
  // chaque effet étant lissé vers 1 quand il y a peu de données. Il apprend mieux avec
  // des événements rares qu’un comptage case par case.
  const key = (st, wd, h) => `${st}|${wd}|${h}`;
  const cell = new Map(); const byStage = new Map(); const byWd = new Map(); const byHour = new Map();
  let N = 0, K = 0;
  const bump = (map, k, hit) => { const c = map.get(k) ?? { n: 0, k: 0 }; c.n++; c.k += hit; map.set(k, c); };
  for (const day of days) for (const st of stageIds) for (const h of hours) {
    const hit = day.events.some((e) => e.type === type && e.stage === st && affects(e, h, day)) ? 1 : 0;
    bump(cell, key(st, day.weekday, h), hit); bump(byStage, st, hit); bump(byWd, day.weekday, hit); bump(byHour, h, hit);
    N++; K += hit;
  }
  const g = (K + 0.5) / (N + 10);
  const factor = (map, k, m = 20) => { const c = map.get(k) ?? { n: 0, k: 0 }; return (c.k + m * g) / (c.n + m) / g; };
  const predict = (st, wd, h) => {
    const s = (byStage.get(st) ?? { n: 0, k: 0 });
    const ps = (s.k + 20 * g) / (s.n + 20);
    const prior = Math.min(0.95, ps * factor(byWd, wd) * factor(byHour, h));
    const c = cell.get(key(st, wd, h)) ?? { n: 0, k: 0 };
    return { p: (c.k + strength * prior) / (c.n + strength), n: c.n, observed: c.n ? c.k / c.n : null, base: ps, dayEffect: factor(byWd, wd), hourEffect: factor(byHour, h) };
  };
  return { predict, global: byStage, rate: g };
}

// ---------------------------------------------------------------------------
// Modèle 2 : volume attendu et risque de pic par heure
// Moyenne par jour de semaine × heure, corrigée de la tendance (régression linéaire
// sur les volumes journaliers), et probabilité de dépasser la normale de 20 %.
// ---------------------------------------------------------------------------

export function trainVolume(days, hours) {
  if (!days.length) return null;
  const t0 = new Date(`${days[0].date}T12:00:00`).getTime();
  const x = days.map((d) => (new Date(`${d.date}T12:00:00`).getTime() - t0) / 864e5);
  const y = days.map((d) => hours.reduce((n, h) => n + (d.volumes?.[h] ?? 0), 0));
  const mx = mean(x), my = mean(y);
  const sxx = x.reduce((n, v) => n + (v - mx) ** 2, 0);
  const slope = sxx ? x.reduce((n, v, i) => n + (v - mx) * (y[i] - my), 0) / sxx : 0;
  const level = (dateStr) => { const dx = (new Date(`${dateStr}T12:00:00`).getTime() - t0) / 864e5; return my ? (my + slope * (dx - mx)) / my : 1; };
  const overall = Object.fromEntries(hours.map((h) => [h, mean(days.map((d) => d.volumes?.[h] ?? 0))]));
  const predict = (dateStr, h) => {
    const wd = weekdayOf(dateStr);
    const same = days.filter((d) => d.weekday === wd);
    const vals = same.map((d, i) => (d.volumes?.[h] ?? 0) / Math.max(0.5, level(d.date)));
    const n = vals.length;
    const m = n ? (mean(vals) * n + overall[h] * 2) / (n + 2) : overall[h];
    const expected = m * level(dateStr);
    const above = same.filter((d) => (d.volumes?.[h] ?? 0) > overall[h] * 1.2 * level(d.date)).length;
    const pPeak = (above + 0.5) / (n + 4);
    return { expected, normal: overall[h] * level(dateStr), pPeak, n };
  };
  return { predict, slopePerWeek: my ? (slope * 7) / my : 0, overall };
}

// ---------------------------------------------------------------------------
// Modèle 3 : transfert de performance entre postes
// Pour chaque personne, indice = cadence mesurée / cadence type du poste.
// Pour les personnes dont A est le poste principal : rapport moyen indice B / indice A.
// ---------------------------------------------------------------------------

export function trainTransfer(days, stages) {
  const ref = Object.fromEntries(stages.map((s) => [s.id, s.rate]));
  const acc = new Map(); // workerId|stage -> [indices]
  const home = new Map(); // workerId -> poste principal le plus fréquent
  for (const d of days) for (const r of d.rates ?? []) {
    if (!ref[r.stage] || !(r.rate > 0)) continue;
    const k = `${r.workerId}|${r.stage}`;
    if (!acc.has(k)) acc.set(k, []);
    acc.get(k).push(r.rate / ref[r.stage]);
    if (r.main) { const h = home.get(r.workerId) ?? {}; h[r.stage] = (h[r.stage] ?? 0) + 1; home.set(r.workerId, h); }
  }
  const idx = new Map(); // workerId -> {stage: index moyen}
  for (const [k, v] of acc) { const [w, st] = k.split('|'); if (!idx.has(w)) idx.set(w, {}); idx.get(w)[st] = mean(v); }
  const mainOf = (w) => { const h = home.get(w); return h ? Object.entries(h).sort((a, b) => b[1] - a[1])[0][0] : null; };
  const pairs = [];
  for (const a of stages) for (const b of stages) {
    if (a.id === b.id) continue;
    // Seules les personnes dont le poste principal est A : on mesure ce qu’elles valent en B.
    const pts = [...idx.entries()].filter(([w, p]) => mainOf(w) === a.id && p[a.id] && p[b.id]).map(([, p]) => [p[a.id], p[b.id]]);
    if (pts.length < 2) { pairs.push({ from: a.id, to: b.id, n: pts.length, ratio: null, r2: null }); continue; }
    const ratio = mean(pts.map(([u, v]) => v / u));
    const spread = Math.sqrt(mean(pts.map(([u, v]) => (v / u - ratio) ** 2)));
    pairs.push({ from: a.id, to: b.id, n: pts.length, ratio, spread, confidence: pts.length >= 15 ? 'bonne' : pts.length >= 5 ? 'moyenne' : 'faible' });
  }
  const get = (from, to) => pairs.find((p) => p.from === from && p.to === to);
  // Cadence suggérée pour une personne sur un nouveau poste
  const suggest = (worker, toStage) => {
    const p = get(worker.stage, toStage);
    if (!p?.ratio || !worker.rates?.[worker.stage] || !ref[worker.stage]) return null;
    return { rate: Math.round((worker.rates[worker.stage] / ref[worker.stage]) * p.ratio * ref[toStage]), ratio: p.ratio, n: p.n };
  };
  return { pairs, get, suggest, people: idx.size };
}

// ---------------------------------------------------------------------------
// Évaluation honnête : on entraîne sur les premiers 75 % des jours et on mesure
// l’erreur sur les 25 % suivants (score de Brier, plus bas = meilleur), comparée
// à une prévision naïve (même taux partout).
// ---------------------------------------------------------------------------

export function backtest(days, stageIds, hours) {
  if (days.length < 12) return null;
  const cut = Math.floor(days.length * 0.75);
  const train = days.slice(0, cut), test = days.slice(cut);
  const out = {};
  for (const type of ['absence', 'late']) {
    const model = trainRisk(train, type, stageIds, hours);
    let bModel = 0, bNaive = 0, n = 0; const scored = [];
    const naive = (() => { let k = 0, m = 0; for (const d of train) for (const st of stageIds) for (const h of hours) { m++; if (d.events.some((e) => e.type === type && e.stage === st && affects(e, h, d))) k++; } return m ? k / m : 0; })();
    for (const d of test) for (const st of stageIds) for (const h of hours) {
      const y = d.events.some((e) => e.type === type && e.stage === st && affects(e, h, d)) ? 1 : 0;
      const p = model.predict(st, d.weekday, h).p;
      bModel += (p - y) ** 2; bNaive += (naive - y) ** 2; n++; scored.push([p, y]);
    }
    // Part des événements réels qui tombent dans les 20 % de créneaux jugés les plus risqués
    scored.sort((a, b) => b[0] - a[0]);
    const top = scored.slice(0, Math.ceil(scored.length * 0.2));
    const total = scored.reduce((s, [, y]) => s + y, 0);
    const capture = total ? top.reduce((s, [, y]) => s + y, 0) / total : null;
    out[type] = { brier: bModel / n, naive: bNaive / n, gain: bNaive ? 1 - bModel / bNaive : 0, cells: n, events: total, capture20: capture };
  }
  const hs = hours;
  const vm = trainVolume(train, hs);
  let eM = 0, eN = 0, k = 0;
  for (const d of test) for (const h of hs) { const p = vm.predict(d.date, h); const y = d.volumes?.[h] ?? 0; eM += Math.abs(p.expected - y); eN += Math.abs(vm.overall[h] - y); k++; }
  out.volume = { mae: eM / k, naive: eN / k, gain: eN ? 1 - eM / eN : 0 };
  out.trainDays = train.length; out.testDays = test.length;
  return out;
}

// Tout entraîner d’un coup pour l’écran Suivi
export function trainAll(history, model) {
  const days = history.days;
  const hours = hoursOf(history, model);
  const stageIds = model.stages.map((s) => s.id);
  return {
    days: days.length, hours,
    absence: trainRisk(days, 'absence', stageIds, hours),
    late: trainRisk(days, 'late', stageIds, hours),
    volume: trainVolume(days, hours),
    transfer: trainTransfer(days, model.stages),
    evaluation: backtest(days, stageIds, hours),
  };
}

// Crewline — saisie assistée (voix, photo, texte libre)
// Deux chemins : une IA (Gemini, ou toute API compatible OpenAI comme Groq) quand une clé
// est réglée, et une lecture locale par règles qui marche sans réseau.
// Dans les deux cas, le résultat est une proposition que la personne valide avant application.

const norm = (s) => String(s ?? '').toLowerCase().normalize('NFD').replace(/[̀-ͯ]/g, '').replace(/[’']/g, "'").trim();
const pad = (n) => String(n).padStart(2, '0');

export const AI_DEFAULTS = { provider: 'gemini', key: '', model: 'gemini-flash-latest', endpoint: 'https://api.groq.com/openai/v1/chat/completions', textModel: 'openai/gpt-oss-120b' };

// ---------------------------------------------------------------------------
// Conversions
// ---------------------------------------------------------------------------

export function matchStage(model, value) {
  if (value == null || value === '') return null;
  const v = norm(value);
  const exact = model.stages.find((s) => norm(s.id) === v || norm(s.name) === v);
  if (exact) return exact.id;
  const part = model.stages.find((s) => v.includes(norm(s.name)) || norm(s.name).includes(v) || norm(s.name).startsWith(v.slice(0, 5)));
  return part?.id ?? null;
}

// "8h", "8 h 30", "08:30", "8h30", "14h" → minutes depuis le début de la période
export function parseClock(value, startHour) {
  if (value == null) return null;
  if (typeof value === 'number') return value;
  const m = /(\d{1,2})\s*(?:h|:|heures?)?\s*(\d{2})?/.exec(norm(value));
  if (!m) return null;
  const h = +m[1], mm = m[2] ? +m[2] : 0;
  if (h > 23 || mm > 59) return null;
  let v = h * 60 + mm - startHour * 60;
  if (v < 0) v += 24 * 60;
  return v;
}

// ---------------------------------------------------------------------------
// Lecture locale de secours (dictée en français, sans IA)
// Exemple : « Inès, préparation, arrivée 8h, départ 12h, pause 9h30 15 minutes,
//             sait faire emballage cadence 35. Karim emballage de 8h à 11h30 »
// ---------------------------------------------------------------------------

export function localParse(text, model) {
  const start = model.settings.startHour;
  const segments = String(text ?? '')
    .replace(/\b(personne suivante|suivant|ensuite|et puis|nouvelle personne)\b/gi, '.')
    .split(/[.;\n]+/).map((s) => s.trim()).filter((s) => s.length > 1);
  const workers = []; const unsure = [];
  const stageWords = model.stages.map((s) => ({ id: s.id, words: [norm(s.name), norm(s.id)] }));
  for (const seg of segments) {
    const n = norm(seg);
    // Nom : premiers mots avant un mot-clé, un poste ou un chiffre
    const stopRe = /\b(prepa\w*|emball\w*|expedi\w*|arriv\w*|commence\w*|debut|depart|part\w*|fin|termine\w*|pause|sait|aussi|polyvalent\w*|cadence|vitesse|de|a|au|poste|fixe)\b|\d/;
    const words = seg.replace(/,/g, ' ').split(/\s+/).filter(Boolean);
    const nameWords = [];
    for (const w of words) {
      if (stopRe.test(norm(w)) || stageWords.some((s) => s.words.some((x) => x && norm(w).startsWith(x.slice(0, 5))))) break;
      nameWords.push(w);
    }
    const name = nameWords.join(' ').replace(/[^\p{L}\p{N}\s-]/gu, '').trim();
    if (!name) { unsure.push(`Phrase sans nom reconnu : « ${seg} »`); continue; }
    // Postes cités, dans l’ordre, en distinguant poste principal et compétences en plus
    const mentions = [];
    for (const s of model.stages) {
      const key = norm(s.name).slice(0, 6);
      let i = n.indexOf(key);
      while (i >= 0) { mentions.push({ id: s.id, i }); i = n.indexOf(key, i + 1); }
    }
    mentions.sort((a, b) => a.i - b.i);
    const extraIdx = n.search(/\b(sait|aussi|polyvalent\w*|peut)\b/);
    const main = mentions.find((x) => extraIdx < 0 || x.i < extraIdx)?.id ?? null;
    const extra = [...new Set(mentions.filter((x) => extraIdx >= 0 && x.i > extraIdx).map((x) => x.id))].filter((x) => x !== main);
    // Heures
    const times = [];
    // « 10h 20 min » = 10h puis 20 minutes : les minutes suivies de « min » ne font pas partie de l’heure
    const re = /(\d{1,2})\s*(?:h|:|heures?)(?:\s*(\d{2})(?!\s*(?:min|mn|minute)))?/g; let m;
    while ((m = re.exec(n))) times.push({ i: m.index, v: parseClock(`${m[1]}h${m[2] ?? ''}`, start), raw: m[0] });
    let st = null, en = null; let br = null;
    for (const t of times) {
      const before = n.slice(Math.max(0, t.i - 22), t.i);
      if (/pause\s*(a|de|vers)?\s*$/.test(before) || (/pause/.test(before) && !/(arriv|depart|fin|commence)/.test(before.slice(before.lastIndexOf('pause'))))) { br = { start: t.v }; continue; }
      if (/(arriv\w*|commence\w*|debut|\bde)\s*(a|vers)?\s*$/.test(before)) { st = t.v; continue; }
      if (/(depart|part\w*|fin|termine\w*|jusqu'?\s*a|\ba)\s*(vers)?\s*$/.test(before)) { en = t.v; continue; }
      if (st == null) st = t.v; else if (en == null) en = t.v;
    }
    if (br) {
      const d = /pause[^.]*?(\d{1,3})\s*(min|minutes|mn)/.exec(n);
      br.duration = d ? +d[1] : 15;
      if (!d) unsure.push(`${name} : durée de pause non précisée, 15 minutes par défaut.`);
    }
    // Cadences : « cadence 35 » s’applique au dernier poste cité avant le nombre
    const rates = {};
    const rr = /(cadence|vitesse|rythme)\s*(de\s*)?(\d+(?:[.,]\d+)?)/g;
    while ((m = rr.exec(n))) {
      const prev = mentions.filter((x) => x.i < m.index).pop();
      const target = prev?.id ?? main;
      if (target) rates[target] = parseFloat(m[3].replace(',', '.'));
    }
    if (!main) unsure.push(`${name} : poste principal non reconnu.`);
    workers.push({
      name, stage: main, start: st, end: en, breaks: br ? [{ start: br.start, duration: br.duration }] : null,
      skills: [main, ...extra].filter(Boolean).map((id) => ({ stage: id, rate: rates[id] ?? null })),
      locked: /\bfixe\b|ne bouge pas|verrouill/.test(n) ? true : null,
    });
  }
  return { workers, batches: [], events: [], unsure, source: 'local' };
}

// ---------------------------------------------------------------------------
// Appel à l’IA
// ---------------------------------------------------------------------------

export function buildPrompt(model, kind, extra = '') {
  const st = model.settings;
  const stages = model.stages.map((s) => `${s.id} = ${s.name} (cadence en ${s.unit === 'line' ? 'lignes' : 'commandes'}/heure)`).join(' ; ');
  const people = model.workers.map((w) => w.name).join(', ');
  return `Tu aides à remplir Crewline, un outil de planning d'équipe en entrepôt.
Postes existants (identifiant = nom) : ${stages}.
Personnes déjà connues : ${people || 'aucune'}.
La journée commence à ${pad(st.startHour)}:00 et dure ${st.horizon} minutes.
${kind === 'team' ? 'On cherche surtout des PERSONNES (équipe, horaires, pauses, postes maîtrisés, cadences).' : 'On cherche surtout des VAGUES de commandes et des IMPRÉVUS (absences, pics, pannes), mais note aussi les personnes si elles apparaissent.'}
${extra}
Réponds UNIQUEMENT avec un objet JSON de cette forme :
{"workers":[{"name":"texte","stage":"identifiant du poste principal ou null","start":"HH:MM ou null","end":"HH:MM ou null","breaks":[{"start":"HH:MM","minutes":15}],"skills":[{"stage":"identifiant","rate":nombre ou null}],"locked":true/false/null}],
"batches":[{"name":"texte","count":nombre,"arrival":"HH:MM","spreadMinutes":nombre ou null,"deadline":"HH:MM","stages":["identifiant"] ou null}],
"events":[{"type":"absence|peak|machine","worker":"nom ou null","stage":"identifiant ou null","at":"HH:MM","until":"HH:MM ou null","count":nombre ou null,"durationMinutes":nombre ou null}],
"unsure":["chaque information douteuse ou illisible, en une phrase"]}
Règles : n'invente aucune valeur ; mets null quand une information manque ; utilise uniquement les identifiants de postes listés (sinon null et signale-le dans "unsure") ; les heures au format 24 h ; une cadence est un nombre d'unités par heure sur ce poste.`;
}

async function callGemini(cfg, prompt, media) {
  const parts = [{ text: prompt }];
  if (media) parts.push({ inline_data: { mime_type: media.mime, data: media.base64 } });
  const url = `https://generativelanguage.googleapis.com/v1beta/models/${encodeURIComponent(cfg.model || AI_DEFAULTS.model)}:generateContent?key=${encodeURIComponent(cfg.key)}`;
  const res = await fetch(url, { method: 'POST', headers: { 'Content-Type': 'application/json' }, body: JSON.stringify({ contents: [{ role: 'user', parts }], generationConfig: { responseMimeType: 'application/json', temperature: 0.1 } }) });
  if (!res.ok) throw new Error(`L’IA a répondu ${res.status} : ${(await res.text()).slice(0, 200)}`);
  const data = await res.json();
  const text = data.candidates?.[0]?.content?.parts?.map((p) => p.text ?? '').join('') ?? '';
  return text;
}

async function callOpenAICompatible(cfg, prompt, media) {
  const content = media && media.mime.startsWith('image/') ? [{ type: 'text', text: prompt }, { type: 'image_url', image_url: { url: `data:${media.mime};base64,${media.base64}` } }] : prompt;
  if (media && !media.mime.startsWith('image/')) throw new Error('Ce fournisseur ne lit pas l’audio : utilise la dictée du navigateur ou Gemini.');
  const res = await fetch(cfg.endpoint || AI_DEFAULTS.endpoint, { method: 'POST', headers: { 'Content-Type': 'application/json', Authorization: `Bearer ${cfg.key}` }, body: JSON.stringify({ model: cfg.textModel || AI_DEFAULTS.textModel, temperature: 0.1, response_format: { type: 'json_object' }, messages: [{ role: 'user', content }] }) });
  if (!res.ok) throw new Error(`L’IA a répondu ${res.status} : ${(await res.text()).slice(0, 200)}`);
  const data = await res.json();
  return data.choices?.[0]?.message?.content ?? '';
}

export function parseJSONLoose(text) {
  const t = String(text ?? '').trim().replace(/^```(?:json)?/i, '').replace(/```$/, '').trim();
  try { return JSON.parse(t); } catch { /* on cherche l’objet dans le texte */ }
  const a = t.indexOf('{'), b = t.lastIndexOf('}');
  if (a >= 0 && b > a) return JSON.parse(t.slice(a, b + 1));
  throw new Error('La réponse de l’IA n’est pas lisible.');
}

// kind : 'team' | 'day' ; input : { text?, media?: {mime, base64} }
export async function aiExtract(cfg, model, kind, input) {
  if (!cfg?.key) throw new Error('Aucune clé d’IA réglée.');
  const extra = input.text ? `Texte à analyser (dicté ou collé) :\n"""${input.text}"""` : input.media?.mime.startsWith('audio/') ? 'Écoute l’enregistrement joint (en français) et extrais les informations.' : 'Lis l’image jointe (capture d’écran ou photo de planning, tableau ou liste) et extrais les informations.';
  const prompt = buildPrompt(model, kind, extra);
  const raw = cfg.provider === 'openai' ? await callOpenAICompatible(cfg, prompt, input.media) : await callGemini(cfg, prompt, input.media);
  return { ...normalizeAI(parseJSONLoose(raw), model), source: cfg.provider === 'openai' ? 'IA (API compatible)' : 'Gemini' };
}

// Remet la réponse de l’IA au format interne (minutes, identifiants de postes)
export function normalizeAI(raw, model) {
  const start = model.settings.startHour;
  const unsure = Array.isArray(raw?.unsure) ? raw.unsure.map(String) : [];
  const workers = (raw?.workers ?? []).filter((w) => w?.name).map((w) => {
    const stage = matchStage(model, w.stage);
    if (w.stage && !stage) unsure.push(`${w.name} : poste « ${w.stage} » inconnu.`);
    const skills = (w.skills ?? []).map((s) => ({ stage: matchStage(model, s.stage), rate: Number.isFinite(+s.rate) && +s.rate > 0 ? +s.rate : null })).filter((s) => s.stage);
    if (stage && !skills.some((s) => s.stage === stage)) skills.unshift({ stage, rate: null });
    return {
      name: String(w.name).trim(), stage,
      start: parseClock(w.start, start), end: parseClock(w.end, start),
      breaks: Array.isArray(w.breaks) && w.breaks.length ? w.breaks.map((b) => ({ start: parseClock(b.start, start), duration: Number.isFinite(+b.minutes) ? +b.minutes : 15 })).filter((b) => b.start != null) : null,
      skills, locked: typeof w.locked === 'boolean' ? w.locked : null,
    };
  });
  const batches = (raw?.batches ?? []).filter((b) => b && Number.isFinite(+b.count)).map((b, i) => ({
    name: b.name ? String(b.name) : `Vague ${i + 1}`, count: Math.round(+b.count),
    arrival: parseClock(b.arrival, start), spread: Number.isFinite(+b.spreadMinutes) ? +b.spreadMinutes : 15,
    deadline: parseClock(b.deadline, start),
    route: Array.isArray(b.stages) && b.stages.length ? b.stages.map((x) => matchStage(model, x)).filter(Boolean) : null,
  })).filter((b) => b.arrival != null && b.deadline != null);
  const events = (raw?.events ?? []).filter((e) => e && ['absence', 'peak', 'machine'].includes(e.type)).map((e) => ({
    type: e.type, worker: e.worker ? String(e.worker) : null, stage: matchStage(model, e.stage),
    at: parseClock(e.at, start), until: parseClock(e.until, start), count: Number.isFinite(+e.count) ? Math.round(+e.count) : null,
    duration: Number.isFinite(+e.durationMinutes) ? Math.round(+e.durationMinutes) : null,
  })).filter((e) => e.at != null);
  return { workers, batches, events, unsure };
}

// Liste des changements proposés, chacun cochable
export function previewChanges(model, patch, suggestRate = null) {
  const rows = [];
  const H = model.settings.horizon;
  patch.workers.forEach((w, i) => {
    const existing = model.workers.find((x) => norm(x.name) === norm(w.name));
    const parts = [];
    if (w.stage) parts.push(`poste ${model.stages.find((s) => s.id === w.stage).name}`);
    if (w.start != null || w.end != null) parts.push(`${w.start != null ? clockOf(model, w.start) : '?'}–${w.end != null ? clockOf(model, w.end) : '?'}`);
    if (w.breaks) parts.push(`pause ${w.breaks.map((b) => `${clockOf(model, b.start)} (${b.duration} min)`).join(', ')}`);
    const sk = w.skills.filter((s) => s.stage !== w.stage);
    if (sk.length) parts.push(`sait aussi ${sk.map((s) => model.stages.find((x) => x.id === s.stage).name).join(', ')}`);
    const rates = w.skills.filter((s) => s.rate).map((s) => `${model.stages.find((x) => x.id === s.stage).name} ${s.rate}/h`);
    if (rates.length) parts.push(`cadence ${rates.join(', ')}`);
    const problems = [];
    if (!existing && !w.stage) problems.push('poste principal manquant');
    if (w.start != null && (w.start < 0 || w.start >= H)) problems.push('arrivée hors de la période');
    if (w.end != null && w.end > H) problems.push('départ après la fin de la période (sera ramené)');
    rows.push({ kind: 'worker', index: i, action: existing ? 'update' : 'add', label: w.name, detail: parts.join(' · ') || 'aucune information utilisable', problems, ok: !problems.some((p) => p.includes('manquant')) });
  });
  patch.batches.forEach((b, i) => rows.push({ kind: 'batch', index: i, action: 'add', label: b.name, detail: `${b.count} commandes · arrivée ${clockOf(model, b.arrival)} · à finir avant ${clockOf(model, b.deadline)}`, problems: b.deadline <= b.arrival ? ['échéance avant l’arrivée'] : [], ok: b.deadline > b.arrival }));
  patch.events.forEach((e, i) => {
    const who = e.worker ? model.workers.find((x) => norm(x.name) === norm(e.worker)) : null;
    const label = e.type === 'absence' ? `Absence${e.worker ? ` de ${e.worker}` : ''}` : e.type === 'peak' ? `Pic de ${e.count ?? '?'} commandes` : `Panne${e.stage ? ` ${model.stages.find((s) => s.id === e.stage).name}` : ''}`;
    const problems = [];
    if (e.type === 'absence' && !who && !patch.workers.some((w) => norm(w.name) === norm(e.worker))) problems.push('personne inconnue');
    if (e.type === 'machine' && !e.stage) problems.push('poste inconnu');
    if (e.type === 'peak' && !e.count) problems.push('quantité manquante');
    rows.push({ kind: 'event', index: i, action: 'add', label, detail: `à ${clockOf(model, e.at)}${e.until != null ? ` jusqu’à ${clockOf(model, e.until)}` : ''}${e.duration ? ` · ${e.duration} min` : ''}`, problems, ok: !problems.length });
  });
  return rows;
}

function clockOf(model, minute) {
  const total = model.settings.startHour * 60 + minute;
  return `${pad(Math.floor(total / 60) % 24)}:${pad(((total % 60) + 60) % 60)}`;
}

// Applique les lignes cochées ; suggestRate(worker, stageId) peut proposer une cadence (modèle de transfert)
export function applyChanges(model, patch, selected, suggestRate = null) {
  const m = JSON.parse(JSON.stringify(model));
  const H = m.settings.horizon;
  const clamp = (v, lo, hi) => Math.max(lo, Math.min(hi, v));
  let added = 0, updated = 0;
  const pick = (kind, i) => selected.has(`${kind}:${i}`);
  patch.workers.forEach((w, i) => {
    if (!pick('worker', i)) return;
    let target = m.workers.find((x) => norm(x.name) === norm(w.name));
    if (!target) {
      const stage = w.stage ?? m.stages[0].id;
      let n = m.workers.length + 1; while (m.workers.some((x) => x.id === `P${pad(n)}`)) n++;
      target = { id: `P${pad(n)}`, name: w.name, stage, skills: [stage], rates: {}, start: 0, end: H, breaks: [], locked: false };
      m.workers.push(target); added++;
    } else updated++;
    if (w.stage) { target.stage = w.stage; if (!target.skills.includes(w.stage)) target.skills.push(w.stage); }
    if (w.start != null) target.start = clamp(w.start, 0, H - 1);
    if (w.end != null) target.end = clamp(w.end, target.start + 1, H);
    if (w.breaks) target.breaks = w.breaks.map((b) => ({ start: clamp(b.start, target.start, target.end - 1), duration: clamp(b.duration, 0, 120) })).filter((b) => b.start + b.duration <= target.end);
    for (const s of w.skills) { if (!target.skills.includes(s.stage)) target.skills.push(s.stage); if (s.rate) target.rates[s.stage] = s.rate; }
    for (const sid of target.skills) {
      if (target.rates[sid] > 0) continue;
      const ref = m.stages.find((x) => x.id === sid).rate;
      const sug = sid !== target.stage && suggestRate ? suggestRate(target, sid) : null;
      target.rates[sid] = sug?.rate ?? (sid === target.stage ? ref : Math.round(ref * 0.85));
    }
    if (w.locked != null) target.locked = w.locked;
  });
  patch.batches.forEach((b, i) => {
    if (!pick('batch', i)) return;
    let n = m.batches.length + 1; while (m.batches.some((x) => x.id === `V${n}`)) n++;
    m.batches.push({ id: `V${n}`, name: b.name, count: clamp(b.count, 0, 2000), arrival: clamp(b.arrival, 0, H - 1), spread: clamp(b.spread, 0, 480), deadline: Math.max(b.deadline, b.arrival + 1), route: b.route });
    added++;
  });
  patch.events.forEach((e, i) => {
    if (!pick('event', i)) return;
    if (e.type === 'absence') {
      const w = m.workers.find((x) => norm(x.name) === norm(e.worker)); if (!w) return;
      m.events.push({ type: 'absence', workerId: w.id, at: clamp(e.at, 0, H), until: e.until ?? null });
    } else if (e.type === 'peak') m.events.push({ type: 'peak', at: clamp(e.at, 0, H - 1), count: e.count ?? 50, spread: 15, deadline: Math.min(e.until ?? e.at + 90, 2000), route: null });
    else if (e.stage) m.events.push({ type: 'machine', stage: e.stage, at: clamp(e.at, 0, H), duration: e.duration ?? Math.max(5, (e.until ?? e.at + 30) - e.at) });
    added++;
  });
  return { model: m, added, updated };
}

// ---------- Schéma du flux (graphe des postes) ----------
// tags : { [stageId]: texte sous le nom } · hot : Set des postes à mettre en avant
function flowGraph(stages, { tags = {}, hot = new Set(), label = 'Schéma du flux entre les postes', selected = null, pick = null } = {}) {
  if (!stages.length) return '<div class="flowwrap empty"><p class="muted">Aucun poste pour l’instant. Ajoute ton premier poste avec « + Ajouter un poste » : le schéma se dessinera ici.</p></div>';
  const depths = stageDepths(stages);
  const idx = new Map(stages.map((s, i) => [s.id, i]));
  const cols = new Map(); const pos = new Map();
  const byDepth = [...stages].sort((a, b) => depths[a.id] - depths[b.id] || idx.get(a.id) - idx.get(b.id));
  for (const st of byDepth) {
    const d = depths[st.id];
    if (!cols.has(d)) cols.set(d, new Set());
    const used = cols.get(d);
    const firstPred = (st.after ?? []).map((p) => pos.get(p)).find(Boolean);
    let row = firstPred ? firstPred.row : 0;
    while (used.has(row)) row++;
    used.add(row); pos.set(st.id, { d, row });
  }
  const colW = 220, rowH = 110, r = 15, padX = 130, padY = 40;
  const nCols = Math.max(...[...pos.values()].map((p) => p.d)) + 1;
  const nRows = Math.max(...[...pos.values()].map((p) => p.row)) + 1;
  const W = padX * 2 + (nCols - 1) * colW, H = padY + nRows * rowH;
  const xy = (id) => { const p = pos.get(id); return [padX + p.d * colW, padY + p.row * rowH]; };
  const edges = stages.flatMap((st) => (st.after ?? []).filter((p) => pos.has(p)).map((p) => {
    const [x1, y1] = xy(p), [x2, y2] = xy(st.id);
    const mid = (x1 + x2) / 2;
    const faded = selected && !(selected.has(p) && selected.has(st.id));
    return `<path d="M${x1} ${y1} C${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" fill="none" stroke="${stageColor(idx.get(p))}" stroke-width="7" stroke-linecap="round" ${faded ? 'opacity=".15"' : ''}/>`;
  })).join('');
  const short = (s) => (s.length > 20 ? `${s.slice(0, 19)}…` : s);
  const nodes = stages.map((st) => {
    const [x, y] = xy(st.id); const i = idx.get(st.id); const isHot = hot.has(st.id);
    if (selected) {
      const on = selected.has(st.id);
      return `<g class="pick ${on ? 'on' : 'off'}" data-action="${pick}" data-arg="${esc(st.id)}" role="button" tabindex="0" aria-pressed="${on}" aria-label="${esc(st.name)} : ${on ? 'dans le parcours, cliquer pour retirer' : 'hors parcours, cliquer pour ajouter'}">
        <circle cx="${x}" cy="${y}" r="${r + 18}" fill="transparent"/>
        <circle cx="${x}" cy="${y}" r="${on ? r + 3 : r}" fill="${on ? stageColor(i) : 'var(--surface)'}" stroke="${on ? 'var(--ink)' : stageColor(i)}" stroke-width="${on ? 5 : 4}"/>
        ${on ? `<path d="M${x - 7} ${y} l5 5 l9 -10" fill="none" stroke="var(--surface)" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>` : ''}
        <text x="${x}" y="${y + 38}" text-anchor="middle" class="g-label">${esc(short(st.name))}</text></g>`;
    }
    return `<g><circle cx="${x}" cy="${y}" r="${isHot ? r + 3 : r}" fill="${isHot ? 'var(--accent)' : 'var(--surface)'}" stroke="${isHot ? 'var(--ink)' : stageColor(i)}" stroke-width="${isHot ? 7 : 6}"/>
      <text x="${x}" y="${y + 38}" text-anchor="middle" class="g-label">${esc(short(st.name))}</text>
      ${tags[st.id] ? `<text x="${x}" y="${y + 56}" text-anchor="middle" class="g-tag ${isHot ? 'hot' : ''}">${esc(tags[st.id])}</text>` : ''}</g>`;
  }).join('');
  // Peu de postes : le schéma est centré et grand. Beaucoup : il rétrécit pour tout montrer.
  const vw = Math.max(W, 640), vh = Math.max(H, 200) + 70;
  const vb = [(W - vw) / 2, (H - vh) / 2 - 15, vw, vh].map((v) => +v.toFixed(1)).join(' ');
  return `<div class="flowwrap" data-vb="${vb}">
    <svg class="flowgraph" viewBox="${vb}" preserveAspectRatio="xMidYMid meet" ${selected ? 'role="group"' : 'role="img"'} aria-label="${esc(label)}">${edges}${nodes}</svg>
    <div class="flow-tools"><button class="btn small" data-flowzoom="in" aria-label="Zoomer">+</button><button class="btn small" data-flowzoom="out" aria-label="Dézoomer">−</button><button class="btn small" data-flowzoom="fit">Tout voir</button></div>
    <span class="flow-hint">Glisse pour te déplacer</span>
  </div>`;
}

function getPath(obj, path) { return path.split('.').reduce((o, k) => (o == null ? o : o[k]), obj); }
function setPath(obj, path, value) {
  const keys = path.split('.'); const last = keys.pop();
  const target = keys.reduce((o, k) => o[k], obj);
  target[last] = value;
}
function readInput(el) {
  const kind = el.dataset.kind || 'text';
  if (kind === 'bool') return el.checked;
  if (kind === 'int') { const v = parseInt(el.value, 10); return Number.isFinite(v) ? v : null; }
  if (kind === 'num') { const v = parseFloat(String(el.value).replace(',', '.')); return Number.isFinite(v) ? v : null; }
  if (kind === 'time') return fromTime(el.value);
  if (kind === 'nullable-time') return el.value ? fromTime(el.value) : null;
  if (kind === 'date') return el.value || '';
  return el.value;
}

      <div class="fields" style="grid-template-columns:repeat(auto-fill,minmax(150px,1fr))">

        <div class="field"><label for="st-uname-${i}">Nom de l’unité (facultatif)</label><input id="st-uname-${i}" data-path="stages.${i}.unitName" value="${esc(st.unitName ?? '')}" placeholder="${st.unit === 'line' ? 'lignes' : 'commandes'}"></div>
        <div class="field"><label for="st-rate-${i}">Cadence type (${rateLabel(st)})</label><input id="st-rate-${i}" type="number" min="1" step="1" data-kind="stage-rate" data-index="${i}" value="${st.rate}"></div>
        <div class="field"><label for="st-max-${i}">Places</label><input id="st-max-${i}" type="number" min="1" max="30" data-kind="int" data-path="stages.${i}.maxWorkers" value="${st.maxWorkers}"></div>
        <div class="field"><label for="st-cap-${i}">Plafond machine (${rateLabel(st)})</label><input id="st-cap-${i}" type="number" min="0" data-kind="num" data-path="stages.${i}.maxRate" value="${st.maxRate}" placeholder="0"></div>

      <div class="row" style="margin-top:auto">

  const cards = m.stages.length > 8 ? stageListHTML(cardFor) : `<div class="stage-grid">${m.stages.map(cardFor).join('')}</div>`;

  const hours = Array.from({ length: 24 }, (_, h) => `<option value="${h}" ${h === st.startHour ? 'selected' : ''}>${String(h).padStart(2, '0')}:00</option>`).join('');
